[project]
name = "kourai-mcp-forge"
version = "0.1.0"
description = "MCP server for kourai forge file operations (roots-scoped)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=1.26.0,<2",
    "kourai-common",
]

[project.scripts]
kourai-mcp-forge = "kourai_mcp_forge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kourai_mcp_forge"]
