  response:
    body:
      string: "<!DOCTYPE html><html lang=\"en\"><head><title>A Little Is Enough:
        Circumventing Defenses For Distributed Learning</title></head><body><article>
        <h1>A Little Is Enough: Circumventing Defenses For Distributed Learning</h1>
        <p>We propose a novel Byzantine attack on distributed learning. The attack
        exploits the statistical properties of gradient aggregation. Byzantine participants
        perturb updates within the statistical envelope of honest gradients, making
        the attack undetectable by existing defenses.</p><p>Our method demonstrates
        that small but well-crafted changes are sufficient to circumvent Byzantine-tolerant
        aggregation rules.</p></article></body></html>"
    headers:
      Content-Type:
      - text/html; charset=utf-8
    status:
      code: 200
      message: OK
