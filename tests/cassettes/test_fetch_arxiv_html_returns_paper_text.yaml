        ltx_tag_bibitem\">[1]</span>\n<span class=\"ltx_bibblock\"><span class=\"ltx_text
        ltx_bib_author\">Y. Allouah, S. Farhadkhani, R. Guerraoui, N. Gupta, R. Pinot,
        and J. Stephan</span><span class=\"ltx_text ltx_bib_year\"> (2023-25\u201327
        Apr)</span>\n</span>\n<span class=\"ltx_bibblock\"><span class=\"ltx_text
        ltx_bib_title\">Fixing by mixing: a recipe for optimal byzantine ml under
        heterogeneity</span>.\n</span>\n<span class=\"ltx_bibblock\">In <span class=\"ltx_text
        ltx_bib_inbook\">Proceedings of The 26th International Conference on Artificial
        Intelligence and Statistics</span>,  <span class=\"ltx_text ltx_bib_editor\">F.
