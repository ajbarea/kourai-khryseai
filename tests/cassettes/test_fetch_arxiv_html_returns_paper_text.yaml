        [cs.LG] 15 May 2026</div>\n</div><div class=\"ltx_page_content\">\n<article
        class=\"ltx_document ltx_authors_1line\">\n<h1 class=\"ltx_title ltx_title_document\">Practical
        Validity Conditions for \n<br class=\"ltx_break\">Byzantine-Tolerant Federated
        Learning</h1>\n<div class=\"ltx_authors\">\n<span class=\"ltx_creator ltx_role_author\">\n<span
        class=\"ltx_personname\">M\xE9lanie Cambus \n<br class=\"ltx_break\">Aalto
        University, Finland\n<br class=\"ltx_break\"><span id=\"id1.1.id1\" class=\"ltx_text
        ltx_font_typewriter\">melanie.cambus@aalto.fi</span> \n<br class=\"ltx_break\">&amp;Darya
        Melnyk \n<br class=\"ltx_break\">Technical University Berlin \n<br class=\"ltx_break\"><span
        id=\"id2.2.id2\" class=\"ltx_text ltx_font_typewriter\">melnyk@tu-berlin.de</span>
        \n<br class=\"ltx_break\">Tijana Milentijevi\u0107<span id=\"footnotex1\"
        class=\"ltx_note ltx_role_footnotemark\"><sup class=\"ltx_note_mark\">1</sup><span
        class=\"ltx_note_outer\"><span class=\"ltx_note_content\"><sup class=\"ltx_note_mark\">1</sup><span
