        id=\"id3.3.id3\" class=\"ltx_text ltx_font_typewriter\">tijana.milentijevic@tu-berlin.de</span>
        \n<br class=\"ltx_break\">&amp;Stefan Schmid<span id=\"footnotex2\" class=\"ltx_note
        ltx_role_footnotemark\"><sup class=\"ltx_note_mark\">1</sup><span class=\"ltx_note_outer\"><span
