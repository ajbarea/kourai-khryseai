        </span><span class=\"ltx_tag ltx_tag_note\">1</span></span></span></span>
        \n<br class=\"ltx_break\">Technical University Berlin \n<br class=\"ltx_break\"><span
        id=\"id4.4.id4\" class=\"ltx_text ltx_font_typewriter\">stefan.schmid@tu-berlin.de</span>
        \n<br class=\"ltx_break\">\n</span><span class=\"ltx_author_notes\">Supported
        by German Research Foundation (DFG), SPP 2378, project ReNO-2 (511099228),
        2025-2029</span></span>\n</div>\n\n<div id=\"abstract1\" class=\"ltx_abstract\">\n<h6
        class=\"ltx_title ltx_title_abstract\">Abstract</h6>\n<p class=\"ltx_p\">Robust
        aggregation is the core operation in Byzantine-tolerant federated learning.
        To ensure the quality of aggregation independently of data distribution or
        attacks, validity conditions are needed. They provide geometric guarantees
        of where the output of the aggregation must lie. The widespread convex validity
        requires the output to lie in the convex hull of the honest vectors. Although
        this guarantee is strong in theory, it is poorly suited to modern federated
        learning systems, as it has dimension-dependent resilience and excludes many
        practical aggregation rules.\nWe introduce the minimum enclosing ball (<math
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>)
        validity condition for robust aggregation, as well as its multiplicative relaxation,
        <math class=\"ltx_Math\" alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, where <math class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        is a constant. We show that exact <math class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity still suffers from limited resilience, while relaxed <math class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity is achievable if a majority of clients is honest, i.e. <math class=\"ltx_Math\"
        alttext=\"n&gt;2t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>. We
        give an optimal MinMax-<math class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        rule for the relaxed condition with the bound <math class=\"ltx_Math\" alttext=\"c&lt;\\sqrt{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>&lt;</mo><msqrt><mn>2</mn></msqrt></mrow><annotation
        encoding=\"application/x-tex\">c&lt;\\sqrt{2}</annotation></semantics></math>
        and prove explicit relaxed-<math class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        guarantees for standard aggregators including minimum-diameter averaging,
        medoid and geometric median. Finally, we relate <math class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity to convex, relaxed-convex and box validity studied in prior literature,
        thus providing a systematic map of geometric validity conditions for Byzantine-robust
        aggregation.\nOur results show that relaxed <math class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity connects validity conditions in distributed computing and Byzantine-tolerant
        aggregation rules, and offers a practical alternative to convex validity.</p>\n</div>\n<section
        id=\"S1\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\">\n<span
        class=\"ltx_tag ltx_tag_section\">1 </span>Introduction</h2>\n\n<div id=\"S1.p1\"
        class=\"ltx_para\">\n<p id=\"S1.p1.1\" class=\"ltx_p\">Federated Learning
        (FL) systems aggregate high-dimensional updates computed by many clients\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">McMahan<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib51\" title=\"Communication-efficient learning
        of deep networks from decentralized data\" class=\"ltx_ref\">2017</a>)</cite>.\nWhen
        some clients are <span id=\"S1.p1.1.1\" class=\"ltx_text ltx_font_italic\">Byzantine</span>\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Lamport<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib55\" title=\"The byzantine generals problem\"
        class=\"ltx_ref\">2019</a>)</cite> and exhibit unplanned or even malicious
        behavior, the server can no longer trust the received vectors, since malicious
        clients may send arbitrary updates\_<cite class=\"ltx_cite ltx_citemacro_cite\">Yin<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib58\" title=\"Byzantine-robust
        distributed learning: towards optimal statistical rates\" class=\"ltx_ref\">2018b</a>);
        Kairouz and McMahan (<a href=\"#bib.bib54\" title=\"Advances and open problems
        in federated learning\" class=\"ltx_ref\">2021</a>); Guerraoui<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib4\" title=\"Byzantine machine
        learning: a primer\" class=\"ltx_ref\">2024</a>); Allouah<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib52\" title=\"Towards trustworthy
        federated learning with untrusted participants\" class=\"ltx_ref\">2025b</a>,
        <a href=\"#bib.bib53\" title=\"Adaptive gradient clipping for robust federated
        learning\" class=\"ltx_ref\">a</a>)</cite>. Also benign failures or poisoned
        data can influence aggregation. As distributed learning is increasingly deployed
        in critical domains such as healthcare\_<cite class=\"ltx_cite ltx_citemacro_cite\">Nguyen<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib56\" title=\"Federated
        learning for smart healthcare: a survey\" class=\"ltx_ref\">2022</a>)</cite>
        or banking\_<cite class=\"ltx_cite ltx_citemacro_cite\">Long<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib57\" title=\"Federated learning
        for open banking\" class=\"ltx_ref\">2020</a>)</cite>, robustness to Byzantine
        clients has become a central concern.\nRobust aggregation rules are therefore
        used to ensure that the vector applied by the server remains representative
        of the honest (i.e., non-Byzantine) clients. A central question is how to
        define this requirement independently of data distribution, or attacks.</p>\n</div>\n<div
        id=\"S1.p2\" class=\"ltx_para\">\n<p id=\"S1.p2.1\" class=\"ltx_p\">This can
        be formalized using <em id=\"S1.p2.1.1\" class=\"ltx_emph ltx_font_italic\">validity
        conditions</em>, which specify where the aggregation output is allowed to
        lie as a function of the honest input vectors. Validity conditions are hence
        a foundation for Byzantine-tolerant FL.\nWhen all nodes have identically distributed
        data, nodes that show Byzantine behavior can be viewed as outliers\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Yin<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib58\" title=\"Byzantine-robust distributed
        learning: towards optimal statistical rates\" class=\"ltx_ref\">2018b</a>);
        Blanchard<span class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib5\"
        title=\"Machine learning with adversaries: byzantine tolerant gradient descent\"
        class=\"ltx_ref\">2017</a>); El Mhamdi<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib39\" title=\"The hidden vulnerability of
        distributed learning in Byzantium\" class=\"ltx_ref\">2018</a>)</cite>. This
        makes it possible to filter out such nodes in the training and achieve agreement
        close to the desired output (typically the average of non-faulty gradients).
        However, if the data is distributed heterogeneously, the quality of the ML
        model may drop if outliers are removed from the training process.\nTherefore,
        researchers have recently made great efforts to develop aggregation methods
        for heterogeneous data, including trimmed mean\_<cite class=\"ltx_cite ltx_citemacro_cite\">Yin<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib38\" title=\"Byzantine-robust
        distributed learning: towards optimal statistical rates\" class=\"ltx_ref\">2018a</a>);
        El-Mhamdi<span class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib7\"
        title=\"Collaborative learning in the jungle (decentralized, byzantine, heterogeneous,
        asynchronous and nonconvex learning)\" class=\"ltx_ref\">2021</a>)</cite>,
        minimum diameter averaging (MDA)\_<cite class=\"ltx_cite ltx_citemacro_cite\">El-Mhamdi<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib7\" title=\"Collaborative
        learning in the jungle (decentralized, byzantine, heterogeneous, asynchronous
        and nonconvex learning)\" class=\"ltx_ref\">2021</a>)</cite>, geometric median\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Pillutla<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib36\" title=\"Robust aggregation for federated
        learning\" class=\"ltx_ref\">2022</a>); Cambus<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib35\" title=\"Approximate agreement algorithms
        for byzantine collaborative learning\" class=\"ltx_ref\">2025a</a>)</cite>,
        medoid\_<cite class=\"ltx_cite ltx_citemacro_cite\">El Mhamdi<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib39\" title=\"The hidden vulnerability
        of distributed learning in Byzantium\" class=\"ltx_ref\">2018</a>); Bhowmick<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib46\" title=\"Resilient
        multi-agent reinforcement learning using medoid and soft-medoid based aggregation\"
        class=\"ltx_ref\">2022</a>); Xie<span class=\"ltx_text ltx_bib_etal\"> et
        al.</span> (<a href=\"#bib.bib47\" title=\"Generalized byzantine-tolerant
        sgd\" class=\"ltx_ref\">2018</a>)</cite>, Krum\_<cite class=\"ltx_cite ltx_citemacro_cite\">Blanchard<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib5\" title=\"Machine
        learning with adversaries: byzantine tolerant gradient descent\" class=\"ltx_ref\">2017</a>);
        Xie<span class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib47\"
        title=\"Generalized byzantine-tolerant sgd\" class=\"ltx_ref\">2018</a>);
        Wang<span class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib45\"
        title=\"Federated learning framework based on trimmed mean aggregation rules\"
        class=\"ltx_ref\">2025</a>)</cite>, and coordinate-wise median\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Yin<span class=\"ltx_text ltx_bib_etal\"> et al.</span>
        (<a href=\"#bib.bib38\" title=\"Byzantine-robust distributed learning: towards
        optimal statistical rates\" class=\"ltx_ref\">2018a</a>); Cambus<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib37\" title=\"Coordinate-wise
        median in byzantine federated learning\" class=\"ltx_ref\">2025b</a>)</cite>.
        These aggregation rules restrict the output region in different ways, and
        hence provide different notions of aggregation quality.</p>\n</div>\n<div
        id=\"S1.p3\" class=\"ltx_para\">\n<p id=\"S1.p3.2\" class=\"ltx_p\">The classical
        validity condition for multidimensional vector aggregation is convex validity\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Mendes and Herlihy (<a href=\"#bib.bib10\"
        title=\"Multidimensional Approximate Agreement in Byzantine Asynchronous Systems\"
        class=\"ltx_ref\">2013</a>); Vaidya and Garg (<a href=\"#bib.bib9\" title=\"Byzantine
        Vector Consensus in Complete Graphs\" class=\"ltx_ref\">2013</a>); Mendes<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib11\" title=\"Multidimensional
        agreement in byzantine systems\" class=\"ltx_ref\">2015</a>)</cite>, which
        requires the output to lie in the convex hull of the honest clients\u2019
        inputs. Although this validity condition provides a strong geometric guarantee,
        it is not suitable for modern FL systems: In <math id=\"S1.p3.1.m1\" class=\"ltx_Math\"
        alttext=\"d\" display=\"inline\" intent=\":literal\"><semantics><mi>d</mi><annotation
        encoding=\"application/x-tex\">d</annotation></semantics></math> dimensions,
        it can tolerate at most <math id=\"S1.p3.2.m2\" class=\"ltx_Math\" alttext=\"t&lt;n/(d+1)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>&lt;</mo><mrow><mi>n</mi><mo>/</mo><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">t&lt;n/(d+1)</annotation></semantics></math>
        Byzantine clients, which is not suitable for high-dimensional models.\nTherefore,
        practical algorithms for Byzantine-tolerant vector aggregation violate convex
        validity by explicitly allowing the output to leave the convex hull of all
        honest vectors. Note that the non-faulty vectors may lie in a lower-dimensional
        space, while the Byzantine vectors are placed in the full-dimensional space.
        Practical aggregators may still output useful vectors outside the convex hull
        of the honest updates, as long as the output remains close to the honest population.
        Thus, convex validity is often too strict to explain the behavior of robust
        aggregation in federated learning.\n</p>\n</div>\n<div id=\"S1.p4\" class=\"ltx_para\">\n<p
        id=\"S1.p4.8\" class=\"ltx_p\">This work develops a systematic validity framework
        for Byzantine-tolerant vector aggregation. We introduce a novel validity condition
        \u2014 the <em id=\"S1.p4.8.1\" class=\"ltx_emph ltx_font_italic\">minimum
        enclosing ball</em> (<math id=\"S1.p4.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>)
        validity, which requires output to lie in the smallest enclosing ball of the
        honest vectors. Unlike convex validity, <math id=\"S1.p4.2.m2\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity defines a fully-dimensional ball of all non-faulty vectors and naturally
        captures aggregation outputs that leave the convex hull, while remaining within
        the geometric scale of the honest updates. However, we show that <math id=\"S1.p4.3.m3\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity is still too strict, as it also suffers from resilience limitations
        that depend on the geometry of the input. This motivates a relaxed version,
        called <math id=\"S1.p4.4.m4\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S1.p4.5.m5\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, where the radius of the honest minimum enclosing ball is increased
        by a multiplicative factor <math id=\"S1.p4.6.m6\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>.\nOur
        results show that relaxed <math id=\"S1.p4.7.m7\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity provides a useful bridge between validity conditions in distributed
        computing and Byzantine-tolerant aggregation rules. Overall, <math id=\"S1.p4.8.m8\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity offers a practical alternative to convex validity, ensuring that
        aggregation remains close to the honest clients.</p>\n</div>\n<div id=\"S1.p5\"
        class=\"ltx_para ltx_noindent\">\n<p id=\"S1.p5.1\" class=\"ltx_p\"><span
        id=\"S1.p5.1.1\" class=\"ltx_text ltx_font_bold\">Our contributions:</span></p>\n</div>\n<div
        id=\"S1.p6\" class=\"ltx_para\">\n<ol id=\"S1.I1\" class=\"ltx_enumerate\">\n<li
        id=\"S1.I1.i1\" class=\"ltx_item\" style=\"list-style-type:none;\">\n<span
        class=\"ltx_tag ltx_tag_item\">1.</span> \n<div id=\"S1.I1.i1.p1\" class=\"ltx_para\">\n<p
        id=\"S1.I1.i1.p1.4\" class=\"ltx_p\"><span id=\"S1.I1.i1.p1.4.1\" class=\"ltx_text
        ltx_font_bold\">A validity framework for robust aggregation.</span>\nWe introduce
        <math id=\"S1.I1.i1.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity and its multiplicative relaxation, <math id=\"S1.I1.i1.p1.2.m2\"
        class=\"ltx_Math\" alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S1.I1.i1.p1.3.m3\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, where <math id=\"S1.I1.i1.p1.4.m4\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        is a constant. These conditions provide full-dimensional geometric guarantees
        on the aggregation output and are motivated by the behavior of practical Byzantine-tolerant
        aggregation rules.</p>\n</div>\n</li>\n<li id=\"S1.I1.i2\" class=\"ltx_item\"
        style=\"list-style-type:none;\">\n<span class=\"ltx_tag ltx_tag_item\">2.</span>
        \n<div id=\"S1.I1.i2.p1\" class=\"ltx_para\">\n<p id=\"S1.I1.i2.p1.3\" class=\"ltx_p\"><span
        id=\"S1.I1.i2.p1.1.1\" class=\"ltx_text ltx_font_bold\">Limits of exact <math
        id=\"S1.I1.i2.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span> We show that exact <math id=\"S1.I1.i2.p1.2.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity requires agreement inside the intersection of all candidate minimum
        enclosing balls, analogously to the safe area for convex validity\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Vaidya and Garg (<a href=\"#bib.bib9\" title=\"Byzantine
        Vector Consensus in Complete Graphs\" class=\"ltx_ref\">2013</a>)</cite>.
        We prove a lower bound showing that exact <math id=\"S1.I1.i2.p1.3.m2\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity still suffers from poor resilience in high-dimensional settings.</p>\n</div>\n</li>\n<li
        id=\"S1.I1.i3\" class=\"ltx_item\" style=\"list-style-type:none;\">\n<span
        class=\"ltx_tag ltx_tag_item\">3.</span> \n<div id=\"S1.I1.i3.p1\" class=\"ltx_para\">\n<p
        id=\"S1.I1.i3.p1.8\" class=\"ltx_p\"><span id=\"S1.I1.i3.p1.2.2\" class=\"ltx_text
        ltx_font_bold\">Optimal solution for <math id=\"S1.I1.i3.p1.1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\bm{c}\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">\\bm{c}</annotation></semantics></math>-relaxed
        <math id=\"S1.I1.i3.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span>\nWe present MinMax-<math id=\"S1.I1.i3.p1.3.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        an optimal aggregation rule for <math id=\"S1.I1.i3.p1.4.m2\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S1.I1.i3.p1.5.m3\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, that is based on solving a minimization problem in Section\_<a href=\"#S5\"
        title=\"5 Optimal algorithm for MEB validity \u2023 Practical Validity Conditions
        for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">5</span></a> under <math id=\"S1.I1.i3.p1.6.m4\" class=\"ltx_Math\"
        alttext=\"n&gt;2t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>. We
        also present an upper bound for this algorithm, showing that the relaxation
        factor can be upper bounded by <math id=\"S1.I1.i3.p1.7.m5\" class=\"ltx_Math\"
        alttext=\"c&lt;\\sqrt{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>&lt;</mo><msqrt><mn>2</mn></msqrt></mrow><annotation
        encoding=\"application/x-tex\">c&lt;\\sqrt{2}</annotation></semantics></math>.
        For <math id=\"S1.I1.i3.p1.8.m6\" class=\"ltx_Math\" alttext=\"d=2\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>d</mi><mo>=</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">d=2</annotation></semantics></math>, this factor
        is tight.</p>\n</div>\n</li>\n<li id=\"S1.I1.i4\" class=\"ltx_item\" style=\"list-style-type:none;\">\n<span
        class=\"ltx_tag ltx_tag_item\">4.</span> \n<div id=\"S1.I1.i4.p1\" class=\"ltx_para\">\n<p
        id=\"S1.I1.i4.p1.5\" class=\"ltx_p\"><span id=\"S1.I1.i4.p1.5.1\" class=\"ltx_text
        ltx_font_bold\">Validity guarantees for practical aggregators.</span> In Section
        <a href=\"#S6\" title=\"6 Existing algorithms satisfying \U0001D450-MEB-validity
        \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated Learning\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">6</span></a>, we show
        that existing algorithms, including MDA, medoid, and geometric median, satisfy
        <math id=\"S1.I1.i4.p1.1.m1\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-relaxed
        <math id=\"S1.I1.i4.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, where <math id=\"S1.I1.i4.p1.3.m3\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        is at most a constant. Interestingly, the presented relaxation factor for
        these algorithms depends on the ratio between <math id=\"S1.I1.i4.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"t\" display=\"inline\" intent=\":literal\"><semantics><mi>t</mi><annotation
        encoding=\"application/x-tex\">t</annotation></semantics></math> and <math
        id=\"S1.I1.i4.p1.5.m5\" class=\"ltx_Math\" alttext=\"n\" display=\"inline\"
        intent=\":literal\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>,
        and it is smaller, the smaller the ratio.</p>\n</div>\n</li>\n<li id=\"S1.I1.i5\"
        class=\"ltx_item\" style=\"list-style-type:none;\">\n<span class=\"ltx_tag
        ltx_tag_item\">5.</span> \n<div id=\"S1.I1.i5.p1\" class=\"ltx_para\">\n<p
        id=\"S1.I1.i5.p1.3\" class=\"ltx_p\"><span id=\"S1.I1.i5.p1.3.1\" class=\"ltx_text
        ltx_font_bold\">A systematic comparison of validity notions.</span>\nWe compare
        <math id=\"S1.I1.i5.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity to existing validity conditions, such as convex validity, <math id=\"S1.I1.i5.p1.2.m2\"
        class=\"ltx_Math\" alttext=\"(\\delta,p)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mi>p</mi><mo stretchy=\"false\">)</mo></mrow><annotation
        encoding=\"application/x-tex\">(\\delta,p)</annotation></semantics></math>-relaxed
        convex validity\_<cite class=\"ltx_cite ltx_citemacro_cite\">Xiang and Vaidya
        (<a href=\"#bib.bib1\" title=\"Relaxed Byzantine Vector Consensus\" class=\"ltx_ref\">2017</a>)</cite>,
        and box validity\_<cite class=\"ltx_cite ltx_citemacro_cite\">Cambus and Melnyk
        (<a href=\"#bib.bib3\" title=\"Centroid approximation with multidimensional
        approximate agreement protocols\" class=\"ltx_ref\">2026</a>)</cite> in Section\_<a
        href=\"#S7\" title=\"7 Relations between validity conditions \u2023 Practical
        Validity Conditions for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">7</span></a>. This clarifies which validity
        conditions imply others and puts <math id=\"S1.I1.i5.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity into perspective with existing vector aggregation conditions.</p>\n</div>\n</li>\n</ol>\n</div>\n</section>\n<section
        id=\"S2\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\">\n<span
        class=\"ltx_tag ltx_tag_section\">2 </span>Background and Related Work</h2>\n\n<div
        id=\"S2.p1\" class=\"ltx_para ltx_noindent\">\n<p id=\"S2.p1.5\" class=\"ltx_p\"><span
        id=\"S2.p1.5.1\" class=\"ltx_text ltx_font_bold\">Aggregation in federated
        learning.</span>\nThe quality of an aggregation vector in federated learning
        is usually measured in terms of absolute distances from e.g. the average\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">El-Mhamdi<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib7\" title=\"Collaborative learning in the
        jungle (decentralized, byzantine, heterogeneous, asynchronous and nonconvex
        learning)\" class=\"ltx_ref\">2021</a>)</cite>, in terms of resilience\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Blanchard<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib5\" title=\"Machine learning with adversaries:
        byzantine tolerant gradient descent\" class=\"ltx_ref\">2017</a>); Liu<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib6\" title=\"Approximate
        byzantine fault-tolerance in distributed optimization\" class=\"ltx_ref\">2021</a>)</cite>,
        or robustness\_<cite class=\"ltx_cite ltx_citemacro_cite\">Allouah<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib8\" title=\"Fixing by mixing:
        a recipe for optimal byzantine ml under heterogeneity\" class=\"ltx_ref\">2023</a>)</cite>.
        In\_<cite class=\"ltx_cite ltx_citemacro_cite\">Liu<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib6\" title=\"Approximate byzantine
        fault-tolerance in distributed optimization\" class=\"ltx_ref\">2021</a>)</cite>
        the <math id=\"S2.p1.1.m1\" class=\"ltx_Math\" alttext=\"(f,\\varepsilon)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>f</mi><mo>,</mo><mi>\u03B5</mi><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(f,\\varepsilon)</annotation></semantics></math>-Byzantine
        resilience is defined which requires the output to be at a distance of at
        most <math id=\"S2.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\varepsilon\" display=\"inline\"
        intent=\":literal\"><semantics><mi>\u03B5</mi><annotation encoding=\"application/x-tex\">\\varepsilon</annotation></semantics></math>
        from the average of honest nodes. In\_<cite class=\"ltx_cite ltx_citemacro_cite\">Blanchard<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib5\" title=\"Machine
        learning with adversaries: byzantine tolerant gradient descent\" class=\"ltx_ref\">2017</a>)</cite>,
        <math id=\"S2.p1.3.m3\" class=\"ltx_Math\" alttext=\"(\\alpha,f)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>\u03B1</mi><mo>,</mo><mi>f</mi><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\alpha,f)</annotation></semantics></math>-Byzantine
        resilience is tied to the moments of the output function, which are controlled
        by the moments of the honest gradient estimator. In\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Allouah<span class=\"ltx_text ltx_bib_etal\"> et al.</span>
        (<a href=\"#bib.bib8\" title=\"Fixing by mixing: a recipe for optimal byzantine
        ml under heterogeneity\" class=\"ltx_ref\">2023</a>)</cite>, <math id=\"S2.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"(f,\\kappa)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mi>f</mi><mo>,</mo><mi>\u03BA</mi><mo stretchy=\"false\">)</mo></mrow><annotation
        encoding=\"application/x-tex\">(f,\\kappa)</annotation></semantics></math>-robustness
        is defined based on the averages of every subset of <math id=\"S2.p1.5.m5\"
        class=\"ltx_Math\" alttext=\"n-t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> nodes,
        which also includes the Byzantine nodes.\nProposed algorithms for the above
        measures apply relatively simple filtering options of the inputs, such as
        GradFilter\_<cite class=\"ltx_cite ltx_citemacro_cite\">Liu<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib6\" title=\"Approximate byzantine
        fault-tolerance in distributed optimization\" class=\"ltx_ref\">2021</a>)</cite>
        or the Reliable Broadcast \u2014 Trimmed Mean\_<cite class=\"ltx_cite ltx_citemacro_cite\">El-Mhamdi<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib7\" title=\"Collaborative
        learning in the jungle (decentralized, byzantine, heterogeneous, asynchronous
        and nonconvex learning)\" class=\"ltx_ref\">2021</a>)</cite>, they use robust
        aggregation methods, such as medoid\_<cite class=\"ltx_cite ltx_citemacro_cite\">El
        Mhamdi<span class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib39\"
        title=\"The hidden vulnerability of distributed learning in Byzantium\" class=\"ltx_ref\">2018</a>)</cite>,
        coordinate-wise median\_<cite class=\"ltx_cite ltx_citemacro_cite\">Yin<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib38\" title=\"Byzantine-robust
        distributed learning: towards optimal statistical rates\" class=\"ltx_ref\">2018a</a>);
        Cambus<span class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib37\"
        title=\"Coordinate-wise median in byzantine federated learning\" class=\"ltx_ref\">2025b</a>)</cite>,
        minimum diameter averaging (MDA)\_<cite class=\"ltx_cite ltx_citemacro_cite\">El-Mhamdi<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib7\" title=\"Collaborative
        learning in the jungle (decentralized, byzantine, heterogeneous, asynchronous
        and nonconvex learning)\" class=\"ltx_ref\">2021</a>)</cite>, or geometric
        median\_<cite class=\"ltx_cite ltx_citemacro_cite\">Pillutla<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib36\" title=\"Robust aggregation
        for federated learning\" class=\"ltx_ref\">2022</a>); Cambus<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib35\" title=\"Approximate
        agreement algorithms for byzantine collaborative learning\" class=\"ltx_ref\">2025a</a>)</cite>,
        and they apply combinations of these rules, see for example Krum\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Blanchard<span class=\"ltx_text ltx_bib_etal\"> et al.</span>
        (<a href=\"#bib.bib5\" title=\"Machine learning with adversaries: byzantine
        tolerant gradient descent\" class=\"ltx_ref\">2017</a>)</cite>, Multi-Krum\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">El Mhamdi<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib39\" title=\"The hidden vulnerability of
        distributed learning in Byzantium\" class=\"ltx_ref\">2018</a>)</cite>, soft
        medoid\_<cite class=\"ltx_cite ltx_citemacro_cite\">Geisler<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib59\" title=\"Reliable graph
        neural networks via robust aggregation\" class=\"ltx_ref\">2020</a>)</cite>
        and trimmed soft medoid\_<cite class=\"ltx_cite ltx_citemacro_cite\">Canady<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib40\" title=\"Decentralized
        learning using hashgraph consensus\" class=\"ltx_ref\">2025</a>)</cite>.</p>\n</div>\n<div
        id=\"S2.p2\" class=\"ltx_para ltx_noindent\">\n<p id=\"S2.p2.1\" class=\"ltx_p\"><span
        id=\"S2.p2.1.1\" class=\"ltx_text ltx_font_bold\">Validity conditions for
        agreement protocols.</span>\nValidity conditions in agreement protocols ensure
        that the output space is restricted based on the inputs of the nodes. This
        makes validity conditions similar to the quality measures in Byzantine-tolerant
        vector aggregation discussed above. Traditional validity conditions have been
        defined for binary input values\_<cite class=\"ltx_cite ltx_citemacro_cite\">Bracha
        (<a href=\"#bib.bib25\" title=\"Asynchronous byzantine agreement protocols\"
        class=\"ltx_ref\">1987</a>); Ben-Or (<a href=\"#bib.bib26\" title=\"Another
        advantage of free choice (extended abstract): completely asynchronous agreement
        protocols\" class=\"ltx_ref\">1983</a>); Pease<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib27\" title=\"Reaching agreement in the presence
        of faults\" class=\"ltx_ref\">1980</a>); De Prisco<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib20\" title=\"On k-set consensus problems
        in asynchronous systems\" class=\"ltx_ref\">1999</a>); Civit<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib21\" title=\"Polygraph: accountable
        byzantine agreement\" class=\"ltx_ref\">2021</a>); Yin<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib22\" title=\"HotStuff: bft
        consensus with linearity and responsiveness\" class=\"ltx_ref\">2019</a>)</cite>.\nIn
        the more practical multi-valued setting (e.g., with input values in <math
        id=\"S2.p2.1.m1\" class=\"ltx_Math\" alttext=\"\\mathbb{R}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>\u211D</mi><annotation encoding=\"application/x-tex\">\\mathbb{R}</annotation></semantics></math>),
        the correct-proposal validity condition\_<cite class=\"ltx_cite ltx_citemacro_cite\">Fitzi
        and Garay (<a href=\"#bib.bib23\" title=\"Efficient player-optimal protocols
        for strong and differential consensus\" class=\"ltx_ref\">2003</a>); Siu<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib24\" title=\"Reaching
        strong consensus in the presence of mixed failure types\" class=\"ltx_ref\">1998</a>)</cite>
        has been considered. This condition requires the output to be one of the honest
        inputs.\nThe convex validity condition was first introduced in the one-dimensional
        setting to solve approximate agreement\_<cite class=\"ltx_cite ltx_citemacro_cite\">Dolev<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib15\" title=\"Reaching
        approximate agreement in the presence of faults\" class=\"ltx_ref\">1986</a>)</cite>.
        This validity condition is typically also applied in the multi-valued setting,
        and it requires the output to be in the range of the honest values.\nOther
        stronger validity conditions than convex validity have appeared in the literature,
        see for example median validity\_<cite class=\"ltx_cite ltx_citemacro_cite\">Stolz
        and Wattenhofer (<a href=\"#bib.bib28\" title=\"Byzantine Agreement with Median
        Validity\" class=\"ltx_ref\">2015</a>)</cite> or interval validity\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Melnyk and Wattenhofer (<a href=\"#bib.bib29\"
        title=\"Byzantine agreement with interval validity\" class=\"ltx_ref\">2018</a>)</cite>.\nA
        comprehensive comparison of validity conditions for one-dimensional agreement
        is provided in\_<cite class=\"ltx_cite ltx_citemacro_cite\">Civit<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib2\" title=\"On the validity
        of consensus\" class=\"ltx_ref\">2023</a>)</cite>.</p>\n</div>\n<div id=\"S2.p3\"
        class=\"ltx_para\">\n<p id=\"S2.p3.5\" class=\"ltx_p\">Observe that one-dimensional
        validity conditions can be applied coordinate-wise to satisfy validity in
        multiple dimensions\_<cite class=\"ltx_cite ltx_citemacro_cite\">Xiang and
        Vaidya (<a href=\"#bib.bib1\" title=\"Relaxed Byzantine Vector Consensus\"
        class=\"ltx_ref\">2017</a>); Cambus and Melnyk (<a href=\"#bib.bib3\" title=\"Centroid
        approximation with multidimensional approximate agreement protocols\" class=\"ltx_ref\">2026</a>);
        Melnyk and Wattenhofer (<a href=\"#bib.bib29\" title=\"Byzantine agreement
        with interval validity\" class=\"ltx_ref\">2018</a>)</cite>. The corresponding
        validity condition is referred to as box validity in this work.\nConvex validity
        in multiple dimensions has first been mentioned in <cite class=\"ltx_cite
        ltx_citemacro_cite\">Mendes and Herlihy (<a href=\"#bib.bib10\" title=\"Multidimensional
        Approximate Agreement in Byzantine Asynchronous Systems\" class=\"ltx_ref\">2013</a>)</cite>
        and <cite class=\"ltx_cite ltx_citemacro_cite\">Vaidya and Garg (<a href=\"#bib.bib9\"
        title=\"Byzantine Vector Consensus in Complete Graphs\" class=\"ltx_ref\">2013</a>)</cite>,
        as well as in the journal version\_<cite class=\"ltx_cite ltx_citemacro_cite\">Mendes<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib11\" title=\"Multidimensional
        agreement in byzantine systems\" class=\"ltx_ref\">2015</a>)</cite>. In this
        set of work, the output has to be inside the convex hull of the honest input
        vectors. Using Helly\u2019s theorem, the authors show that, to satisfy convex
        validity, it is sufficient to find a vector in the intersection of the convex
        hulls of all subsets of <math id=\"S2.p3.1.m1\" class=\"ltx_Math\" alttext=\"n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> vectors.
        They also provide lower bounds showing that <math id=\"S2.p3.2.m2\" class=\"ltx_Math\"
        alttext=\"t&lt;n/(d+1)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>&lt;</mo><mrow><mi>n</mi><mo>/</mo><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">t&lt;n/(d+1)</annotation></semantics></math>
        is a necessary condition for convex validity.\nTo make the validity condition
        more practical, relaxations of convex validity have been considered\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Xiang and Vaidya (<a href=\"#bib.bib1\"
        title=\"Relaxed Byzantine Vector Consensus\" class=\"ltx_ref\">2017</a>)</cite>.
        Let <math id=\"S2.p3.3.m3\" class=\"ltx_Math\" alttext=\"CH\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>C</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>H</mi></mrow><annotation
        encoding=\"application/x-tex\">CH</annotation></semantics></math> denote the
        convex hull of all honest vectors. In the <math id=\"S2.p3.4.m4\" class=\"ltx_Math\"
        alttext=\"(\\delta,p)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mi>p</mi><mo stretchy=\"false\">)</mo></mrow><annotation
        encoding=\"application/x-tex\">(\\delta,p)</annotation></semantics></math>-relaxed
        vector agreement, the output of an algorithm can be inside <math id=\"S2.p3.5.m5\"
        class=\"ltx_Math\" alttext=\"\\{u\\,\\big|\\,\\|u-v\\|_{p}\\leq\\delta\\ \\
        \\forall\\ v\\in CH\\}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">{</mo><mi>u</mi><mo lspace=\"0.170em\" mathsize=\"1.200em\"
        rspace=\"0.170em\">|</mo><mrow><mrow><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>u</mi><mo>\u2212</mo><mi>v</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mi>p</mi></msub><mo>\u2264</mo><mi>\u03B4</mi></mrow><mspace
        style=\"width:1.167em;\" width=\"1.167em\"></mspace><mrow><mrow><mo rspace=\"0.667em\">\u2200</mo><mi>v</mi></mrow><mo>\u2208</mo><mrow><mi>C</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>H</mi></mrow></mrow></mrow><mo
        stretchy=\"false\">}</mo></mrow><annotation encoding=\"application/x-tex\">\\{u\\,\\big|\\,\\|u-v\\|_{p}\\leq\\delta\\
        \\ \\forall\\ v\\in CH\\}</annotation></semantics></math>\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Xiang and Vaidya (<a href=\"#bib.bib1\" title=\"Relaxed
        Byzantine Vector Consensus\" class=\"ltx_ref\">2017</a>)</cite>.</p>\n</div>\n<div
        id=\"S2.p4\" class=\"ltx_para\">\n<p id=\"S2.p4.1\" class=\"ltx_p\">In contrast
        to previous work, the <math id=\"S2.p4.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity conditions from this paper are directly motivated by the practical
        algorithms, such as MDA\_<cite class=\"ltx_cite ltx_citemacro_cite\">Cambus
        and Melnyk (<a href=\"#bib.bib3\" title=\"Centroid approximation with multidimensional
        approximate agreement protocols\" class=\"ltx_ref\">2026</a>)</cite>, that
        allow the output to be outside of the convex hull of honest vectors, but still
        bound the distance by the maximum diameter of the honest vectors.</p>\n</div>\n</section>\n<section
        id=\"S3\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\">\n<span
        class=\"ltx_tag ltx_tag_section\">3 </span>Model</h2>\n\n<div id=\"S3.p1\"
        class=\"ltx_para\">\n<p id=\"S3.p1.2\" class=\"ltx_p\">We consider the distributed
        client-server model where the server aggregates input vectors <math id=\"S3.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"v\\in\\mathbb{R}^{d}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>v</mi><mo>\u2208</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow><annotation
        encoding=\"application/x-tex\">v\\in\\mathbb{R}^{d}</annotation></semantics></math>
        (gradients or model parameters) of its <math id=\"S3.p1.2.m2\" class=\"ltx_Math\"
        alttext=\"n\" display=\"inline\" intent=\":literal\"><semantics><mi>n</mi><annotation
        encoding=\"application/x-tex\">n</annotation></semantics></math> nodes (clients)
        over reliable communication links. The goal of the server is to decide on
        an agreement vector that best represents the inputs of the non-faulty nodes.</p>\n</div>\n<div
        id=\"S3.p2\" class=\"ltx_para\">\n<p id=\"S3.p2.3\" class=\"ltx_p\">We assume
        that up to <math id=\"S3.p2.1.m1\" class=\"ltx_Math\" alttext=\"t&lt;n/2\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>&lt;</mo><mrow><mi>n</mi><mo>/</mo><mn>2</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">t&lt;n/2</annotation></semantics></math> of
        the nodes can be faulty and show arbitrary behavior. In particular, we assume
        that these nodes are Byzantine: They know the input vectors of all other nodes,
        as well as the agreement algorithm, and they are allowed to collaborate. However,
        Byzantine nodes are node faults and thus cannot occupy other nodes in the
        network. We use <math id=\"S3.p2.2.m2\" class=\"ltx_Math\" alttext=\"H\" display=\"inline\"
        intent=\":literal\"><semantics><mi>H</mi><annotation encoding=\"application/x-tex\">H</annotation></semantics></math>
        to denote the set of honest, i.e., non-faulty, nodes. Note that <math id=\"S3.p2.3.m3\"
        class=\"ltx_Math\" alttext=\"|H|\\geq n-t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mo>\u2265</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|H|\\geq n-t</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S3.p3\" class=\"ltx_para\">\n<p id=\"S3.p3.1\" class=\"ltx_p\">We can
        view the agreement problem as an aggregation method that takes the inputs
        of the nodes and outputs a single vector. For the Byzantine nodes, we assume
        that their collected vectors do not have to correspond to their input vectors.
        To estimate the quality of the aggregation vector, we will consider distances
        between vectors.\nIn this work, we will measure the distance between vectors
        in terms of the Euclidean distance, which is defined as follows:</p>\n</div>\n<div
        id=\"S3.Thmtheorem1\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S3.Thmtheorem1.1.1.1\" class=\"ltx_text ltx_font_bold\">Definition 3.1</span></span><span
        id=\"S3.Thmtheorem1.2.2\" class=\"ltx_text ltx_font_bold\"> </span>(Euclidean
        Distance)<span id=\"S3.Thmtheorem1.3.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S3.Thmtheorem1.p1\" class=\"ltx_para\">\n<p id=\"S3.Thmtheorem1.p1.7\"
        class=\"ltx_p\"><span id=\"S3.Thmtheorem1.p1.7.7\" class=\"ltx_text ltx_font_italic\">For
        any <math id=\"S3.Thmtheorem1.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"v,v^{\\prime}\\in\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>v</mi><mo>,</mo><msup><mi>v</mi><mo>\u2032</mo></msup></mrow><mo>\u2208</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow><annotation
        encoding=\"application/x-tex\">v,v^{\\prime}\\in\\mathbb{R}^{d}</annotation></semantics></math>,
        the Euclidean distance between <math id=\"S3.Thmtheorem1.p1.2.2.m2\" class=\"ltx_Math\"
        alttext=\"v\" display=\"inline\" intent=\":literal\"><semantics><mi>v</mi><annotation
        encoding=\"application/x-tex\">v</annotation></semantics></math> and <math
        id=\"S3.Thmtheorem1.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"v^{\\prime}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>v</mi><mo>\u2032</mo></msup><annotation
        encoding=\"application/x-tex\">v^{\\prime}</annotation></semantics></math>
        is\n<math id=\"S3.Thmtheorem1.p1.4.4.m4\" class=\"ltx_Math\" alttext=\"\\|v-v^{\\prime}\\|_{2}=\\sqrt{\\sum_{i=1}^{d}(v_{i}-v^{\\prime}_{i})^{2}}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>v</mi><mo>\u2212</mo><msup><mi>v</mi><mo>\u2032</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>=</mo><msqrt><mrow><msubsup><mo>\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>d</mi></msubsup><msup><mrow><mo
        lspace=\"0em\" stretchy=\"false\">(</mo><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2212</mo><msubsup><mi>v</mi><mi>i</mi><mo>\u2032</mo></msubsup></mrow><mo
        stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow></msqrt></mrow><annotation
        encoding=\"application/x-tex\">\\|v-v^{\\prime}\\|_{2}=\\sqrt{\\sum_{i=1}^{d}(v_{i}-v^{\\prime}_{i})^{2}}</annotation></semantics></math>,
        where <math id=\"S3.Thmtheorem1.p1.5.5.m5\" class=\"ltx_Math\" alttext=\"v_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>v</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">v_{i}</annotation></semantics></math> is the
        projection of <math id=\"S3.Thmtheorem1.p1.6.6.m6\" class=\"ltx_Math\" alttext=\"v\"
        display=\"inline\" intent=\":literal\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math>
        on coordinate <math id=\"S3.Thmtheorem1.p1.7.7.m7\" class=\"ltx_Math\" alttext=\"i\\in[d]\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>i</mi><mo>\u2208</mo><mrow><mo
        stretchy=\"false\">[</mo><mi>d</mi><mo stretchy=\"false\">]</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">i\\in[d]</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S3.p4\" class=\"ltx_para ltx_noindent\">\n<p id=\"S3.p4.4\" class=\"ltx_p\"><span
        id=\"S3.p4.1.1\" class=\"ltx_text ltx_font_bold\">Vector aggregation with
        <math id=\"S3.p4.1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span>\nIn the following, we formally define the <math id=\"S3.p4.2.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        and <math id=\"S3.p4.3.m2\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-relaxed
        <math id=\"S3.p4.4.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity conditions.</p>\n</div>\n<div id=\"S3.Thmtheorem2\" class=\"ltx_theorem
        ltx_theorem_definition\">\n<h6 class=\"ltx_title ltx_runin ltx_title_theorem\">\n<span
        class=\"ltx_tag ltx_tag_theorem\"><span id=\"S3.Thmtheorem2.2.1.1\" class=\"ltx_text
        ltx_font_bold\">Definition 3.2</span></span><span id=\"S3.Thmtheorem2.3.2\"
        class=\"ltx_text ltx_font_bold\"> </span>(Minimum Enclosing Ball (<math id=\"S3.Thmtheorem2.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>)\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Elzinga and Hearn (<a href=\"#bib.bib32\"
        title=\"The minimum covering sphere problem\" class=\"ltx_ref\">1972</a>)</cite>)<span
        id=\"S3.Thmtheorem2.4.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S3.Thmtheorem2.p1\" class=\"ltx_para\">\n<p id=\"S3.Thmtheorem2.p1.5\"
        class=\"ltx_p\"><span id=\"S3.Thmtheorem2.p1.5.5\" class=\"ltx_text ltx_font_italic\">Given
        a set of vectors <math id=\"S3.Thmtheorem2.p1.1.1.m1\" class=\"ltx_Math\"
        alttext=\"S\" display=\"inline\" intent=\":literal\"><semantics><mi>S</mi><annotation
        encoding=\"application/x-tex\">S</annotation></semantics></math> in <math
        id=\"S3.Thmtheorem2.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>,
        the minimum enclosing ball <math id=\"S3.Thmtheorem2.p1.3.3.m3\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}(S)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>MEB</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>S</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathrm{MEB}(S)</annotation></semantics></math>
        is the smallest ball in <math id=\"S3.Thmtheorem2.p1.4.4.m4\" class=\"ltx_Math\"
        alttext=\"\\mathbb{R}^{d}\" display=\"inline\" intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>
        containing all vectors in <math id=\"S3.Thmtheorem2.p1.5.5.m5\" class=\"ltx_Math\"
        alttext=\"S\" display=\"inline\" intent=\":literal\"><semantics><mi>S</mi><annotation
        encoding=\"application/x-tex\">S</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S3.p5\" class=\"ltx_para\">\n<p id=\"S3.p5.4\" class=\"ltx_p\">In <math
        id=\"S3.p5.1.m1\" class=\"ltx_Math\" alttext=\"\\mathbb{R}^{d}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>,
        the <math id=\"S3.p5.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        can be defined with up to <math id=\"S3.p5.3.m3\" class=\"ltx_Math\" alttext=\"d+1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">d+1</annotation></semantics></math> vectors.
        Observe, however, that only two vectors may be sufficient to define the ball.
        It has been shown in the literature that <math id=\"S3.p5.4.m4\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        can be computed efficiently, using, for example, Welzl\u2019s algorithm\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Welzl (<a href=\"#bib.bib33\" title=\"Smallest
        enclosing disks (balls and ellipsoids)\" class=\"ltx_ref\">1991</a>)</cite>.
        An important property of the minimum enclosing ball is that it is unique.
        This allows us to use this ball to define a new validity condition:</p>\n</div>\n<div
        id=\"S3.Thmtheorem3\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S3.Thmtheorem3.2.1.1\" class=\"ltx_text ltx_font_bold\">Definition 3.3</span></span><span
        id=\"S3.Thmtheorem3.3.2\" class=\"ltx_text ltx_font_bold\"> </span>(<math
        id=\"S3.Thmtheorem3.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity)<span id=\"S3.Thmtheorem3.4.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S3.Thmtheorem3.p1\" class=\"ltx_para\">\n<p id=\"S3.Thmtheorem3.p1.2\"
        class=\"ltx_p\"><math id=\"S3.Thmtheorem3.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math><span
        id=\"S3.Thmtheorem3.p1.2.1\" class=\"ltx_text ltx_font_italic\"> validity
        condition requires that the output vector of each non-faulty node must lie
        inside the minimum enclosing ball of the input vectors of all non-faulty nodes
        denoted by <math id=\"S3.Thmtheorem3.p1.2.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S3.p6\" class=\"ltx_para\">\n<p id=\"S3.p6.4\" class=\"ltx_p\">Since
        the <math id=\"S3.p6.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is unique, the presented <math id=\"S3.p6.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity condition is well defined. This would not be the case for the diameter
        of honest vectors (the maximum distance between any two honest vectors), which
        is a widespread baseline used in practical applications. However, the radius
        of <math id=\"S3.p6.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        can be used to lower bound the diameter of honest vectors, and the diameter
        of <math id=\"S3.p6.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        can be used as an upper bound.</p>\n</div>\n<div id=\"S3.p7\" class=\"ltx_para\">\n<p
        id=\"S3.p7.3\" class=\"ltx_p\">The exact <math id=\"S3.p7.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity is still too strong for high-dimensional applications: as we show
        in Section\_<a href=\"#S4\" title=\"4 Necessary conditions for MEB validity
        \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated Learning\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">4</span></a>, it suffers
        from resilience limitations that depend on geometry of the input space, similarly
        to convex validity. This motivates a relaxed version of <math id=\"S3.p7.2.m2\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. The goal of the relaxation is to exploit the honest majority threshold
        <math id=\"S3.p7.3.m3\" class=\"ltx_Math\" alttext=\"n&gt;2t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>, in
        which practical Byzantine-tolerant aggregation rules perform.</p>\n</div>\n<div
        id=\"S3.Thmtheorem4\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S3.Thmtheorem4.3.1.1\" class=\"ltx_text ltx_font_bold\">Definition 3.4</span></span><span
        id=\"S3.Thmtheorem4.4.2\" class=\"ltx_text ltx_font_bold\"> </span>(<math
        id=\"S3.Thmtheorem4.1.m1\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S3.Thmtheorem4.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity)<span id=\"S3.Thmtheorem4.5.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S3.Thmtheorem4.p1\" class=\"ltx_para\">\n<p id=\"S3.Thmtheorem4.p1.8\"
        class=\"ltx_p\"><span id=\"S3.Thmtheorem4.p1.8.8\" class=\"ltx_text ltx_font_italic\">Let
        <math id=\"S3.Thmtheorem4.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"H\" display=\"inline\"
        intent=\":literal\"><semantics><mi>H</mi><annotation encoding=\"application/x-tex\">H</annotation></semantics></math>
        be the set of input vectors of honest nodes, and let <math id=\"S3.Thmtheorem4.p1.2.2.m2\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        denote their minimum enclosing ball with center in <math id=\"S3.Thmtheorem4.p1.3.3.m3\"
        class=\"ltx_Math\" alttext=\"C_{\\mathrm{MEB}}^{*}\" display=\"inline\" intent=\":literal\"><semantics><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup><annotation
        encoding=\"application/x-tex\">C_{\\mathrm{MEB}}^{*}</annotation></semantics></math>
        and radius <math id=\"S3.Thmtheorem4.p1.4.4.m4\" class=\"ltx_Math\" alttext=\"r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math>. An algorithm
        satisfies <math id=\"S3.Thmtheorem4.p1.5.5.m5\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S3.Thmtheorem4.p1.6.6.m6\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity if every non-faulty node outputs a vector <math id=\"S3.Thmtheorem4.p1.7.7.m7\"
        class=\"ltx_Math\" alttext=\"y\" display=\"inline\" intent=\":literal\"><semantics><mi>y</mi><annotation
        encoding=\"application/x-tex\">y</annotation></semantics></math> such that
        <math id=\"S3.Thmtheorem4.p1.8.8.m8\" class=\"ltx_Math\" alttext=\"\\|y-C_{\\mathrm{MEB}}^{*}\\|_{2}\\leq
        c\\cdot r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><mrow><mi>c</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\|y-C_{\\mathrm{MEB}}^{*}\\|_{2}\\leq c\\cdot
        r^{*}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div id=\"S3.p8\"
        class=\"ltx_para\">\n<p id=\"S3.p8.5\" class=\"ltx_p\">For <math id=\"S3.p8.1.m1\"
        class=\"ltx_Math\" alttext=\"c=1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">c=1</annotation></semantics></math>, this condition
        reduces to exact <math id=\"S3.p8.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. We will refer to <math id=\"S3.p8.3.m3\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        as the relaxation factor in this work, and sometimes call the validity condition
        the <math id=\"S3.p8.4.m4\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-relaxed
        <math id=\"S3.p8.5.m5\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity condition.</p>\n</div>\n<section id=\"S3.SS0.SSS0.Px1\" class=\"ltx_paragraph\">\n<h3
        class=\"ltx_title ltx_title_paragraph\">Implication for honest-gradient bias.</h3>\n\n<div
        id=\"S3.SS0.SSS0.Px1.p1\" class=\"ltx_para\">\n<p id=\"S3.SS0.SSS0.Px1.p1.14\"
        class=\"ltx_p\">A useful consequence of <math id=\"S3.SS0.SSS0.Px1.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S3.SS0.SSS0.Px1.p1.2.m2\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity is that it directly bounds the deviation of the aggregation rule
        from the average honest update. Let <math id=\"S3.SS0.SSS0.Px1.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"\\bar{h}=\\frac{1}{|H|}\\sum_{h\\in H}h\" display=\"inline\" intent=\":literal\"><semantics><mrow><mover
        accent=\"true\"><mi>h</mi><mo>\xAF</mo></mover><mo>=</mo><mrow><mfrac><mn>1</mn><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow></mfrac><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><msub><mo>\u2211</mo><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow></msub><mi>h</mi></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\bar{h}=\\frac{1}{|H|}\\sum_{h\\in H}h</annotation></semantics></math>
        denote the average of the honest client updates and let <math id=\"S3.SS0.SSS0.Px1.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"C^{*}_{\\mathrm{MEB}}\" display=\"inline\" intent=\":literal\"><semantics><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup><annotation
        encoding=\"application/x-tex\">C^{*}_{\\mathrm{MEB}}</annotation></semantics></math>
        and <math id=\"S3.SS0.SSS0.Px1.p1.5.m5\" class=\"ltx_Math\" alttext=\"r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math> be the
        center and radius of the honest minimum enclosing ball. Since <math id=\"S3.SS0.SSS0.Px1.p1.6.m6\"
        class=\"ltx_Math\" alttext=\"\\bar{h}\" display=\"inline\" intent=\":literal\"><semantics><mover
        accent=\"true\"><mi>h</mi><mo>\xAF</mo></mover><annotation encoding=\"application/x-tex\">\\bar{h}</annotation></semantics></math>
        lies in the convex hull of the honest updates and the convex hull is contained
        in the <math id=\"S3.SS0.SSS0.Px1.p1.7.m7\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        we have <math id=\"S3.SS0.SSS0.Px1.p1.8.m8\" class=\"ltx_Math\" alttext=\"\\|\\bar{h}-C^{*}_{\\mathrm{MEB}}\\|_{2}\\leq
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mover accent=\"true\"><mi>h</mi><mo>\xAF</mo></mover><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\|\\bar{h}-C^{*}_{\\mathrm{MEB}}\\|_{2}\\leq
        r^{*}</annotation></semantics></math>.\nTherefore, any output <math id=\"S3.SS0.SSS0.Px1.p1.9.m9\"
        class=\"ltx_Math\" alttext=\"y\" display=\"inline\" intent=\":literal\"><semantics><mi>y</mi><annotation
        encoding=\"application/x-tex\">y</annotation></semantics></math> satisfying
        <math id=\"S3.SS0.SSS0.Px1.p1.10.m10\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S3.SS0.SSS0.Px1.p1.11.m11\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity obeys <math id=\"S3.SS0.SSS0.Px1.p1.12.m12\" class=\"ltx_Math\" alttext=\"\\|y-\\bar{h}\\|_{2}\\leq\\|y-C^{*}_{\\mathrm{MEB}}\\|_{2}+\\|C^{*}_{\\mathrm{MEB}}-\\bar{h}\\|_{2}\\leq(c+1)r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><mover
        accent=\"true\"><mi>h</mi><mo>\xAF</mo></mover></mrow><mo stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup><mo>\u2212</mo><mover
        accent=\"true\"><mi>h</mi><mo>\xAF</mo></mover></mrow><mo stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>\u2264</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>c</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\|y-\\bar{h}\\|_{2}\\leq\\|y-C^{*}_{\\mathrm{MEB}}\\|_{2}+\\|C^{*}_{\\mathrm{MEB}}-\\bar{h}\\|_{2}\\leq(c+1)r^{*}</annotation></semantics></math>.\nThus,
        <math id=\"S3.SS0.SSS0.Px1.p1.13.m13\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S3.SS0.SSS0.Px1.p1.14.m14\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity can be interpreted as a distribution-independent bound on the bias
        of the aggregate relative to the honest average. This connects the geometric
        validity condition to standard analyses of Byzantine-tolerant federated optimization,
        where the effect of aggregation is often controlled through the deviation
        from the honest average update.</p>\n</div>\n<div id=\"S3.SS0.SSS0.Px1.p2\"
        class=\"ltx_para\">\n<p id=\"S3.SS0.SSS0.Px1.p2.3\" class=\"ltx_p\">In order
        to satisfy <math id=\"S3.SS0.SSS0.Px1.p2.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity conditions, we will show that it is necessary to agree inside the
        intersection of <math id=\"S3.SS0.SSS0.Px1.p2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        of all possible <math id=\"S3.SS0.SSS0.Px1.p2.3.m3\" class=\"ltx_Math\" alttext=\"n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> subsets
        of vectors. This area is defined analogously to the safe area for convex validity\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Vaidya and Garg (<a href=\"#bib.bib9\"
        title=\"Byzantine Vector Consensus in Complete Graphs\" class=\"ltx_ref\">2013</a>)</cite>:</p>\n</div>\n<div
        id=\"S3.Thmtheorem5\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S3.Thmtheorem5.2.1.1\" class=\"ltx_text ltx_font_bold\">Definition 3.5</span></span><span
        id=\"S3.Thmtheorem5.3.2\" class=\"ltx_text ltx_font_bold\"> </span>(<math
        id=\"S3.Thmtheorem5.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{safeMEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>safeMEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}</annotation></semantics></math>)<span
        id=\"S3.Thmtheorem5.4.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S3.Thmtheorem5.p1\" class=\"ltx_para\">\n<p id=\"S3.Thmtheorem5.p1.5\"
        class=\"ltx_p\"><span id=\"S3.Thmtheorem5.p1.5.5\" class=\"ltx_text ltx_font_italic\">Let
        <math id=\"S3.Thmtheorem5.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"S\" display=\"inline\"
        intent=\":literal\"><semantics><mi>S</mi><annotation encoding=\"application/x-tex\">S</annotation></semantics></math>
        be a set of vectors in <math id=\"S3.Thmtheorem5.p1.2.2.m2\" class=\"ltx_Math\"
        alttext=\"\\mathbb{R}^{d}\" display=\"inline\" intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>,
        with <math id=\"S3.Thmtheorem5.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"|S|\\geq
        n-t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mi>S</mi><mo
        stretchy=\"false\">|</mo></mrow><mo>\u2265</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|S|\\geq n-t</annotation></semantics></math>.
        Then, the safe area for <math id=\"S3.Thmtheorem5.p1.4.4.m4\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, denoted <math id=\"S3.Thmtheorem5.p1.5.5.m5\" class=\"ltx_Math\"
        alttext=\"\\mathrm{safeMEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>safeMEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}</annotation></semantics></math>,
        is defined as:</span></p>\n<table id=\"S3.Ex1\" class=\"ltx_equation ltx_eqn_table\">\n\n<tbody><tr
        class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_eqn_cell ltx_align_center\"><math
        id=\"S3.Ex1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{safeMEB}_{t}=\\bigcap\\limits_{T\\subseteq
        S,|T|=n-t}\\mathrm{MEB}(T).\" display=\"block\" intent=\":literal\"><semantics><mrow><mrow><msub><mi>safeMEB</mi><mi>t</mi></msub><mo
        rspace=\"0.111em\">=</mo><mrow><munder><mo movablelimits=\"false\">\u22C2</mo><mrow><mrow><mi>T</mi><mo>\u2286</mo><mi>S</mi></mrow><mo>,</mo><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>T</mi><mo stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow></mrow></munder><mrow><mi>MEB</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>T</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow></mrow><mo lspace=\"0em\">.</mo></mrow><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}_{t}=\\bigcap\\limits_{T\\subseteq
        S,|T|=n-t}\\mathrm{MEB}(T).</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p id=\"S3.Thmtheorem5.p1.11\"
        class=\"ltx_p\"><span id=\"S3.Thmtheorem5.p1.11.6\" class=\"ltx_text ltx_font_italic\">For
        <math id=\"S3.Thmtheorem5.p1.6.1.m1\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S3.Thmtheorem5.p1.7.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, we define the <math id=\"S3.Thmtheorem5.p1.8.3.m3\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S3.Thmtheorem5.p1.9.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{safeMEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>safeMEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}</annotation></semantics></math>
        area analogously, by replacing the intersection of minimum enclosing balls
        with the intersection of balls with centers in <math id=\"S3.Thmtheorem5.p1.10.5.m5\"
        class=\"ltx_Math\" alttext=\"C^{*}_{\\mathrm{MEB}(T)}\" display=\"inline\"
        intent=\":literal\"><semantics><msubsup><mi>C</mi><mrow><mi>MEB</mi><mo lspace=\"0em\"
        rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>T</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow><mo>\u2217</mo></msubsup><annotation
        encoding=\"application/x-tex\">C^{*}_{\\mathrm{MEB}(T)}</annotation></semantics></math>
        and radius <math id=\"S3.Thmtheorem5.p1.11.6.m6\" class=\"ltx_Math\" alttext=\"c\\cdot
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">c\\cdot r^{*}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n</section>\n</section>\n<section
        id=\"S4\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\">\n<span
        class=\"ltx_tag ltx_tag_section\">4 </span>Necessary conditions for <math
        id=\"S4.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity</h2>\n\n<div id=\"S4.p1\" class=\"ltx_para\">\n<p id=\"S4.p1.5\"
        class=\"ltx_p\">In this section, we first present the necessary conditions
        that are needed to satisfy <math id=\"S4.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        and <math id=\"S4.p1.2.m2\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S4.p1.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, respectively. We then present an impossibility result showing that
        <math id=\"S4.p1.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity cannot be satisfied if <math id=\"S4.p1.5.m5\" class=\"ltx_Math\"
        alttext=\"n\\leq(d+1)t-d\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2264</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n\\leq(d+1)t-d</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S4.Thmtheorem1\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S4.Thmtheorem1.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 4.1</span></span><span
        id=\"S4.Thmtheorem1.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S4.Thmtheorem1.p1\" class=\"ltx_para\">\n<p id=\"S4.Thmtheorem1.p1.2\"
        class=\"ltx_p\"><math id=\"S4.Thmtheorem1.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math><span
        id=\"S4.Thmtheorem1.p1.2.1\" class=\"ltx_text ltx_font_italic\"> validity
        requires agreement inside <math id=\"S4.Thmtheorem1.p1.2.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{safeMEB}_{t}\" display=\"inline\" intent=\":literal\"><semantics><msub><mi>safeMEB</mi><mi>t</mi></msub><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}_{t}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S4.2\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S4.2.p1\" class=\"ltx_para\">\n<p
        id=\"S4.2.p1.9\" class=\"ltx_p\">Consider an agreement algorithm execution
        where all <math id=\"S4.2.p1.1.m1\" class=\"ltx_Math\" alttext=\"t\" display=\"inline\"
        intent=\":literal\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math>
        nodes are faulty and assume that the faulty nodes follow the protocol with
        their own input vectors chosen in a worst-case manner. Observe that such an
        execution is indifferentiable from an execution where all nodes are honest.
        In the following, we will prove the theorem statement by contradiction. Assume
        that the agreement vector lies outside of some minimum enclosing ball <math
        id=\"S4.2.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}_{i}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>MEB</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}_{i}</annotation></semantics></math>.
        Consider the <math id=\"S4.2.p1.3.m3\" class=\"ltx_Math\" alttext=\"n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> vectors
        for which this ball is the <math id=\"S4.2.p1.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.
        If these input vectors are all from honest nodes, then the algorithm trivially
        violates the <math id=\"S4.2.p1.5.m5\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity condition. Assume next that there are faulty vectors among the <math
        id=\"S4.2.p1.6.m6\" class=\"ltx_Math\" alttext=\"n-t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> vectors
        that span <math id=\"S4.2.p1.7.m7\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>MEB</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}_{i}</annotation></semantics></math>.
        We can construct an identical execution of the algorithm where we swap the
        roles of the honest and the faulty nodes, such that <math id=\"S4.2.p1.8.m8\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}_{i}\" display=\"inline\" intent=\":literal\"><semantics><msub><mi>MEB</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}_{i}</annotation></semantics></math>
        is defined with honest nodes only. Observe that, since the faulty nodes correctly
        followed the protocol, such a swap is always possible. Since both considered
        executions are identical to the algorithm, the algorithm has to output a vector
        outside on <math id=\"S4.2.p1.9.m9\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>MEB</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}_{i}</annotation></semantics></math>
        in both cases. This would lead to a contradiction also in the second case.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S4.p2\" class=\"ltx_para\">\n<p id=\"S4.p2.3\" class=\"ltx_p\">The previous
        proof has not relied on the position of the <math id=\"S4.p2.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        but only on their intersection properties. Therefore, the above proof also
        works for <math id=\"S4.p2.2.m2\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S4.p2.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity:</p>\n</div>\n<div id=\"S4.Thmtheorem2\" class=\"ltx_theorem ltx_theorem_corollary\">\n<h6
        class=\"ltx_title ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S4.Thmtheorem2.1.1.1\" class=\"ltx_text ltx_font_bold\">Corollary 4.2</span></span><span
        id=\"S4.Thmtheorem2.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S4.Thmtheorem2.p1\" class=\"ltx_para\">\n<p id=\"S4.Thmtheorem2.p1.5\"
        class=\"ltx_p\"><math id=\"S4.Thmtheorem2.p1.1.m1\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math><span
        id=\"S4.Thmtheorem2.p1.5.4\" class=\"ltx_text ltx_font_italic\">-<math id=\"S4.Thmtheorem2.p1.2.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity for <math id=\"S4.Thmtheorem2.p1.3.2.m2\" class=\"ltx_Math\" alttext=\"c\\geq
        1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>\u2265</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">c\\geq 1</annotation></semantics></math> requires
        agreement in the <math id=\"S4.Thmtheorem2.p1.4.3.m3\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S4.Thmtheorem2.p1.5.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{safeMEB}_{t}\" display=\"inline\" intent=\":literal\"><semantics><msub><mi>safeMEB</mi><mi>t</mi></msub><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}_{t}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S4.p3\" class=\"ltx_para\">\n<p id=\"S4.p3.6\" class=\"ltx_p\">We next
        focus on the resilience that can be achieved under <math id=\"S4.p3.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.\nObserve that the lower bound of <math id=\"S4.p3.2.m2\" class=\"ltx_Math\"
        alttext=\"n&gt;(d+1)t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;(d+1)t</annotation></semantics></math>
        for convex validity does not directly translate to the lower bound on <math
        id=\"S4.p3.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, as all minimum enclosing balls of the convex hulls in\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Vaidya and Garg (<a href=\"#bib.bib9\" title=\"Byzantine
        Vector Consensus in Complete Graphs\" class=\"ltx_ref\">2013</a>)</cite> do
        have a common intersection. In the following, we present an almost tight resilience
        lower bound for <math id=\"S4.p3.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, showing that at least <math id=\"S4.p3.5.m5\" class=\"ltx_Math\"
        alttext=\"n&gt;(d+1)t-d\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;(d+1)t-d</annotation></semantics></math>
        nodes are needed to satisfy <math id=\"S4.p3.6.m6\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</p>\n</div>\n<div id=\"S4.Thmtheorem3\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6
        class=\"ltx_title ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S4.Thmtheorem3.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 4.3</span></span><span
        id=\"S4.Thmtheorem3.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S4.Thmtheorem3.p1\" class=\"ltx_para\">\n<p id=\"S4.Thmtheorem3.p1.3\"
        class=\"ltx_p\"><span id=\"S4.Thmtheorem3.p1.3.3\" class=\"ltx_text ltx_font_italic\">No
        agreement algorithm can satisfy <math id=\"S4.Thmtheorem3.p1.1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity with <math id=\"S4.Thmtheorem3.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"n\\leq(d+1)t-d\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2264</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n\\leq(d+1)t-d</annotation></semantics></math>
        nodes, where <math id=\"S4.Thmtheorem3.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"t\\geq
        d-1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>\u2265</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">t\\geq d-1</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S4.9\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S4.3.p1\" class=\"ltx_para\">\n<p
        id=\"S4.3.p1.3\" class=\"ltx_p\">Assume by means of contradiction that for
        <math id=\"S4.3.p1.1.m1\" class=\"ltx_Math\" alttext=\"n=(d+1)t-d\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>=</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n=(d+1)t-d</annotation></semantics></math>,
        the (minimum enclosing) balls of <math id=\"S4.3.p1.2.m2\" class=\"ltx_Math\"
        alttext=\"dt-d\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi></mrow><annotation
        encoding=\"application/x-tex\">dt-d</annotation></semantics></math> nodes
        must all intersect in at least one point. We will show that it is possible
        to construct a counterexample where a subset of <math id=\"S4.3.p1.3.m3\"
        class=\"ltx_Math\" alttext=\"d+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">d+1</annotation></semantics></math> balls does
        not have a common intersection.</p>\n</div>\n<div id=\"S4.4.p2\" class=\"ltx_para\">\n<p
        id=\"S4.4.p2.12\" class=\"ltx_p\">We start the construction with <math id=\"S4.4.p2.1.m1\"
        class=\"ltx_Math\" alttext=\"d\" display=\"inline\" intent=\":literal\"><semantics><mi>d</mi><annotation
        encoding=\"application/x-tex\">d</annotation></semantics></math> balls of
        equal size, where ball <math id=\"S4.4.p2.2.m2\" class=\"ltx_Math\" alttext=\"i\\in[d]\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>i</mi><mo>\u2208</mo><mrow><mo
        stretchy=\"false\">[</mo><mi>d</mi><mo stretchy=\"false\">]</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">i\\in[d]</annotation></semantics></math> has
        its center at the coordinate <math id=\"S4.4.p2.3.m3\" class=\"ltx_Math\"
        alttext=\"\\sqrt{\\frac{d}{d-1}}\\cdot u_{i}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msqrt><mfrac><mi>d</mi><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow></mfrac></msqrt><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msub><mi>u</mi><mi>i</mi></msub></mrow><annotation
        encoding=\"application/x-tex\">\\sqrt{\\frac{d}{d-1}}\\cdot u_{i}</annotation></semantics></math>,
        where <math id=\"S4.4.p2.4.m4\" class=\"ltx_Math\" alttext=\"u_{i}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>u</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">u_{i}</annotation></semantics></math> is the
        <math id=\"S4.4.p2.5.m5\" class=\"ltx_Math\" alttext=\"i\" display=\"inline\"
        intent=\":literal\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>-th
        unit vector. We set the radius of each ball to <math id=\"S4.4.p2.6.m6\" class=\"ltx_Math\"
        alttext=\"1\" display=\"inline\" intent=\":literal\"><semantics><mn>1</mn><annotation
        encoding=\"application/x-tex\">1</annotation></semantics></math>. These balls
        are chosen such that they intersect in exactly one point. It can be easily
        verified that this point has the coordinates <math id=\"S4.4.p2.7.m7\" class=\"ltx_Math\"
        alttext=\"\\frac{1}{\\sqrt{d(d-1)}}\\cdot(1,\\ldots,1)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mfrac><mn>1</mn><msqrt><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></msqrt></mfrac><mo lspace=\"0.222em\"
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\frac{1}{\\sqrt{d(d-1)}}\\cdot(1,\\ldots,1)</annotation></semantics></math>,
        and that it is the only intersection point, as the intersection point of all
        balls must be of the form <math id=\"S4.4.p2.8.m8\" class=\"ltx_Math\" alttext=\"x\\cdot(1,\\ldots,1)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>x</mi><mo lspace=\"0.222em\"
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">x\\cdot(1,\\ldots,1)</annotation></semantics></math>.
        Any subset of <math id=\"S4.4.p2.9.m9\" class=\"ltx_Math\" alttext=\"d-1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">d-1</annotation></semantics></math> of these
        balls has an intersection point in the coordinate <math id=\"S4.4.p2.10.m10\"
        class=\"ltx_Math\" alttext=\"\\frac{\\sqrt{d}+1}{(d-1)^{\\frac{3}{2}}}\\cdot\\bar{u}_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mrow><msqrt><mi>d</mi></msqrt><mo>+</mo><mn>1</mn></mrow><msup><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mfrac><mn>3</mn><mn>2</mn></mfrac></msup></mfrac><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msub><mover accent=\"true\"><mi>u</mi><mo>\xAF</mo></mover><mi>i</mi></msub></mrow><annotation
        encoding=\"application/x-tex\">\\frac{\\sqrt{d}+1}{(d-1)^{\\frac{3}{2}}}\\cdot\\bar{u}_{i}</annotation></semantics></math>,
        where <math id=\"S4.4.p2.11.m11\" class=\"ltx_Math\" alttext=\"\\bar{u}_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mover accent=\"true\"><mi>u</mi><mo>\xAF</mo></mover><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">\\bar{u}_{i}</annotation></semantics></math>
        is constructed from <math id=\"S4.4.p2.12.m12\" class=\"ltx_Math\" alttext=\"u_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>u</mi><mi>i</mi></msub><annotation
        encoding=\"application/x-tex\">u_{i}</annotation></semantics></math> by flipping
        all bits.</p>\n</div>\n<div id=\"S4.5.p3\" class=\"ltx_para\">\n<p id=\"S4.5.p3.9\"
        class=\"ltx_p\">Consider now the hyperplane defined by the <math id=\"S4.5.p3.1.m1\"
        class=\"ltx_Math\" alttext=\"d\" display=\"inline\" intent=\":literal\"><semantics><mi>d</mi><annotation
        encoding=\"application/x-tex\">d</annotation></semantics></math> points <math
        id=\"S4.5.p3.2.m2\" class=\"ltx_Math\" alttext=\"\\frac{\\sqrt{d}+1}{(d-1)^{\\frac{3}{2}}}\\cdot\\bar{u}_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mrow><msqrt><mi>d</mi></msqrt><mo>+</mo><mn>1</mn></mrow><msup><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mfrac><mn>3</mn><mn>2</mn></mfrac></msup></mfrac><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msub><mover accent=\"true\"><mi>u</mi><mo>\xAF</mo></mover><mi>i</mi></msub></mrow><annotation
        encoding=\"application/x-tex\">\\frac{\\sqrt{d}+1}{(d-1)^{\\frac{3}{2}}}\\cdot\\bar{u}_{i}</annotation></semantics></math>.
        This hyperplane lies at a distance of <math id=\"S4.5.p3.3.m3\" class=\"ltx_Math\"
        alttext=\"\\frac{1}{d(d-1)}&gt;\\frac{1}{d}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mn>1</mn><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></mfrac><mo>&gt;</mo><mfrac><mn>1</mn><mi>d</mi></mfrac></mrow><annotation
        encoding=\"application/x-tex\">\\frac{1}{d(d-1)}&gt;\\frac{1}{d}</annotation></semantics></math>
        from the intersection of all <math id=\"S4.5.p3.4.m4\" class=\"ltx_Math\"
        alttext=\"d\" display=\"inline\" intent=\":literal\"><semantics><mi>d</mi><annotation
        encoding=\"application/x-tex\">d</annotation></semantics></math> balls in
        <math id=\"S4.5.p3.5.m5\" class=\"ltx_Math\" alttext=\"\\frac{1}{\\sqrt{d(d-1)}}\\cdot(1,\\ldots,1)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mn>1</mn><msqrt><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></msqrt></mfrac><mo lspace=\"0.222em\"
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\frac{1}{\\sqrt{d(d-1)}}\\cdot(1,\\ldots,1)</annotation></semantics></math>.
        We can approximate this hyperplane using the <math id=\"S4.5.p3.6.m6\" class=\"ltx_Math\"
        alttext=\"(d+1)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><annotation
        encoding=\"application/x-tex\">(d+1)</annotation></semantics></math>-st ball
        from the construction. Let the midpoint of this ball lie in coordinate <math
        id=\"S4.5.p3.7.m7\" class=\"ltx_Math\" alttext=\"y\\cdot(1,\\ldots,1)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>y</mi><mo lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mrow><mo
        stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">y\\cdot(1,\\ldots,1)</annotation></semantics></math>,
        where <math id=\"S4.5.p3.8.m8\" class=\"ltx_Math\" alttext=\"y\" display=\"inline\"
        intent=\":literal\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math>
        is an arbitrarily large constant. We can choose a radius for this ball such
        that the ball touches the intersection of every subset of <math id=\"S4.5.p3.9.m9\"
        class=\"ltx_Math\" alttext=\"d-1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">d-1</annotation></semantics></math> balls,
        similar to the hyperplane.</p>\n</div>\n<div id=\"S4.6.p4\" class=\"ltx_para\">\n<p
        id=\"S4.6.p4.13\" class=\"ltx_p\">We now explain how the input vectors are
        distributed such that the defined <math id=\"S4.6.p4.1.m1\" class=\"ltx_Math\"
        alttext=\"d+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">d+1</annotation></semantics></math> balls correspond
        to minimum enclosing balls in the construction. We place <math id=\"S4.6.p4.2.m2\"
        class=\"ltx_Math\" alttext=\"t-1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>\u2212</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">t-1</annotation></semantics></math> input vectors
        in <math id=\"S4.6.p4.3.m3\" class=\"ltx_Math\" alttext=\"\\frac{1}{\\sqrt{d(d-1)}}\\cdot(1,\\ldots,1)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mn>1</mn><msqrt><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></msqrt></mfrac><mo lspace=\"0.222em\"
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\frac{1}{\\sqrt{d(d-1)}}\\cdot(1,\\ldots,1)</annotation></semantics></math>
        and in each of the coordinates <math id=\"S4.6.p4.4.m4\" class=\"ltx_Math\"
        alttext=\"\\frac{\\sqrt{d}+1}{(d-1)^{\\frac{3}{2}}}\\cdot\\bar{u}_{i}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mfrac><mrow><msqrt><mi>d</mi></msqrt><mo>+</mo><mn>1</mn></mrow><msup><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mfrac><mn>3</mn><mn>2</mn></mfrac></msup></mfrac><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msub><mover accent=\"true\"><mi>u</mi><mo>\xAF</mo></mover><mi>i</mi></msub></mrow><annotation
        encoding=\"application/x-tex\">\\frac{\\sqrt{d}+1}{(d-1)^{\\frac{3}{2}}}\\cdot\\bar{u}_{i}</annotation></semantics></math>.
        These are <math id=\"S4.6.p4.5.m5\" class=\"ltx_Math\" alttext=\"(d+1)(t-2)=(d+1)t-2d-2\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>t</mi><mo>\u2212</mo><mn>2</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mo>=</mo><mrow><mrow><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>d</mi></mrow><mo>\u2212</mo><mn>2</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">(d+1)(t-2)=(d+1)t-2d-2</annotation></semantics></math>
        input vectors. For each of the balls of radius <math id=\"S4.6.p4.6.m6\" class=\"ltx_Math\"
        alttext=\"1\" display=\"inline\" intent=\":literal\"><semantics><mn>1</mn><annotation
        encoding=\"application/x-tex\">1</annotation></semantics></math>, we place
        one input vector in the coordinates <math id=\"S4.6.p4.7.m7\" class=\"ltx_Math\"
        alttext=\"2\\sqrt{\\frac{d}{d-1}}u_{i}+\\frac{1}{\\sqrt{d(d-1)}}\\bar{u}_{i}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msqrt><mfrac><mi>d</mi><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow></mfrac></msqrt><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msub><mi>u</mi><mi>i</mi></msub></mrow><mo>+</mo><mrow><mfrac><mn>1</mn><msqrt><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></msqrt></mfrac><mo lspace=\"0em\"
        rspace=\"0em\">\u200B</mo><msub><mover accent=\"true\"><mi>u</mi><mo>\xAF</mo></mover><mi>i</mi></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">2\\sqrt{\\frac{d}{d-1}}u_{i}+\\frac{1}{\\sqrt{d(d-1)}}\\bar{u}_{i}</annotation></semantics></math>,
        which lie on the opposite side of their common intersection of these balls.
        This way, the common intersection and this new input vector define the minimum
        enclosing ball. Additionally, we place an input vector in <math id=\"S4.6.p4.8.m8\"
        class=\"ltx_Math\" alttext=\"z\\cdot(1,\\ldots,1)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>z</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">z\\cdot(1,\\ldots,1)</annotation></semantics></math>
        where <math id=\"S4.6.p4.9.m9\" class=\"ltx_Math\" alttext=\"y\" display=\"inline\"
        intent=\":literal\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math>
        is chosen such that the midpoint of the largest ball of the construction is
        in <math id=\"S4.6.p4.10.m10\" class=\"ltx_Math\" alttext=\"y\\cdot(1,\\ldots,1)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>y</mi><mo lspace=\"0.222em\"
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">y\\cdot(1,\\ldots,1)</annotation></semantics></math>.
        The distance between the ball and the hyperplane above should be smaller than
        <math id=\"S4.6.p4.11.m11\" class=\"ltx_Math\" alttext=\"\\frac{1}{d}\" display=\"inline\"
        intent=\":literal\"><semantics><mfrac><mn>1</mn><mi>d</mi></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{1}{d}</annotation></semantics></math>.
        This part of the construction requires <math id=\"S4.6.p4.12.m12\" class=\"ltx_Math\"
        alttext=\"d+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">d+1</annotation></semantics></math> additional
        input vectors, resulting in <math id=\"S4.6.p4.13.m13\" class=\"ltx_Math\"
        alttext=\"(d+1)t-d-1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">(d+1)t-d-1</annotation></semantics></math>
        input vectors in total.</p>\n</div>\n<div id=\"S4.7.p5\" class=\"ltx_para\">\n<p
        id=\"S4.7.p5.8\" class=\"ltx_p\">Assume a setting with <math id=\"S4.7.p5.1.m1\"
        class=\"ltx_Math\" alttext=\"(d+1)t-d-1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">(d+1)t-d-1</annotation></semantics></math>
        vectors placed as above in <math id=\"S4.7.p5.2.m2\" class=\"ltx_Math\" alttext=\"\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>.
        Observe that any two minimum enclosing balls must have at least <math id=\"S4.7.p5.3.m3\"
        class=\"ltx_Math\" alttext=\"n-2t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n-2t</annotation></semantics></math> input
        vectors in their intersection. Further, by construction, any subset of <math
        id=\"S4.7.p5.4.m4\" class=\"ltx_Math\" alttext=\"d\" display=\"inline\" intent=\":literal\"><semantics><mi>d</mi><annotation
        encoding=\"application/x-tex\">d</annotation></semantics></math> balls has
        a common intersection, where <math id=\"S4.7.p5.5.m5\" class=\"ltx_Math\"
        alttext=\"t-2\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>\u2212</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">t-2</annotation></semantics></math> input vectors
        are placed. Therefore, any two balls from the intersection have <math id=\"S4.7.p5.6.m6\"
        class=\"ltx_Math\" alttext=\"d(t-2)=dt-2d\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>t</mi><mo>\u2212</mo><mn>2</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mo>=</mo><mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>d</mi></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">d(t-2)=dt-2d</annotation></semantics></math>
        input vectors in common. We need to make sure that <math id=\"S4.7.p5.7.m7\"
        class=\"ltx_Math\" alttext=\"n-2t=(d-1)t-d-1\\geq dt-2d\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><mo>=</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow><mo>\u2265</mo><mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>d</mi></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">n-2t=(d-1)t-d-1\\geq dt-2d</annotation></semantics></math>.
        This inequality holds for <math id=\"S4.7.p5.8.m8\" class=\"ltx_Math\" alttext=\"t\\geq
        d-1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>\u2265</mo><mrow><mi>d</mi><mo>\u2212</mo><mn>1</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">t\\geq d-1</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S4.8.p6\" class=\"ltx_para\">\n<p id=\"S4.8.p6.1\" class=\"ltx_p\">The
        presented construction shows that the intersection of all minimum enclosing
        balls may be empty. According to Theorem\_<a href=\"#S4.Thmtheorem1\" title=\"Theorem
        4.1. \u2023 4 Necessary conditions for MEB validity \u2023 Practical Validity
        Conditions for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">4.1</span></a>, this means that the <math id=\"S4.8.p6.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity condition cannot be satisfied.</p>\n</div>\n<figure id=\"S4.F1\"
        class=\"ltx_figure\">\n<div class=\"ltx_flex_figure\">\n<div class=\"ltx_flex_cell
        ltx_flex_size_2\">\n<figure id=\"S4.F1.sf1\" class=\"ltx_figure ltx_figure_panel
        ltx_align_center\"><img src=\"2605.15887v1/figure_noshadow_side-2.png\" id=\"S4.F1.sf1.g1\"
        class=\"ltx_graphics ltx_centering ltx_img_square\" width=\"389\" height=\"389\"
        alt=\"Refer to caption\">\n<figcaption class=\"ltx_caption ltx_centering\"><span
        class=\"ltx_tag ltx_tag_figure\"><span id=\"S4.F1.sf1.2.1.1\" class=\"ltx_text\"
        style=\"font-size:90%;\">(a)</span> </span><span id=\"S4.F1.sf1.3.2\" class=\"ltx_text\"
        style=\"font-size:90%;\">View from the side</span></figcaption>\n</figure>\n</div>\n<div
        class=\"ltx_flex_cell ltx_flex_size_2\">\n<figure id=\"S4.F1.sf2\" class=\"ltx_figure
        ltx_figure_panel ltx_align_center\"><img src=\"2605.15887v1/figure_noshadow_bottom.png\"
        id=\"S4.F1.sf2.g1\" class=\"ltx_graphics ltx_centering ltx_img_square\" width=\"389\"
        height=\"389\" alt=\"Refer to caption\">\n<figcaption class=\"ltx_caption
        ltx_centering\"><span class=\"ltx_tag ltx_tag_figure\"><span id=\"S4.F1.sf2.2.1.1\"
        class=\"ltx_text\" style=\"font-size:90%;\">(b)</span> </span><span id=\"S4.F1.sf2.3.2\"
        class=\"ltx_text\" style=\"font-size:90%;\">View from the origin</span></figcaption>\n</figure>\n</div>\n</div>\n<figcaption
        class=\"ltx_caption ltx_centering\"><span class=\"ltx_tag ltx_tag_figure\"><span
        id=\"S4.F1.4.2.1\" class=\"ltx_text\" style=\"font-size:90%;\">Figure 1</span>:
        </span><span id=\"S4.F1.2.1\" class=\"ltx_text\" style=\"font-size:90%;\">An
        example of the lower bound construction for <math id=\"S4.F1.2.1.m1\" class=\"ltx_Math\"
        alttext=\"d=3\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>=</mo><mn>3</mn></mrow><annotation
        encoding=\"application/x-tex\">d=3</annotation></semantics></math>. The points
        in the figures represent the intersection points for each subset of three
        balls. Observe that there is a visible hole between the balls showing that
        there is no intersection between all four balls. Note that the input vectors
        for this construction are chosen as described in the proof of Theorem\_<a
        href=\"#S4.Thmtheorem3\" title=\"Theorem 4.3. \u2023 4 Necessary conditions
        for MEB validity \u2023 Practical Validity Conditions for Byzantine-Tolerant
        Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">4.3</span></a>.</span></figcaption>\n</figure>\n<div
        id=\"S4.9.p7\" class=\"ltx_para\">\n<p id=\"S4.9.p7.1\" class=\"ltx_p\">Figure\_<a
        href=\"#S4.F1\" title=\"Figure 1 \u2023 Proof. \u2023 4 Necessary conditions
        for MEB validity \u2023 Practical Validity Conditions for Byzantine-Tolerant
        Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">1</span></a>
        presents this construction in three dimensions.\n\u220E</p>\n</div>\n</div>\n</section>\n<section
        id=\"S5\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\">\n<span
        class=\"ltx_tag ltx_tag_section\">5 </span>Optimal algorithm for <math id=\"S5.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity</h2>\n\n<div id=\"S5.p1\" class=\"ltx_para\">\n<p id=\"S5.p1.5\"
        class=\"ltx_p\">In this section, we present positive results, by showing that
        agreement inside <math id=\"S5.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{safeMEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>safeMEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{safeMEB}</annotation></semantics></math>
        is sufficient to satisfy <math id=\"S5.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, and by presenting an optimal algorithm for <math id=\"S5.p1.3.m3\"
        class=\"ltx_Math\" alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S5.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, under the assumption <math id=\"S5.p1.5.m5\" class=\"ltx_Math\"
        alttext=\"n&gt;2t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S5.Thmtheorem1\" class=\"ltx_theorem ltx_theorem_lemma\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S5.Thmtheorem1.1.1.1\" class=\"ltx_text ltx_font_bold\">Lemma 5.1</span></span><span
        id=\"S5.Thmtheorem1.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S5.Thmtheorem1.p1\" class=\"ltx_para\">\n<p id=\"S5.Thmtheorem1.p1.2\"
        class=\"ltx_p\"><math id=\"S5.Thmtheorem1.p1.1.m1\" class=\"ltx_Math\" alttext=\"n&gt;(d+1)t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;(d+1)t</annotation></semantics></math><span
        id=\"S5.Thmtheorem1.p1.2.1\" class=\"ltx_text ltx_font_italic\"> nodes are
        sufficient to satisfy <math id=\"S5.Thmtheorem1.p1.2.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S5.2\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S5.2.p1\" class=\"ltx_para\">\n<p id=\"S5.2.p1.3\" class=\"ltx_p\">This
        follows trivially from the upper bound on convex validity\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Mendes<span class=\"ltx_text ltx_bib_etal\"> et al.</span>
        (<a href=\"#bib.bib11\" title=\"Multidimensional agreement in byzantine systems\"
        class=\"ltx_ref\">2015</a>)</cite> which was proven using Helly\u2019s theorem\_<cite
        class=\"ltx_cite ltx_citemacro_cite\">Danzer<span class=\"ltx_text ltx_bib_etal\">
        et al.</span> (<a href=\"#bib.bib62\" title=\"HELLY\u2019s theorem and its
        relatives1\" class=\"ltx_ref\">1963</a>)</cite>. In this bound, it was shown
        that, for <math id=\"S5.2.p1.1.m1\" class=\"ltx_Math\" alttext=\"n&gt;(d+1)t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;(d+1)t</annotation></semantics></math>,
        the convex hulls of all subsets of <math id=\"S5.2.p1.2.m2\" class=\"ltx_Math\"
        alttext=\"n-t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> nodes have
        a non-empty intersection. Note that if the convex hulls of any subset of <math
        id=\"S5.2.p1.3.m3\" class=\"ltx_Math\" alttext=\"n-t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> nodes intersect,
        so do the respective minimum enclosing balls.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S5.p2\" class=\"ltx_para\">\n<p id=\"S5.p2.11\" class=\"ltx_p\">In the
        case when <math id=\"S5.p2.1.m1\" class=\"ltx_Math\" alttext=\"n\\leq(d+1)t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2264</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n\\leq(d+1)t</annotation></semantics></math>,
        <math id=\"S5.p2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{safeMEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>safeMEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{safeMEB}</annotation></semantics></math>
        does not necessarily exist, as the balls might have an empty intersection.
        Hence, exact <math id=\"S5.p2.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity is not satisfiable. Since it is not possible to know which <math
        id=\"S5.p2.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        consists of only honest nodes, we therefore consider a problem that minimizes
        the mistake of choosing the wrong ball. In particular, for a subset <math
        id=\"S5.p2.5.m5\" class=\"ltx_Math\" alttext=\"T\\subseteq P\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>T</mi><mo>\u2286</mo><mi>P</mi></mrow><annotation
        encoding=\"application/x-tex\">T\\subseteq P</annotation></semantics></math>
        with <math id=\"S5.p2.6.m6\" class=\"ltx_Math\" alttext=\"|T|=n-t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mi>T</mi><mo
        stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|T|=n-t</annotation></semantics></math>, let
        <math id=\"S5.p2.7.m7\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}(T)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>MEB</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>T</mi><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}(T)</annotation></semantics></math>
        have center <math id=\"S5.p2.8.m8\" class=\"ltx_Math\" alttext=\"c_{T}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>c</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">c_{T}</annotation></semantics></math> and radius
        <math id=\"S5.p2.9.m9\" class=\"ltx_Math\" alttext=\"r_{T}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>r</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">r_{T}</annotation></semantics></math>.\nFor
        a candidate output <math id=\"S5.p2.10.m10\" class=\"ltx_Math\" alttext=\"y\\in\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>y</mi><mo>\u2208</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow><annotation
        encoding=\"application/x-tex\">y\\in\\mathbb{R}^{d}</annotation></semantics></math>,
        define <math id=\"S5.p2.11.m11\" class=\"ltx_Math\" alttext=\"\\phi_{T}(y)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>\u03D5</mi><mi>T</mi></msub><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>y</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\phi_{T}(y)</annotation></semantics></math>
        as:</p>\n<table id=\"A0.EGx1\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S5.Ex2\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S5.Ex2.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\phi_{T}(y)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>\u03D5</mi><mi>T</mi></msub><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>y</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\phi_{T}(y)</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S5.Ex2.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle=\\frac{dist_{2}(y-\\mathrm{MEB}(T))}{r_{T}}=\\frac{\\max\\{0,\\|y-c_{T}\\|_{2}-r_{T}\\}}{r_{T}}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>=</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mi>d</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msub><mi>t</mi><mn>2</mn></msub><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>y</mi><mo>\u2212</mo><mrow><mi>MEB</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>T</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow><mo stretchy=\"false\">)</mo></mrow></mrow><msub><mi>r</mi><mi>T</mi></msub></mfrac></mstyle><mo>=</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mi>max</mi><mo>\u2061</mo><mrow><mo stretchy=\"false\">{</mo><mn>0</mn><mo>,</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><msub><mi>c</mi><mi>T</mi></msub></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2212</mo><msub><mi>r</mi><mi>T</mi></msub></mrow><mo
        stretchy=\"false\">}</mo></mrow></mrow><msub><mi>r</mi><mi>T</mi></msub></mfrac></mstyle></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle=\\frac{dist_{2}(y-\\mathrm{MEB}(T))}{r_{T}}=\\frac{\\max\\{0,\\|y-c_{T}\\|_{2}-r_{T}\\}}{r_{T}}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S5.p2.13\" class=\"ltx_p\">Using this definition, we provide an optimal
        algorithm for <math id=\"S5.p2.12.m1\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S5.p2.13.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity shown in Algorithm <a href=\"#alg1\" title=\"Algorithm 1 \u2023 5
        Optimal algorithm for MEB validity \u2023 Practical Validity Conditions for
        Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">1</span></a>.</p>\n</div>\n<figure id=\"alg1\" class=\"ltx_float
        ltx_float_algorithm ltx_framed ltx_framed_top\">\n<figcaption class=\"ltx_caption\"><span
        class=\"ltx_tag ltx_tag_float\"><span id=\"alg1.2.1.1\" class=\"ltx_text ltx_font_bold\">Algorithm
        1</span> </span> MinMax-MEB</figcaption>\n<div id=\"alg1.3\" class=\"ltx_listing
        ltx_listing\">\n<div id=\"alg1.l1\" class=\"ltx_listingline\">\n<span class=\"ltx_tag
        ltx_tag_listingline\"><span id=\"alg1.l1.1.1.1\" class=\"ltx_text\" style=\"font-size:80%;\">1:</span></span>for
        every subset <math id=\"alg1.l1.m1\" class=\"ltx_Math\" alttext=\"T\\subseteq
        P\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>T</mi><mo>\u2286</mo><mi>P</mi></mrow><annotation
        encoding=\"application/x-tex\">T\\subseteq P</annotation></semantics></math>
        with <math id=\"alg1.l1.m2\" class=\"ltx_Math\" alttext=\"|T|=n-t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mi>T</mi><mo
        stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|T|=n-t</annotation></semantics></math>, compute
        <math id=\"alg1.l1.m3\" class=\"ltx_Math\" alttext=\"MEB(T)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>M</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>E</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>B</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>T</mi><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">MEB(T)</annotation></semantics></math> with
        center <math id=\"alg1.l1.m4\" class=\"ltx_Math\" alttext=\"c_{T}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>c</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">c_{T}</annotation></semantics></math> and radius
        <math id=\"alg1.l1.m5\" class=\"ltx_Math\" alttext=\"r_{T}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>r</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">r_{T}</annotation></semantics></math>\n\n</div>\n<div
        id=\"alg1.l2\" class=\"ltx_listingline\">\n<span class=\"ltx_tag ltx_tag_listingline\"><span
        id=\"alg1.l2.1.1.1\" class=\"ltx_text\" style=\"font-size:80%;\">2:</span></span><span
        id=\"alg1.l2.2\" class=\"ltx_text ltx_font_bold\">if</span> there exists <math
        id=\"alg1.l2.m1\" class=\"ltx_Math\" alttext=\"T\" display=\"inline\" intent=\":literal\"><semantics><mi>T</mi><annotation
        encoding=\"application/x-tex\">T</annotation></semantics></math> with <math
        id=\"alg1.l2.m2\" class=\"ltx_Math\" alttext=\"r_{T}=0\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><msub><mi>r</mi><mi>T</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation
        encoding=\"application/x-tex\">r_{T}=0</annotation></semantics></math> <span
        id=\"alg1.l2.3\" class=\"ltx_text ltx_font_bold\">then</span>\n\n</div>\n<div
        id=\"alg1.l3\" class=\"ltx_listingline\">\n<span class=\"ltx_tag ltx_tag_listingline\"><span
        id=\"alg1.l3.1.1.1\" class=\"ltx_text\" style=\"font-size:80%;\">3:</span></span>\u2003\u2002<span
        id=\"alg1.l3.2\" class=\"ltx_text ltx_font_bold\">return</span> <math id=\"alg1.l3.m1\"
        class=\"ltx_Math\" alttext=\"c_{T}\" display=\"inline\" intent=\":literal\"><semantics><msub><mi>c</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">c_{T}</annotation></semantics></math>\n\n</div>\n<div
        id=\"alg1.l4\" class=\"ltx_listingline\">\n<span class=\"ltx_tag ltx_tag_listingline\"><span
        id=\"alg1.l4.1.1.1\" class=\"ltx_text\" style=\"font-size:80%;\">4:</span></span><span
        id=\"alg1.l4.2\" class=\"ltx_text ltx_font_bold\">else</span>\n</div>\n<div
        id=\"alg1.l5\" class=\"ltx_listingline\">\n<span class=\"ltx_tag ltx_tag_listingline\"><span
        id=\"alg1.l5.1.1.1\" class=\"ltx_text\" style=\"font-size:80%;\">5:</span></span>\u2003\u2002choose
        <math id=\"alg1.l5.m1\" class=\"ltx_Math\" alttext=\"y^{*}\\in\\arg\\min_{y\\in\\mathbb{R}^{d}}\\max_{\\begin{subarray}{c}T\\subseteq
        P\\\\\n|T|=n-t\\end{subarray}}\\phi_{T}(y)\" display=\"inline\" intent=\":literal\"><semantics><mrow><msup><mi>y</mi><mo>\u2217</mo></msup><mo>\u2208</mo><mrow><mrow><mi>arg</mi><mo
        lspace=\"0.167em\">\u2061</mo><mrow><msub><mi>min</mi><mrow><mi>y</mi><mo>\u2208</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow></msub><mo
        lspace=\"0.167em\">\u2061</mo><mrow><msub><mi>max</mi><mtable rowspacing=\"0pt\"><mtr><mtd><mrow><mi>T</mi><mo>\u2286</mo><mi>P</mi></mrow></mtd></mtr><mtr><mtd><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>T</mi><mo stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow></mtd></mtr></mtable></msub><mo
        lspace=\"0.167em\">\u2061</mo><msub><mi>\u03D5</mi><mi>T</mi></msub></mrow></mrow></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>y</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow><annotation encoding=\"application/x-tex\">y^{*}\\in\\arg\\min_{y\\in\\mathbb{R}^{d}}\\max_{\\begin{subarray}{c}T\\subseteq
        P\\\\\n|T|=n-t\\end{subarray}}\\phi_{T}(y)</annotation></semantics></math>\n\n</div>\n<div
        id=\"alg1.l6\" class=\"ltx_listingline\">\n<span class=\"ltx_tag ltx_tag_listingline\"><span
        id=\"alg1.l6.1.1.1\" class=\"ltx_text\" style=\"font-size:80%;\">6:</span></span><span
        id=\"alg1.l6.2\" class=\"ltx_text ltx_font_bold\">end</span> <span id=\"alg1.l6.3\"
        class=\"ltx_text ltx_font_bold\">if</span>\n</div>\n<div id=\"alg1.l7\" class=\"ltx_listingline\">\n<span
        class=\"ltx_tag ltx_tag_listingline\"><span id=\"alg1.l7.1.1.1\" class=\"ltx_text\"
        style=\"font-size:80%;\">7:</span></span><span id=\"alg1.l7.2\" class=\"ltx_text
        ltx_font_bold\">return</span> <math id=\"alg1.l7.m1\" class=\"ltx_Math\" alttext=\"y^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>y</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">y^{*}</annotation></semantics></math>\n\n</div>\n</div>\n</figure>\n<div
        id=\"S5.Thmtheorem2\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S5.Thmtheorem2.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 5.2</span></span><span
        id=\"S5.Thmtheorem2.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S5.Thmtheorem2.p1\" class=\"ltx_para\">\n<p id=\"S5.Thmtheorem2.p1.3\"
        class=\"ltx_p\"><span id=\"S5.Thmtheorem2.p1.3.3\" class=\"ltx_text ltx_font_italic\">Algorithm\_<a
        href=\"#alg1\" title=\"Algorithm 1 \u2023 5 Optimal algorithm for MEB validity
        \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated Learning\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">1</span></a> solves
        the <math id=\"S5.Thmtheorem2.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S5.Thmtheorem2.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>-validity
        optimally, if <math id=\"S5.Thmtheorem2.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"n&gt;2t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S5.4\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S5.3.p1\" class=\"ltx_para\">\n<p
        id=\"S5.3.p1.20\" class=\"ltx_p\">Let <math id=\"S5.3.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathcal{T}=\\{T\\subseteq P\\mid|T|=n-t\\}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi class=\"ltx_font_mathcaligraphic\">\U0001D4AF</mi><mo>=</mo><mrow><mo
        stretchy=\"false\">{</mo><mrow><mi>T</mi><mo>\u2286</mo><mi>P</mi></mrow><mo
        fence=\"true\" lspace=\"0em\" rspace=\"0em\">\u2223</mo><mrow><mrow><mo stretchy=\"false\">|</mo><mi>T</mi><mo
        stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><mo
        stretchy=\"false\">}</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathcal{T}=\\{T\\subseteq
        P\\mid|T|=n-t\\}</annotation></semantics></math>. For every <math id=\"S5.3.p1.2.m2\"
        class=\"ltx_Math\" alttext=\"T\\in\\mathcal{T}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>T</mi><mo>\u2208</mo><mi
        class=\"ltx_font_mathcaligraphic\">\U0001D4AF</mi></mrow><annotation encoding=\"application/x-tex\">T\\in\\mathcal{T}</annotation></semantics></math>,
        let <math id=\"S5.3.p1.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}(T)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>MEB</mi><mo lspace=\"0em\"
        rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>T</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathrm{MEB}(T)</annotation></semantics></math>
        have center <math id=\"S5.3.p1.4.m4\" class=\"ltx_Math\" alttext=\"c_{T}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>c</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">c_{T}</annotation></semantics></math> and radius
        <math id=\"S5.3.p1.5.m5\" class=\"ltx_Math\" alttext=\"r_{T}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>r</mi><mi>T</mi></msub><annotation
        encoding=\"application/x-tex\">r_{T}</annotation></semantics></math>.\nWe
        first consider the case where there exists <math id=\"S5.3.p1.6.m6\" class=\"ltx_Math\"
        alttext=\"T_{0}\\in\\mathcal{T}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub><mo>\u2208</mo><mi
        class=\"ltx_font_mathcaligraphic\">\U0001D4AF</mi></mrow><annotation encoding=\"application/x-tex\">T_{0}\\in\\mathcal{T}</annotation></semantics></math>
        with <math id=\"S5.3.p1.7.m7\" class=\"ltx_Math\" alttext=\"r_{T_{0}}=0\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>r</mi><msub><mi>T</mi><mn>0</mn></msub></msub><mo>=</mo><mn>0</mn></mrow><annotation
        encoding=\"application/x-tex\">r_{T_{0}}=0</annotation></semantics></math>
        and center <math id=\"S5.3.p1.8.m8\" class=\"ltx_Math\" alttext=\"c_{T_{0}}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>c</mi><msub><mi>T</mi><mn>0</mn></msub></msub><annotation
        encoding=\"application/x-tex\">c_{T_{0}}</annotation></semantics></math>.
        Since <math id=\"S5.3.p1.9.m9\" class=\"ltx_Math\" alttext=\"n&gt;2t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>, every
        other subset <math id=\"S5.3.p1.10.m10\" class=\"ltx_Math\" alttext=\"T\\in\\mathcal{T}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>T</mi><mo>\u2208</mo><mi
        class=\"ltx_font_mathcaligraphic\">\U0001D4AF</mi></mrow><annotation encoding=\"application/x-tex\">T\\in\\mathcal{T}</annotation></semantics></math>
        intersects <math id=\"S5.3.p1.11.m11\" class=\"ltx_Math\" alttext=\"T_{0}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>T</mi><mn>0</mn></msub><annotation
        encoding=\"application/x-tex\">T_{0}</annotation></semantics></math>. Hence
        every such <math id=\"S5.3.p1.12.m12\" class=\"ltx_Math\" alttext=\"T\" display=\"inline\"
        intent=\":literal\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math>
        contains the point <math id=\"S5.3.p1.13.m13\" class=\"ltx_Math\" alttext=\"c_{T_{0}}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>c</mi><msub><mi>T</mi><mn>0</mn></msub></msub><annotation
        encoding=\"application/x-tex\">c_{T_{0}}</annotation></semantics></math>,
        and therefore <math id=\"S5.3.p1.14.m14\" class=\"ltx_Math\" alttext=\"c_{T_{0}}\\in\\mathrm{MEB}(T)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>c</mi><msub><mi>T</mi><mn>0</mn></msub></msub><mo>\u2208</mo><mrow><mi>MEB</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>T</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow><annotation encoding=\"application/x-tex\">c_{T_{0}}\\in\\mathrm{MEB}(T)</annotation></semantics></math>
        for all <math id=\"S5.3.p1.15.m15\" class=\"ltx_Math\" alttext=\"T\\in\\mathcal{T}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>T</mi><mo>\u2208</mo><mi
        class=\"ltx_font_mathcaligraphic\">\U0001D4AF</mi></mrow><annotation encoding=\"application/x-tex\">T\\in\\mathcal{T}</annotation></semantics></math>.
        Thus <math id=\"S5.3.p1.16.m16\" class=\"ltx_Math\" alttext=\"c_{T_{0}}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>c</mi><msub><mi>T</mi><mn>0</mn></msub></msub><annotation
        encoding=\"application/x-tex\">c_{T_{0}}</annotation></semantics></math> lies
        in the exact safe <math id=\"S5.3.p1.17.m17\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        area, and returning <math id=\"S5.3.p1.18.m18\" class=\"ltx_Math\" alttext=\"c_{T_{0}}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>c</mi><msub><mi>T</mi><mn>0</mn></msub></msub><annotation
        encoding=\"application/x-tex\">c_{T_{0}}</annotation></semantics></math> satisfies
        exact <math id=\"S5.3.p1.19.m19\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>-validity,
        i.e., <math id=\"S5.3.p1.20.m20\" class=\"ltx_Math\" alttext=\"c=1\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">c=1</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S5.4.p2\" class=\"ltx_para\">\n<p id=\"S5.4.p2.6\" class=\"ltx_p\">It
        remains to consider the case, in which all MEBs have a non-zero radius. Since
        it is not known which of the <math id=\"S5.4.p2.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is defined on the subset containing honest nodes only, each subset might be
        the correct one. Algorithm\_<a href=\"#alg1\" title=\"Algorithm 1 \u2023 5
        Optimal algorithm for MEB validity \u2023 Practical Validity Conditions for
        Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">1</span></a> therefore computes the point, which minimizes the
        distance to the <math id=\"S5.4.p2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        w.r.t. the ball radius, computed on all possible subsets of nodes of size
        <math id=\"S5.4.p2.3.m3\" class=\"ltx_Math\" alttext=\"n-t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math>. This implies
        that for each possible <math id=\"S5.4.p2.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        the Algorithm\_<a href=\"#alg1\" title=\"Algorithm 1 \u2023 5 Optimal algorithm
        for MEB validity \u2023 Practical Validity Conditions for Byzantine-Tolerant
        Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">1</span></a>
        satisfies <math id=\"S5.4.p2.5.m5\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S5.4.p2.6.m6\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.\n\u220E</p>\n</div>\n</div>\n<div id=\"S5.p3\" class=\"ltx_para\">\n<p
        id=\"S5.p3.4\" class=\"ltx_p\">Next, we present an upper bound on the relaxation
        <math id=\"S5.p3.1.m1\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        used by the optimal algorithm to solve <math id=\"S5.p3.2.m2\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S5.p3.3.m3\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. This upper bound is based on the Descartes\u2019 theorem on the
        kissing circles. We use the statement of the theorem based on bends that originates
        in Soddy\u2019s poem \u201CThe Kiss Precise\u201D\_<cite class=\"ltx_cite
        ltx_citemacro_cite\">Soddy (<a href=\"#bib.bib41\" title=\"The kiss precise\"
        class=\"ltx_ref\">1936</a>)</cite>, or rather on the fourth verse of the poem
        (its generalization to <math id=\"S5.p3.4.m4\" class=\"ltx_Math\" alttext=\"n\"
        display=\"inline\" intent=\":literal\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>
        dimensions), presented by Gosset\_<cite class=\"ltx_cite ltx_citemacro_cite\"><a
        href=\"#bib.bib42\" title=\"The kiss precise\" class=\"ltx_ref\">41</a></cite>.</p>\n</div>\n<div
        id=\"S5.Thmtheorem3\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S5.Thmtheorem3.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 5.3</span></span><span
        id=\"S5.Thmtheorem3.2.2\" class=\"ltx_text ltx_font_bold\"> </span>(Soddy-Gosset
        Theorem\_<cite class=\"ltx_cite ltx_citemacro_cite\"><a href=\"#bib.bib42\"
        title=\"The kiss precise\" class=\"ltx_ref\">41</a></cite>)<span id=\"S5.Thmtheorem3.3.3\"
        class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div id=\"S5.Thmtheorem3.p1\"
        class=\"ltx_para\">\n<p id=\"S5.Thmtheorem3.p1.4\" class=\"ltx_p\"><span id=\"S5.Thmtheorem3.p1.4.4\"
        class=\"ltx_text ltx_font_italic\">Given <math id=\"S5.Thmtheorem3.p1.1.1.m1\"
        class=\"ltx_Math\" alttext=\"d+2\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo>+</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">d+2</annotation></semantics></math> mutually
        tangent spheres in <math id=\"S5.Thmtheorem3.p1.2.2.m2\" class=\"ltx_Math\"
        alttext=\"\\mathbb{R}^{d}\" display=\"inline\" intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>.
        Let <math id=\"S5.Thmtheorem3.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"r_{i},i\\in[d+2]\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mi>r</mi><mi>i</mi></msub><mo>,</mo><mi>i</mi></mrow><mo>\u2208</mo><mrow><mo
        stretchy=\"false\">[</mo><mrow><mi>d</mi><mo>+</mo><mn>2</mn></mrow><mo stretchy=\"false\">]</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">r_{i},i\\in[d+2]</annotation></semantics></math>
        denote the radii of the spheres and <math id=\"S5.Thmtheorem3.p1.4.4.m4\"
        class=\"ltx_Math\" alttext=\"b_{i}=\\frac{1}{r_{i}},i\\in[d+2]\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><msub><mi>b</mi><mi>i</mi></msub><mo>=</mo><mfrac><mn>1</mn><msub><mi>r</mi><mi>i</mi></msub></mfrac></mrow><mo>,</mo><mrow><mi>i</mi><mo>\u2208</mo><mrow><mo
        stretchy=\"false\">[</mo><mrow><mi>d</mi><mo>+</mo><mn>2</mn></mrow><mo stretchy=\"false\">]</mo></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">b_{i}=\\frac{1}{r_{i}},i\\in[d+2]</annotation></semantics></math>
        their bends. Then,</span></p>\n<table id=\"S5.Ex3\" class=\"ltx_equation ltx_eqn_table\">\n\n<tbody><tr
        class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_eqn_cell ltx_align_center\"><math
        id=\"S5.Ex3.m1\" class=\"ltx_Math\" alttext=\"\\left(\\sum\\limits_{i=1}^{d+2}b_{i}\\right)^{2}=d\\cdot\\sum\\limits_{i=1}^{d+2}b_{i}^{2}.\"
        display=\"block\" intent=\":literal\"><semantics><mrow><mrow><msup><mrow><mo>(</mo><mrow><munderover><mo
        lspace=\"0em\" movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>d</mi><mo>+</mo><mn>2</mn></mrow></munderover><msub><mi>b</mi><mi>i</mi></msub></mrow><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><mrow><mi>d</mi><mo
        lspace=\"0.222em\" rspace=\"0.055em\">\u22C5</mo><mrow><munderover><mo movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>d</mi><mo>+</mo><mn>2</mn></mrow></munderover><msubsup><mi>b</mi><mi>i</mi><mn>2</mn></msubsup></mrow></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\left(\\sum\\limits_{i=1}^{d+2}b_{i}\\right)^{2}=d\\cdot\\sum\\limits_{i=1}^{d+2}b_{i}^{2}.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n</div>\n</div>\n<div
        id=\"S5.p4\" class=\"ltx_para\">\n<p id=\"S5.p4.1\" class=\"ltx_p\">Formal
        proofs of this theorem can be found in\_<cite class=\"ltx_cite ltx_citemacro_cite\">FOG
        (<a href=\"#bib.bib60\" title=\"OM et punkts beliggenhed i forhold til visse
        regul\xE6re punkts\xE6t\" class=\"ltx_ref\">1960</a>); Coxeter (<a href=\"#bib.bib61\"
        title=\"Loxodromic sequences of tangent spheres\" class=\"ltx_ref\">1968</a>)</cite>.</p>\n</div>\n<div
        id=\"S5.Thmtheorem4\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S5.Thmtheorem4.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 5.4</span></span><span
        id=\"S5.Thmtheorem4.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S5.Thmtheorem4.p1\" class=\"ltx_para\">\n<p id=\"S5.Thmtheorem4.p1.6\"
        class=\"ltx_p\"><span id=\"S5.Thmtheorem4.p1.6.6\" class=\"ltx_text ltx_font_italic\">For
        <math id=\"S5.Thmtheorem4.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"n&gt;2t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>, the
        optimal <math id=\"S5.Thmtheorem4.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        for <math id=\"S5.Thmtheorem4.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S5.Thmtheorem4.p1.4.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>-validity
        can be upper bounded by <math id=\"S5.Thmtheorem4.p1.5.5.m5\" class=\"ltx_Math\"
        alttext=\"1+\\frac{k-1}{k+1+\\sqrt{2(k+1)k}}&lt;\\sqrt{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>k</mi><mo>\u2212</mo><mn>1</mn></mrow><mrow><mi>k</mi><mo>+</mo><mn>1</mn><mo>+</mo><msqrt><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>k</mi></mrow></msqrt></mrow></mfrac></mrow><mo>&lt;</mo><msqrt><mn>2</mn></msqrt></mrow><annotation
        encoding=\"application/x-tex\">1+\\frac{k-1}{k+1+\\sqrt{2(k+1)k}}&lt;\\sqrt{2}</annotation></semantics></math>,
        where <math id=\"S5.Thmtheorem4.p1.6.6.m6\" class=\"ltx_Math\" alttext=\"k=\\min\\{d,\\binom{n}{n-t}-1\\}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>=</mo><mrow><mi>min</mi><mo>\u2061</mo><mrow><mo
        stretchy=\"false\">{</mo><mi>d</mi><mo>,</mo><mrow><mrow><mo>(</mo><mfrac
        linethickness=\"0pt\"><mi>n</mi><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac><mo>)</mo></mrow><mo>\u2212</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">}</mo></mrow></mrow></mrow><annotation encoding=\"application/x-tex\">k=\\min\\{d,\\binom{n}{n-t}-1\\}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S5.10\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S5.5.p1\" class=\"ltx_para\">\n<p
        id=\"S5.5.p1.12\" class=\"ltx_p\">We consider a subset of <math id=\"S5.5.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"k+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">k+1</annotation></semantics></math> minimum
        enclosing balls with an empty intersection. If the intersection of any subset
        of <math id=\"S5.5.p1.2.m2\" class=\"ltx_Math\" alttext=\"k+1\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">k+1</annotation></semantics></math> balls were
        not empty, by Helly\u2019s theorem\_<cite class=\"ltx_cite ltx_citemacro_cite\">Danzer<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib62\" title=\"HELLY\u2019s
        theorem and its relatives1\" class=\"ltx_ref\">1963</a>)</cite>, the intersection
        of all minimum enclosing balls would be non-empty too. Thus, the optimal algorithm
        would choose a point inside the intersection of all minimum enclosing balls.
        Note that if there are more than <math id=\"S5.5.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"k+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">k+1</annotation></semantics></math> balls in
        the construction that do not intersect, we can consider the subset with the
        worst distance ratios to the respective balls.\nWe further assume that the
        midpoints of the <math id=\"S5.5.p1.4.m4\" class=\"ltx_Math\" alttext=\"k+1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">k+1</annotation></semantics></math> balls are
        in a general position in a <math id=\"S5.5.p1.5.m5\" class=\"ltx_Math\" alttext=\"k\"
        display=\"inline\" intent=\":literal\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math>-dimensional
        subspace of <math id=\"S5.5.p1.6.m6\" class=\"ltx_Math\" alttext=\"\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>.
        If the midpoints lied in a lower dimensional space, the optimal solution would
        also lie in this subspace, and thus we could consider the following construction
        with fewer balls in a smaller subspace.\nIn the following, we will make use
        of the property that any pair of minimum enclosing balls must intersect. This
        property holds for <math id=\"S5.5.p1.7.m7\" class=\"ltx_Math\" alttext=\"n&gt;2t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>. Instead
        of considering proper intersections, we will construct a tangent ball, which
        allows us to apply the Soddy-Gosset theorem.\nNote that for <math id=\"S5.5.p1.8.m8\"
        class=\"ltx_Math\" alttext=\"k\\geq 3\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>\u2265</mo><mn>3</mn></mrow><annotation
        encoding=\"application/x-tex\">k\\geq 3</annotation></semantics></math>, this
        assumption is too weak, as by construction, minimum enclosing balls of any
        subset of <math id=\"S5.5.p1.9.m9\" class=\"ltx_Math\" alttext=\"d\" display=\"inline\"
        intent=\":literal\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math>
        balls must intersect as well. Thus, the following upper bound on <math id=\"S5.5.p1.10.m10\"
        class=\"ltx_Math\" alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math> is tight
        for the case <math id=\"S5.5.p1.11.m11\" class=\"ltx_Math\" alttext=\"k=2\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">k=2</annotation></semantics></math>, but the
        actual bound is likely smaller for larger <math id=\"S5.5.p1.12.m12\" class=\"ltx_Math\"
        alttext=\"k\" display=\"inline\" intent=\":literal\"><semantics><mi>k</mi><annotation
        encoding=\"application/x-tex\">k</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S5.6.p2\" class=\"ltx_para\">\n<p id=\"S5.6.p2.3\" class=\"ltx_p\">Consider
        now a set of <math id=\"S5.6.p2.1.m1\" class=\"ltx_Math\" alttext=\"k+1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">k+1</annotation></semantics></math> tangent
        balls, i.e., a setting where each pair of balls intersects in exactly one
        point. Note that there is a <math id=\"S5.6.p2.2.m2\" class=\"ltx_Math\" alttext=\"(k+2)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mrow><mi>k</mi><mo>+</mo><mn>2</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(k+2)</annotation></semantics></math>-nd
        ball that can be inserted in the hole between the <math id=\"S5.6.p2.3.m3\"
        class=\"ltx_Math\" alttext=\"k+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">k+1</annotation></semantics></math> tangent
        balls such that it is tangent to each of the balls, denoted the inner Soddy
        ball. We will now consider the relaxation factor needed to include the midpoint
        of the inner Soddy ball in the intersection of all scaled balls. Observe that,
        if all minimum enclosing balls have the same radius, midpoint of the inner
        Soddy ball corresponds to the optimal intersection point.</p>\n</div>\n<div
        id=\"S5.7.p3\" class=\"ltx_para\">\n<p id=\"S5.7.p3.5\" class=\"ltx_p\">Let
        <math id=\"S5.7.p3.1.m1\" class=\"ltx_Math\" alttext=\"r_{1},\\ldots,r_{k+1}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><msub><mi>r</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
        encoding=\"application/x-tex\">r_{1},\\ldots,r_{k+1}</annotation></semantics></math>
        denote the radii of the considered minimum enclosing balls, and the <math
        id=\"S5.7.p3.2.m2\" class=\"ltx_Math\" alttext=\"b_{1},\\ldots,b_{k+1}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><msub><mi>b</mi><mn>1</mn></msub><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><msub><mi>b</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
        encoding=\"application/x-tex\">b_{1},\\ldots,b_{k+1}</annotation></semantics></math>
        their bend, that is, <math id=\"S5.7.p3.3.m3\" class=\"ltx_Math\" alttext=\"b_{i}=\\frac{1}{r_{i}}\\
        \\forall i\\in[k+1]\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>b</mi><mi>i</mi></msub><mo>=</mo><mrow><mfrac><mn>1</mn><msub><mi>r</mi><mi>i</mi></msub></mfrac><mo
        lspace=\"0.667em\" rspace=\"0em\">\u200B</mo><mrow><mo rspace=\"0.167em\">\u2200</mo><mi>i</mi></mrow></mrow><mo>\u2208</mo><mrow><mo
        stretchy=\"false\">[</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">]</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">b_{i}=\\frac{1}{r_{i}}\\ \\forall i\\in[k+1]</annotation></semantics></math>.
        Let <math id=\"S5.7.p3.4.m4\" class=\"ltx_Math\" alttext=\"r_{k+2}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>r</mi><mrow><mi>k</mi><mo>+</mo><mn>2</mn></mrow></msub><annotation
        encoding=\"application/x-tex\">r_{k+2}</annotation></semantics></math> and
        <math id=\"S5.7.p3.5.m5\" class=\"ltx_Math\" alttext=\"b_{k+2}\" display=\"inline\"
        intent=\":literal\"><semantics><msub><mi>b</mi><mrow><mi>k</mi><mo>+</mo><mn>2</mn></mrow></msub><annotation
        encoding=\"application/x-tex\">b_{k+2}</annotation></semantics></math> denote
        the radius and the bend of the inner Soddy ball. By the Soddy-Gosset theorem
        (Theorem\_<a href=\"#S5.Thmtheorem3\" title=\"Theorem 5.3 (Soddy-Gosset Theorem
        41). \u2023 5 Optimal algorithm for MEB validity \u2023 Practical Validity
        Conditions for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">5.3</span></a>), the bend of the two Soddy
        balls can be computed as</p>\n</div>\n<div id=\"S5.8.p4\" class=\"ltx_para\">\n<table
        id=\"A0.EGx2\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S5.E1\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S5.E1.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle
        b_{k+1}=\\frac{\\sum\\limits_{i=1}^{k+1}b_{i}\\pm\\sqrt{k\\cdot\\left(\\left(\\sum\\limits_{i=1}^{k+1}b_{i}\\right)^{2}-(k-1)\\cdot\\sum\\limits_{i=1}^{k+1}b_{i}^{2}\\right)}}{k}.\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mi>b</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mrow><munderover><mo movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></munderover><msub><mi>b</mi><mi>i</mi></msub></mrow><mo>\xB1</mo><msqrt><mrow><mi>k</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mrow><mo>(</mo><mrow><msup><mrow><mo>(</mo><mrow><munderover><mo
        lspace=\"0em\" movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></munderover><msub><mi>b</mi><mi>i</mi></msub></mrow><mo>)</mo></mrow><mn>2</mn></msup><mo>\u2212</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>k</mi><mo>\u2212</mo><mn>1</mn></mrow><mo
        rspace=\"0.055em\" stretchy=\"false\">)</mo></mrow><mo rspace=\"0.055em\">\u22C5</mo><mrow><munderover><mo
        movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></munderover><msubsup><mi>b</mi><mi>i</mi><mn>2</mn></msubsup></mrow></mrow></mrow><mo>)</mo></mrow></mrow></msqrt></mrow><mi>k</mi></mfrac></mstyle></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle
        b_{k+1}=\\frac{\\sum\\limits_{i=1}^{k+1}b_{i}\\pm\\sqrt{k\\cdot\\left(\\left(\\sum\\limits_{i=1}^{k+1}b_{i}\\right)^{2}-(k-1)\\cdot\\sum\\limits_{i=1}^{k+1}b_{i}^{2}\\right)}}{k}.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n<td rowspan=\"1\" class=\"ltx_eqn_cell
        ltx_eqn_eqno ltx_align_middle ltx_align_right\"><span class=\"ltx_tag ltx_tag_equation
        ltx_align_right\">(1)</span></td>\n</tr></tbody>\n</table>\n<p id=\"S5.8.p4.6\"
        class=\"ltx_p\">Note that a positive bend corresponds to the inner circle
        in this formula.\nAssume now that the largest minimum enclosing ball has radius
        <math id=\"S5.8.p4.1.m1\" class=\"ltx_Math\" alttext=\"1\" display=\"inline\"
        intent=\":literal\"><semantics><mn>1</mn><annotation encoding=\"application/x-tex\">1</annotation></semantics></math>.
        Observe that the radius of the inner Soddy ball is minimized if all minimum
        enclosing balls have the same radius <math id=\"S5.8.p4.2.m2\" class=\"ltx_Math\"
        alttext=\"1\" display=\"inline\" intent=\":literal\"><semantics><mn>1</mn><annotation
        encoding=\"application/x-tex\">1</annotation></semantics></math>. This can
        be verified by starting with balls of radius <math id=\"S5.8.p4.3.m3\" class=\"ltx_Math\"
        alttext=\"1\" display=\"inline\" intent=\":literal\"><semantics><mn>1</mn><annotation
        encoding=\"application/x-tex\">1</annotation></semantics></math> and decreasing
        the radius of one of the balls, or increasing the bend. Note that Equation\_<a
        href=\"#S5.E1\" title=\"In Proof. \u2023 5 Optimal algorithm for MEB validity
        \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated Learning\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">1</span></a> also increases
        monotonically in this case. For <math id=\"S5.8.p4.4.m4\" class=\"ltx_Math\"
        alttext=\"k=2\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">k=2</annotation></semantics></math>, this also
        shows that the radius is maximized for the case where the midpoint of the
        inner Soddy ball corresponds to the optimal intersection point chosen by an
        optimal algorithm solving <math id=\"S5.8.p4.5.m5\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S5.8.p4.6.m6\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</p>\n</div>\n<div id=\"S5.9.p5\" class=\"ltx_para\">\n<p id=\"S5.9.p5.1\"
        class=\"ltx_p\">If all radii are <math id=\"S5.9.p5.1.m1\" class=\"ltx_Math\"
        alttext=\"1\" display=\"inline\" intent=\":literal\"><semantics><mn>1</mn><annotation
        encoding=\"application/x-tex\">1</annotation></semantics></math>, the formula
        for the bend of the inner Soddy ball reduces to</p>\n<table id=\"S5.Ex4\"
        class=\"ltx_equation ltx_eqn_table\">\n\n<tbody><tr class=\"ltx_equation ltx_eqn_row
        ltx_align_baseline\">\n<td class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td
        class=\"ltx_eqn_cell ltx_align_center\"><math id=\"S5.Ex4.m1\" class=\"ltx_Math\"
        alttext=\"r_{k+2}=\\frac{1}{b_{k+2}}=\\frac{k-1}{k+1+\\sqrt{2(k+1)k}}.\" display=\"block\"
        intent=\":literal\"><semantics><mrow><mrow><msub><mi>r</mi><mrow><mi>k</mi><mo>+</mo><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mn>1</mn><msub><mi>b</mi><mrow><mi>k</mi><mo>+</mo><mn>2</mn></mrow></msub></mfrac><mo>=</mo><mfrac><mrow><mi>k</mi><mo>\u2212</mo><mn>1</mn></mrow><mrow><mi>k</mi><mo>+</mo><mn>1</mn><mo>+</mo><msqrt><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>k</mi></mrow></msqrt></mrow></mfrac></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">r_{k+2}=\\frac{1}{b_{k+2}}=\\frac{k-1}{k+1+\\sqrt{2(k+1)k}}.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n</div>\n<div
        id=\"S5.10.p6\" class=\"ltx_para\">\n<p id=\"S5.10.p6.4\" class=\"ltx_p\">The
        relaxation factor <math id=\"S5.10.p6.1.m1\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        can be computed as <math id=\"S5.10.p6.2.m2\" class=\"ltx_Math\" alttext=\"1+\\frac{k-1}{k+1+\\sqrt{2(k+1)k}}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>k</mi><mo>\u2212</mo><mn>1</mn></mrow><mrow><mi>k</mi><mo>+</mo><mn>1</mn><mo>+</mo><msqrt><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo
        stretchy=\"false\">)</mo></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>k</mi></mrow></msqrt></mrow></mfrac></mrow><annotation
        encoding=\"application/x-tex\">1+\\frac{k-1}{k+1+\\sqrt{2(k+1)k}}</annotation></semantics></math>
        which can be upper bounded by <math id=\"S5.10.p6.3.m3\" class=\"ltx_Math\"
        alttext=\"\\sqrt{2}\" display=\"inline\" intent=\":literal\"><semantics><msqrt><mn>2</mn></msqrt><annotation
        encoding=\"application/x-tex\">\\sqrt{2}</annotation></semantics></math> for
        <math id=\"S5.10.p6.4.m4\" class=\"ltx_Math\" alttext=\"k\\rightarrow\\infty\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>k</mi><mo stretchy=\"false\">\u2192</mo><mi
        mathvariant=\"normal\">\u221E</mi></mrow><annotation encoding=\"application/x-tex\">k\\rightarrow\\infty</annotation></semantics></math>.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S5.p5\" class=\"ltx_para\">\n<p id=\"S5.p5.1\" class=\"ltx_p\">Once the
        candidate MEBs are fixed, Algorithm\_<a href=\"#alg1\" title=\"Algorithm 1
        \u2023 5 Optimal algorithm for MEB validity \u2023 Practical Validity Conditions
        for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">1</span></a> can be viewed as a second-order cone program, implying
        that the optimization problem is convex. However, the computational bottleneck
        is finding all candidate balls. Next, we study standard aggregation rules
        with explicit relaxed-<math id=\"S5.p5.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        guarantees.</p>\n</div>\n</section>\n<section id=\"S6\" class=\"ltx_section\">\n<h2
        class=\"ltx_title ltx_title_section\">\n<span class=\"ltx_tag ltx_tag_section\">6
        </span>Existing algorithms satisfying <math id=\"S6.1.m1\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S6.2.m2\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>-validity</h2>\n\n<div
        id=\"S6.p1\" class=\"ltx_para\">\n<p id=\"S6.p1.4\" class=\"ltx_p\">In the
        following, we examine the use of known algorithms, such as minimum-diameter
        averaging (MDA), geometric median and medoid, for <math id=\"S6.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. Our objective is to provide guarantees on the output of these algorithms
        w.r.t. the minimum enclosing ball of the honest input. For each algorithm,
        we provide a constant <math id=\"S6.p1.2.m2\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>,
        for which the algorithm satisfies <math id=\"S6.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S6.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. First, we define MDA, geometric median and medoid.</p>\n</div>\n<div
        id=\"S6.Thmtheorem1\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem1.1.1.1\" class=\"ltx_text ltx_font_bold\">Definition 6.1</span></span><span
        id=\"S6.Thmtheorem1.2.2\" class=\"ltx_text ltx_font_bold\"> </span>(MDA)<span
        id=\"S6.Thmtheorem1.3.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem1.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem1.p1.6\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem1.p1.6.6\" class=\"ltx_text ltx_font_italic\">Let
        <math id=\"S6.Thmtheorem1.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"P=\\{v_{1},\\dots,v_{n}\\}\\subset\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>P</mi><mo>=</mo><mrow><mo
        stretchy=\"false\">{</mo><msub><mi>v</mi><mn>1</mn></msub><mo>,</mo><mi mathvariant=\"normal\">\u2026</mi><mo>,</mo><msub><mi>v</mi><mi>n</mi></msub><mo
        stretchy=\"false\">}</mo></mrow><mo>\u2282</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow><annotation
        encoding=\"application/x-tex\">P=\\{v_{1},\\dots,v_{n}\\}\\subset\\mathbb{R}^{d}</annotation></semantics></math>
        and let <math id=\"S6.Thmtheorem1.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"t\"
        display=\"inline\" intent=\":literal\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math>
        be the maximal number of Byzantine nodes. Define the diameter of a set <math
        id=\"S6.Thmtheorem1.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"M\\subseteq P\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>M</mi><mo>\u2286</mo><mi>P</mi></mrow><annotation
        encoding=\"application/x-tex\">M\\subseteq P</annotation></semantics></math>
        as <math id=\"S6.Thmtheorem1.p1.4.4.m4\" class=\"ltx_Math\" alttext=\"D_{M}=\\max_{v_{i},v_{j}\\in
        P}\\|v_{i}-v_{j}\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>D</mi><mi>M</mi></msub><mo>=</mo><mrow><msub><mi>max</mi><mrow><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>,</mo><msub><mi>v</mi><mi>j</mi></msub></mrow><mo>\u2208</mo><mi>P</mi></mrow></msub><mo>\u2061</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2212</mo><msub><mi>v</mi><mi>j</mi></msub></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">D_{M}=\\max_{v_{i},v_{j}\\in P}\\|v_{i}-v_{j}\\|_{2}</annotation></semantics></math>.\nAn
        MDA output is obtained as follows: choose a subset\n<math id=\"S6.Thmtheorem1.p1.5.5.m5\"
        class=\"ltx_Math\" alttext=\"M\\in\\arg\\min_{\\begin{subarray}{c}M\\subseteq
        P\\\\\n|M|=n-t\\end{subarray}}D_{M}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>M</mi><mo>\u2208</mo><mrow><mi>arg</mi><mo
        lspace=\"0.167em\">\u2061</mo><mrow><msub><mi>min</mi><mtable rowspacing=\"0pt\"><mtr><mtd><mrow><mi>M</mi><mo>\u2286</mo><mi>P</mi></mrow></mtd></mtr><mtr><mtd><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>M</mi><mo stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow></mtd></mtr></mtable></msub><mo
        lspace=\"0.167em\">\u2061</mo><msub><mi>D</mi><mi>M</mi></msub></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">M\\in\\arg\\min_{\\begin{subarray}{c}M\\subseteq
        P\\\\\n|M|=n-t\\end{subarray}}D_{M}</annotation></semantics></math>, and output
        <math id=\"S6.Thmtheorem1.p1.6.6.m6\" class=\"ltx_Math\" alttext=\"MDA=\\frac{1}{|M|}\\sum_{v_{i}\\in
        M}v_{i}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>M</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>D</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>A</mi></mrow><mo>=</mo><mrow><mfrac><mn>1</mn><mrow><mo
        stretchy=\"false\">|</mo><mi>M</mi><mo stretchy=\"false\">|</mo></mrow></mfrac><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><msub><mo>\u2211</mo><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2208</mo><mi>M</mi></mrow></msub><msub><mi>v</mi><mi>i</mi></msub></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">MDA=\\frac{1}{|M|}\\sum_{v_{i}\\in M}v_{i}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S6.Thmtheorem2\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem2.1.1.1\" class=\"ltx_text ltx_font_bold\">Definition 6.2</span></span><span
        id=\"S6.Thmtheorem2.2.2\" class=\"ltx_text ltx_font_bold\"> </span>(Geometric
        Median)<span id=\"S6.Thmtheorem2.3.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem2.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem2.p1.5\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem2.p1.5.5\" class=\"ltx_text ltx_font_italic\">Consider
        a set of <math id=\"S6.Thmtheorem2.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"n\"
        display=\"inline\" intent=\":literal\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>
        nodes <math id=\"S6.Thmtheorem2.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\{v_{1},v_{2},\\dots,v_{n}\\}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">{</mo><msub><mi>v</mi><mn>1</mn></msub><mo>,</mo><msub><mi>v</mi><mn>2</mn></msub><mo>,</mo><mi
        mathvariant=\"normal\">\u2026</mi><mo>,</mo><msub><mi>v</mi><mi>n</mi></msub><mo
        stretchy=\"false\">}</mo></mrow><annotation encoding=\"application/x-tex\">\\{v_{1},v_{2},\\dots,v_{n}\\}</annotation></semantics></math>
        with each <math id=\"S6.Thmtheorem2.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"v_{i}\\in\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2208</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow><annotation
        encoding=\"application/x-tex\">v_{i}\\in\\mathbb{R}^{d}</annotation></semantics></math>,
        the geometric median of this set, denoted <math id=\"S6.Thmtheorem2.p1.4.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mu\" display=\"inline\" intent=\":literal\"><semantics><mi>\u03BC</mi><annotation
        encoding=\"application/x-tex\">\\mu</annotation></semantics></math>, is defined
        as\n<math id=\"S6.Thmtheorem2.p1.5.5.m5\" class=\"ltx_Math\" alttext=\"{\\underset{\\mu\\in\\mathbb{R}^{d}}{\\operatorname{arg\\,min}}}\\sum_{i=1}^{n}\\left\\|v_{i}-\\mu\\right\\|_{2}.\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><munder accentunder=\"true\"><mrow><mi>arg</mi><mo
        lspace=\"0.170em\" rspace=\"0em\">\u200B</mo><mi>min</mi></mrow><mrow><mi
        mathsize=\"0.700em\">\u03BC</mi><mo mathsize=\"0.700em\">\u2208</mo><msup><mi
        mathsize=\"0.700em\">\u211D</mi><mi mathsize=\"0.710em\">d</mi></msup></mrow></munder><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><msubsup><mo rspace=\"0em\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup><msub><mrow><mo>\u2016</mo><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2212</mo><mi>\u03BC</mi></mrow><mo>\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">{\\underset{\\mu\\in\\mathbb{R}^{d}}{\\operatorname{arg\\,min}}}\\sum_{i=1}^{n}\\left\\|v_{i}-\\mu\\right\\|_{2}.</annotation></semantics></math></span></p>\n</div>\n</div>\n<div
        id=\"S6.Thmtheorem3\" class=\"ltx_theorem ltx_theorem_definition\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem3.1.1.1\" class=\"ltx_text ltx_font_bold\">Definition 6.3</span></span><span
        id=\"S6.Thmtheorem3.2.2\" class=\"ltx_text ltx_font_bold\"> </span>(Medoid)<span
        id=\"S6.Thmtheorem3.3.3\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem3.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem3.p1.3\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem3.p1.3.3\" class=\"ltx_text ltx_font_italic\">Let
        <math id=\"S6.Thmtheorem3.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"P=\\{v_{1},\\dots,v_{n}\\}\\subset\\mathbb{R}^{d}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>P</mi><mo>=</mo><mrow><mo
        stretchy=\"false\">{</mo><msub><mi>v</mi><mn>1</mn></msub><mo>,</mo><mi mathvariant=\"normal\">\u2026</mi><mo>,</mo><msub><mi>v</mi><mi>n</mi></msub><mo
        stretchy=\"false\">}</mo></mrow><mo>\u2282</mo><msup><mi>\u211D</mi><mi>d</mi></msup></mrow><annotation
        encoding=\"application/x-tex\">P=\\{v_{1},\\dots,v_{n}\\}\\subset\\mathbb{R}^{d}</annotation></semantics></math>.
        A medoid of <math id=\"S6.Thmtheorem3.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"P\"
        display=\"inline\" intent=\":literal\"><semantics><mi>P</mi><annotation encoding=\"application/x-tex\">P</annotation></semantics></math>
        is any input point\n<math id=\"S6.Thmtheorem3.p1.3.3.m3\" class=\"ltx_Math\"
        alttext=\"y\\in\\arg\\min_{v_{i}\\in P}\\sum_{j=1}^{n}\\|v_{i}-v_{j}\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>y</mi><mo>\u2208</mo><mrow><mrow><mi>arg</mi><mo
        lspace=\"0.167em\">\u2061</mo><msub><mi>min</mi><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2208</mo><mi>P</mi></mrow></msub></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><msubsup><mo rspace=\"0em\">\u2211</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msub><mi>v</mi><mi>i</mi></msub><mo>\u2212</mo><msub><mi>v</mi><mi>j</mi></msub></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">y\\in\\arg\\min_{v_{i}\\in P}\\sum_{j=1}^{n}\\|v_{i}-v_{j}\\|_{2}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S6.p2\" class=\"ltx_para\">\n<p id=\"S6.p2.2\" class=\"ltx_p\">We begin
        with MDA, which selects a minimum-diameter subset and averages its elements
        and show that it satisfies <math id=\"S6.p2.1.m1\" class=\"ltx_Math\" alttext=\"\\left(1+\\frac{2t}{n-t}\\right)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mrow><mo>)</mo></mrow><annotation
        encoding=\"application/x-tex\">\\left(1+\\frac{2t}{n-t}\\right)</annotation></semantics></math>-<math
        id=\"S6.p2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</p>\n</div>\n<div id=\"S6.Thmtheorem4\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6
        class=\"ltx_title ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem4.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 6.4</span></span><span
        id=\"S6.Thmtheorem4.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem4.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem4.p1.2\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem4.p1.2.2\" class=\"ltx_text ltx_font_italic\">MDA
        satisfies <math id=\"S6.Thmtheorem4.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"\\left(1+\\frac{2t}{n-t}\\right)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mrow><mo>)</mo></mrow><annotation
        encoding=\"application/x-tex\">\\left(1+\\frac{2t}{n-t}\\right)</annotation></semantics></math>-<math
        id=\"S6.Thmtheorem4.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S6.3\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S6.3.p1\" class=\"ltx_para\">\n<p id=\"S6.3.p1.10\" class=\"ltx_p\">Let
        <math id=\"S6.3.p1.1.m1\" class=\"ltx_Math\" alttext=\"r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math> denote
        the radius of the <math id=\"S6.3.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        around honest inputs <math id=\"S6.3.p1.3.m3\" class=\"ltx_Math\" alttext=\"H\"
        display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation encoding=\"application/x-tex\">H</annotation></semantics></math>,
        with <math id=\"S6.3.p1.4.m4\" class=\"ltx_Math\" alttext=\"|H|\\geq n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mi>H</mi><mo
        stretchy=\"false\">|</mo></mrow><mo>\u2265</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|H|\\geq n-t</annotation></semantics></math>
        and let <math id=\"S6.3.p1.5.m5\" class=\"ltx_Math\" alttext=\"M\" display=\"inline\"
        intent=\":literal\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math>
        be the subset of <math id=\"S6.3.p1.6.m6\" class=\"ltx_Math\" alttext=\"n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> nodes which
        have the smallest diameter <math id=\"S6.3.p1.7.m7\" class=\"ltx_Math\" alttext=\"D_{M}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mi>D</mi><mi>M</mi></msub><annotation
        encoding=\"application/x-tex\">D_{M}</annotation></semantics></math>. The
        diameter of subset <math id=\"S6.3.p1.8.m8\" class=\"ltx_Math\" alttext=\"M\"
        display=\"inline\" intent=\":literal\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math>
        is at most twice the radius of the true <math id=\"S6.3.p1.9.m9\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        i.e. <math id=\"S6.3.p1.10.m10\" class=\"ltx_Math\" alttext=\"D_{M}\\leq 2r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>D</mi><mi>M</mi></msub><mo>\u2264</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">D_{M}\\leq 2r^{*}</annotation></semantics></math>.\nNow,
        the distance between MDA and the center of the ball is</p>\n<table id=\"A0.EGx3\"
        class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody id=\"S6.E2\"><tr
        class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math
        id=\"S6.E2.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\|MDA-C^{*}\\|_{2}\\leq\\frac{1}{n-t}\\sum_{x\\in
        M}\\|x-C^{*}\\|_{2}.\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mrow><mi>M</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>D</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>A</mi></mrow><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><mrow><mstyle
        displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mstyle><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mstyle displaystyle=\"true\"><munder><mo
        movablelimits=\"false\">\u2211</mo><mrow><mi>x</mi><mo>\u2208</mo><mi>M</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>x</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\|MDA-C^{*}\\|_{2}\\leq\\frac{1}{n-t}\\sum_{x\\in
        M}\\|x-C^{*}\\|_{2}.</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n<td rowspan=\"1\" class=\"ltx_eqn_cell ltx_eqn_eqno
        ltx_align_middle ltx_align_right\"><span class=\"ltx_tag ltx_tag_equation
        ltx_align_right\">(2)</span></td>\n</tr></tbody>\n</table>\n<p id=\"S6.3.p1.31\"
        class=\"ltx_p\">The subset <math id=\"S6.3.p1.11.m1\" class=\"ltx_Math\" alttext=\"M\"
        display=\"inline\" intent=\":literal\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math>
        consists of exactly <math id=\"S6.3.p1.12.m2\" class=\"ltx_Math\" alttext=\"n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> nodes,
        implying that there is at least one honest node contained in <math id=\"S6.3.p1.13.m3\"
        class=\"ltx_Math\" alttext=\"M\" display=\"inline\" intent=\":literal\"><semantics><mi>M</mi><annotation
        encoding=\"application/x-tex\">M</annotation></semantics></math>. Therefore,
        we can split the subset <math id=\"S6.3.p1.14.m4\" class=\"ltx_Math\" alttext=\"M\"
        display=\"inline\" intent=\":literal\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math>
        into honest <math id=\"S6.3.p1.15.m5\" class=\"ltx_Math\" alttext=\"H\" display=\"inline\"
        intent=\":literal\"><semantics><mi>H</mi><annotation encoding=\"application/x-tex\">H</annotation></semantics></math>
        and Byzantine <math id=\"S6.3.p1.16.m6\" class=\"ltx_Math\" alttext=\"B\"
        display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>
        subset of nodes. For each <math id=\"S6.3.p1.17.m7\" class=\"ltx_Math\" alttext=\"h\\in
        H\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow><annotation
        encoding=\"application/x-tex\">h\\in H</annotation></semantics></math>, the
        distance to the center of the <math id=\"S6.3.p1.18.m8\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is bounded by <math id=\"S6.3.p1.19.m9\" class=\"ltx_Math\" alttext=\"\\|h-C^{*}\\|_{2}\\leq
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\|h-C^{*}\\|_{2}\\leq r^{*}</annotation></semantics></math>.
        For each <math id=\"S6.3.p1.20.m10\" class=\"ltx_Math\" alttext=\"b\\in B\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow><annotation
        encoding=\"application/x-tex\">b\\in B</annotation></semantics></math>, using
        triangle inequality, we show that <math id=\"S6.3.p1.21.m11\" class=\"ltx_Math\"
        alttext=\"b\" display=\"inline\" intent=\":literal\"><semantics><mi>b</mi><annotation
        encoding=\"application/x-tex\">b</annotation></semantics></math> is at distance
        at most <math id=\"S6.3.p1.22.m12\" class=\"ltx_Math\" alttext=\"3r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mn>3</mn><mo lspace=\"0em\"
        rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">3r^{*}</annotation></semantics></math> from
        the center of the <math id=\"S6.3.p1.23.m13\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>:\n<math
        id=\"S6.3.p1.24.m14\" class=\"ltx_Math\" alttext=\"\\|b-C_{\\mathrm{MEB}}^{*}\\|_{2}&lt;\\|b-u\\|_{2}+\\|h-C_{\\mathrm{MEB}}^{*}\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>b</mi><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>&lt;</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>b</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\|b-C_{\\mathrm{MEB}}^{*}\\|_{2}&lt;\\|b-u\\|_{2}+\\|h-C_{\\mathrm{MEB}}^{*}\\|_{2}</annotation></semantics></math>,
        where <math id=\"S6.3.p1.25.m15\" class=\"ltx_Math\" alttext=\"u\" display=\"inline\"
        intent=\":literal\"><semantics><mi>u</mi><annotation encoding=\"application/x-tex\">u</annotation></semantics></math>
        is a honest node contained in <math id=\"S6.3.p1.26.m16\" class=\"ltx_Math\"
        alttext=\"M\" display=\"inline\" intent=\":literal\"><semantics><mi>M</mi><annotation
        encoding=\"application/x-tex\">M</annotation></semantics></math>.\nSince <math
        id=\"S6.3.p1.27.m17\" class=\"ltx_Math\" alttext=\"u\\in\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>u</mi><mo>\u2208</mo><mi>MEB</mi></mrow><annotation
        encoding=\"application/x-tex\">u\\in\\mathrm{MEB}</annotation></semantics></math>,
        then <math id=\"S6.3.p1.28.m18\" class=\"ltx_Math\" alttext=\"\\|u-C_{\\mathrm{MEB}}^{*}\\|_{2}=r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>u</mi><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>=</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\|u-C_{\\mathrm{MEB}}^{*}\\|_{2}=r^{*}</annotation></semantics></math>,
        whereas <math id=\"S6.3.p1.29.m19\" class=\"ltx_Math\" alttext=\"{u,v}\\in
        M\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>u</mi><mo>,</mo><mi>v</mi></mrow><mo>\u2208</mo><mi>M</mi></mrow><annotation
        encoding=\"application/x-tex\">{u,v}\\in M</annotation></semantics></math>
        implies <math id=\"S6.3.p1.30.m20\" class=\"ltx_Math\" alttext=\"\\|b-u\\|_{2}\\leq
        2r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>b</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\|b-u\\|_{2}\\leq 2r^{*}</annotation></semantics></math>.
        Together it leads to <math id=\"S6.3.p1.31.m21\" class=\"ltx_Math\" alttext=\"\\|b-C_{\\mathrm{MEB}}^{*}\\|_{2}\\leq
        3r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>b</mi><mo>\u2212</mo><msubsup><mi>C</mi><mi>MEB</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\|b-C_{\\mathrm{MEB}}^{*}\\|_{2}\\leq 3r^{*}</annotation></semantics></math>.\nFinally,
        we can plug these results into Equation <a href=\"#S6.E2\" title=\"In Proof.
        \u2023 6 Existing algorithms satisfying \U0001D450-MEB-validity \u2023 Practical
        Validity Conditions for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">2</span></a>.</p>\n<table id=\"A0.EGx4\" class=\"ltx_equationgroup
        ltx_eqn_align ltx_eqn_table\">\n\n<tbody id=\"S6.Ex5\"><tr class=\"ltx_equation
        ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td
        class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math id=\"S6.Ex5.m1\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\|MDA-C^{*}\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mrow><mi>M</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>D</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>A</mi></mrow><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\displaystyle\\|MDA-C^{*}\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex5.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\frac{|H|\\cdot r^{*}+|B|\\cdot 3r^{*}}{n-t}\\leq\\frac{(n-t-|B|)\\cdot
        r^{*}+|B|\\cdot 3r^{*}}{n-t}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mrow><mrow><mo stretchy=\"false\">|</mo><mi>H</mi><mo
        rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>B</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mn>3</mn></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mstyle><mo>\u2264</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mrow><mrow><mo stretchy=\"false\">(</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi><mo>\u2212</mo><mrow><mo
        stretchy=\"false\">|</mo><mi>B</mi><mo stretchy=\"false\">|</mo></mrow></mrow><mo
        rspace=\"0.055em\" stretchy=\"false\">)</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>B</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mn>3</mn></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mstyle></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq\\frac{|H|\\cdot r^{*}+|B|\\cdot
        3r^{*}}{n-t}\\leq\\frac{(n-t-|B|)\\cdot r^{*}+|B|\\cdot 3r^{*}}{n-t}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S6.Ex6\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_eqn_cell\"></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex6.m1\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\left(1+\\frac{2|B|}{n-t}\\right)r^{*}\\leq\\left(1+\\frac{2t}{n-t}\\right)r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">|</mo><mi>B</mi><mo stretchy=\"false\">|</mo></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mstyle></mrow><mo>)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>\u2264</mo><mrow><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mstyle
        displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mfrac></mstyle></mrow><mo>)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq\\left(1+\\frac{2|B|}{n-t}\\right)r^{*}\\leq\\left(1+\\frac{2t}{n-t}\\right)r^{*}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S6.3.p1.32\" class=\"ltx_p\">\u220E</p>\n</div>\n</div>\n<div id=\"S6.p3\"
        class=\"ltx_para\">\n<p id=\"S6.p3.1\" class=\"ltx_p\">Next, we examine the
        medoid. Unlike MDA, the medoid minimizes the total distance to all inputs
        and restricts the output to be one of the input nodes.</p>\n</div>\n<div id=\"S6.p4\"
        class=\"ltx_para\">\n<p id=\"S6.p4.5\" class=\"ltx_p\">We show that the medoid
        satisfies <math id=\"S6.p4.1.m1\" class=\"ltx_Math\" alttext=\"\\frac{3n-2t}{n-2t}\"
        display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>n</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{3n-2t}{n-2t}</annotation></semantics></math>-<math
        id=\"S6.p4.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity and prove that it cannot satisfy <math id=\"S6.p4.3.m3\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S6.p4.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, for <math id=\"S6.p4.5.m5\" class=\"ltx_Math\" alttext=\"c\\leq
        2\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>\u2264</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">c\\leq 2</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S6.Thmtheorem5\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem5.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 6.5</span></span><span
        id=\"S6.Thmtheorem5.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem5.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem5.p1.2\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem5.p1.2.2\" class=\"ltx_text ltx_font_italic\">Medoid
        satisfies <math id=\"S6.Thmtheorem5.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"\\frac{3n-2t}{n-2t}\"
        display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>n</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{3n-2t}{n-2t}</annotation></semantics></math>-<math
        id=\"S6.Thmtheorem5.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S6.5\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S6.4.p1\" class=\"ltx_para\">\n<p id=\"S6.4.p1.12\" class=\"ltx_p\">Let
        <math id=\"S6.4.p1.1.m1\" class=\"ltx_Math\" alttext=\"P\" display=\"inline\"
        intent=\":literal\"><semantics><mi>P</mi><annotation encoding=\"application/x-tex\">P</annotation></semantics></math>
        be the set of points, consisting of honest nodes in subset <math id=\"S6.4.p1.2.m2\"
        class=\"ltx_Math\" alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math> and Byzantine
        nodes in subset <math id=\"S6.4.p1.3.m3\" class=\"ltx_Math\" alttext=\"B\"
        display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>.
        Let the true <math id=\"S6.4.p1.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        have the center <math id=\"S6.4.p1.5.m5\" class=\"ltx_Math\" alttext=\"C^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>C</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">C^{*}</annotation></semantics></math> with
        radius <math id=\"S6.4.p1.6.m6\" class=\"ltx_Math\" alttext=\"r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math>. Denote
        the medoid by <math id=\"S6.4.p1.7.m7\" class=\"ltx_Math\" alttext=\"m\" display=\"inline\"
        intent=\":literal\"><semantics><mi>m</mi><annotation encoding=\"application/x-tex\">m</annotation></semantics></math>
        and the distance between the medoid and the center of <math id=\"S6.4.p1.8.m8\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        by <math id=\"S6.4.p1.9.m9\" class=\"ltx_Math\" alttext=\"D=\\|m-C^{*}\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>D</mi><mo>=</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">D=\\|m-C^{*}\\|_{2}</annotation></semantics></math>.
        For each honest node <math id=\"S6.4.p1.10.m10\" class=\"ltx_Math\" alttext=\"h\\in
        H\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow><annotation
        encoding=\"application/x-tex\">h\\in H</annotation></semantics></math>, the
        following is true per definition: <math id=\"S6.4.p1.11.m11\" class=\"ltx_Math\"
        alttext=\"\\sum_{p\\in P}\\|m-p\\|_{2}\\leq\\sum_{p\\in P}\\|h-p\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mo>\u2211</mo><mrow><mi>p</mi><mo>\u2208</mo><mi>P</mi></mrow></msub><msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>p</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo rspace=\"0.111em\">\u2264</mo><mrow><msub><mo
        rspace=\"0em\">\u2211</mo><mrow><mi>p</mi><mo>\u2208</mo><mi>P</mi></mrow></msub><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>p</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\sum_{p\\in P}\\|m-p\\|_{2}\\leq\\sum_{p\\in
        P}\\|h-p\\|_{2}</annotation></semantics></math>. We can split the set <math
        id=\"S6.4.p1.12.m12\" class=\"ltx_Math\" alttext=\"P\" display=\"inline\"
        intent=\":literal\"><semantics><mi>P</mi><annotation encoding=\"application/x-tex\">P</annotation></semantics></math>
        into honest and Byzantine nodes:</p>\n</div>\n<div id=\"S6.5.p2\" class=\"ltx_para\">\n<table
        id=\"S6.E3\" class=\"ltx_equation ltx_eqn_table\">\n\n<tbody><tr class=\"ltx_equation
        ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td
        class=\"ltx_eqn_cell ltx_align_center\"><math id=\"S6.E3.m1\" class=\"ltx_Math\"
        alttext=\"\\sum_{u\\in H}\\|m-u\\|_{2}+\\sum_{b\\in B}\\|m-b\\|_{2}\\leq\\sum_{u\\in
        H}\\|h-u\\|_{2}+\\sum_{b\\in B}\\|h-b\\|_{2}\\\\\n\" display=\"block\" intent=\":literal\"><semantics><mrow><mrow><mrow><munder><mo
        movablelimits=\"false\">\u2211</mo><mrow><mi>u</mi><mo>\u2208</mo><mi>H</mi></mrow></munder><msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo rspace=\"0.055em\">+</mo><mrow><munder><mo
        movablelimits=\"false\" rspace=\"0em\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><mo rspace=\"0.111em\">\u2264</mo><mrow><mrow><munder><mo
        movablelimits=\"false\" rspace=\"0em\">\u2211</mo><mrow><mi>u</mi><mo>\u2208</mo><mi>H</mi></mrow></munder><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo rspace=\"0.055em\">+</mo><mrow><munder><mo
        movablelimits=\"false\" rspace=\"0em\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\sum_{u\\in H}\\|m-u\\|_{2}+\\sum_{b\\in B}\\|m-b\\|_{2}\\leq\\sum_{u\\in
        H}\\|h-u\\|_{2}+\\sum_{b\\in B}\\|h-b\\|_{2}\\\\\n</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n<td rowspan=\"1\" class=\"ltx_eqn_cell
        ltx_eqn_eqno ltx_align_middle ltx_align_right\"><span class=\"ltx_tag ltx_tag_equation
        ltx_align_right\">(3)</span></td>\n</tr></tbody>\n</table>\n<p id=\"S6.5.p2.1\"
        class=\"ltx_p\">For any honest <math id=\"S6.5.p2.1.m1\" class=\"ltx_Math\"
        alttext=\"u\\in H\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>u</mi><mo>\u2208</mo><mi>H</mi></mrow><annotation
        encoding=\"application/x-tex\">u\\in H</annotation></semantics></math></p>\n<table
        id=\"A0.EGx5\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S6.Ex7\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex7.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\|m-u\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\displaystyle\\|m-u\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex7.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\geq\\|m-C^{*}\\|_{2}-\\|u-C^{*}\\|_{2}\\geq D-r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2265</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2212</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>u</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>\u2265</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\geq\\|m-C^{*}\\|_{2}-\\|u-C^{*}\\|_{2}\\geq
        D-r^{*}</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S6.5.p2.9\" class=\"ltx_p\">holds due to the triangle inequality.</p>\n<table
        id=\"A0.EGx6\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S6.Ex8\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex8.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\sum_{u\\in
        H}\\|m-u\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>u</mi><mo>\u2208</mo><mi>H</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\sum_{u\\in
        H}\\|m-u\\|_{2}</annotation></semantics></math></td>\n<td class=\"ltx_td ltx_align_left
        ltx_eqn_cell\"><math id=\"S6.Ex8.m2\" class=\"ltx_Math\" alttext=\"\\displaystyle\\geq|H|\\cdot(D-r^{*})\\quad\\forall
        u\\in H.\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mi></mi><mo>\u2265</mo><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow><mspace style=\"width:1.167em;\"
        width=\"1.167em\"></mspace><mrow><mrow><mo rspace=\"0.167em\">\u2200</mo><mi>u</mi></mrow><mo>\u2208</mo><mi>H</mi></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\geq|H|\\cdot(D-r^{*})\\quad\\forall
        u\\in H.</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S6.5.p2.4\" class=\"ltx_p\">Now, for the right part of the Equation <a
        href=\"#S6.E3\" title=\"In Proof. \u2023 6 Existing algorithms satisfying
        \U0001D450-MEB-validity \u2023 Practical Validity Conditions for Byzantine-Tolerant
        Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">3</span></a>,
        we bound <math id=\"S6.5.p2.2.m1\" class=\"ltx_Math\" alttext=\"\\sum_{u\\in
        H}\\|h-u\\|_{2}\\leq|H|\\cdot 2r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mo>\u2211</mo><mrow><mi>u</mi><mo>\u2208</mo><mi>H</mi></mrow></msub><msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>u</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>\u2264</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mn>2</mn></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\sum_{u\\in H}\\|h-u\\|_{2}\\leq|H|\\cdot
        2r^{*}</annotation></semantics></math>, as two honest nodes are at most <math
        id=\"S6.5.p2.3.m2\" class=\"ltx_Math\" alttext=\"2r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mn>2</mn><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">2r^{*}</annotation></semantics></math> apart.
        Then, for any <math id=\"S6.5.p2.4.m3\" class=\"ltx_Math\" alttext=\"b\\in
        B\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow><annotation
        encoding=\"application/x-tex\">b\\in B</annotation></semantics></math> the
        following triangle inequality applies:</p>\n<table id=\"A0.EGx7\" class=\"ltx_equationgroup
        ltx_eqn_align ltx_eqn_table\">\n\n<tbody id=\"S6.Ex9\"><tr class=\"ltx_equation
        ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td
        class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math id=\"S6.Ex9.m1\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\|h-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\displaystyle\\|h-b\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex9.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\|h-m\\|_{2}+\\|m-b\\|_{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>m</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq\\|h-m\\|_{2}+\\|m-b\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S6.Ex10\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex10.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\sum_{b\\in
        B}\\|h-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\sum_{b\\in
        B}\\|h-b\\|_{2}</annotation></semantics></math></td>\n<td class=\"ltx_td ltx_align_left
        ltx_eqn_cell\"><math id=\"S6.Ex10.m2\" class=\"ltx_Math\" alttext=\"\\displaystyle\\leq
        t\\cdot\\|h-m\\|_{2}+\\sum_{b\\in B}\\|m-b\\|_{2}\\quad\\forall b\\in B.\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mi>t</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>m</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>+</mo><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><mspace
        style=\"width:1.167em;\" width=\"1.167em\"></mspace><mrow><mrow><mo rspace=\"0.167em\">\u2200</mo><mi>b</mi></mrow><mo>\u2208</mo><mi>B</mi></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\leq
        t\\cdot\\|h-m\\|_{2}+\\sum_{b\\in B}\\|m-b\\|_{2}\\quad\\forall b\\in B.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S6.5.p2.10\" class=\"ltx_p\">Now we plug this into Equation <a href=\"#S6.E3\"
        title=\"In Proof. \u2023 6 Existing algorithms satisfying \U0001D450-MEB-validity
        \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated Learning\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">3</span></a>:</p>\n<table
        id=\"A0.EGx8\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S6.Ex11\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex11.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle|H|\\cdot(D-r^{*})+\\sum_{b\\in
        B}\\|m-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mo>+</mo><mrow><mstyle displaystyle=\"true\"><munder><mo
        movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle|H|\\cdot(D-r^{*})+\\sum_{b\\in
        B}\\|m-b\\|_{2}</annotation></semantics></math></td>\n<td class=\"ltx_td ltx_align_left
        ltx_eqn_cell\"><math id=\"S6.Ex11.m2\" class=\"ltx_Math\" alttext=\"\\displaystyle\\leq|H|\\cdot
        2r^{*}+t\\cdot\\|h-m\\|_{2}+\\sum_{b\\in B}\\|m-b\\|_{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mn>2</mn></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><mrow><mi>t</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><mi>m</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>+</mo><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq|H|\\cdot 2r^{*}+t\\cdot\\|h-m\\|_{2}+\\sum_{b\\in
        B}\\|m-b\\|_{2}</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody id=\"S6.Ex12\"><tr
        class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math
        id=\"S6.Ex12.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle|H|\\cdot(D-r^{*})\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mi>H</mi><mo
        rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\displaystyle|H|\\cdot(D-r^{*})</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex12.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq|H|\\cdot 2r^{*}+t\\cdot(\\|m-C^{*}\\|_{2}+\\|h-C^{*}\\|_{2})\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mn>2</mn></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><mrow><mi>t</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>m</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo stretchy=\"false\">)</mo></mrow></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq|H|\\cdot 2r^{*}+t\\cdot(\\|m-C^{*}\\|_{2}+\\|h-C^{*}\\|_{2})</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S6.Ex13\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex13.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle|H|\\cdot(D-r^{*})\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mi>H</mi><mo
        rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\displaystyle|H|\\cdot(D-r^{*})</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex13.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq|H|\\cdot 2r^{*}+t\\cdot(D+r^{*})\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mn>2</mn></mrow><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><mrow><mi>t</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>+</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\leq|H|\\cdot
        2r^{*}+t\\cdot(D+r^{*})</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody id=\"S6.Ex14\"><tr
        class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math
        id=\"S6.Ex14.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle(|H|-t)\\cdot
        D\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">(</mo><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mo>\u2212</mo><mi>t</mi></mrow><mo
        rspace=\"0.055em\" stretchy=\"false\">)</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><mi>D</mi></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle(|H|-t)\\cdot D</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex14.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq r^{*}(3|H|+t)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><msup><mi>r</mi><mo>\u2217</mo></msup><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">|</mo><mi>H</mi><mo
        stretchy=\"false\">|</mo></mrow></mrow><mo>+</mo><mi>t</mi></mrow><mo stretchy=\"false\">)</mo></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq r^{*}(3|H|+t)</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S6.5.p2.8\" class=\"ltx_p\">In the worst case if <math id=\"S6.5.p2.5.m1\"
        class=\"ltx_Math\" alttext=\"|H|=n-t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|H|=n-t</annotation></semantics></math>, then:
        <math id=\"S6.5.p2.6.m2\" class=\"ltx_Math\" alttext=\"D\\leq\\frac{3n-2t}{n-2t}r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>D</mi><mo>\u2264</mo><mrow><mfrac><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>n</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">D\\leq\\frac{3n-2t}{n-2t}r^{*}</annotation></semantics></math>,
        meaning the distance between the medoid and the center of the <math id=\"S6.5.p2.7.m3\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is at most <math id=\"S6.5.p2.8.m4\" class=\"ltx_Math\" alttext=\"\\frac{3n-2t}{n-2t}r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>n</mi></mrow><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\frac{3n-2t}{n-2t}r^{*}</annotation></semantics></math>.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S6.Thmtheorem6\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem6.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 6.6</span></span><span
        id=\"S6.Thmtheorem6.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem6.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem6.p1.3\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem6.p1.3.3\" class=\"ltx_text ltx_font_italic\">Medoid
        cannot satisfy <math id=\"S6.Thmtheorem6.p1.1.1.m1\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S6.Thmtheorem6.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity for <math id=\"S6.Thmtheorem6.p1.3.3.m3\" class=\"ltx_Math\" alttext=\"c\\leq
        2\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>\u2264</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">c\\leq 2</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S6.6\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S6.6.p1\" class=\"ltx_para\">\n<p
        id=\"S6.6.p1.50\" class=\"ltx_p\">Consider the following example with <math
        id=\"S6.6.p1.1.m1\" class=\"ltx_Math\" alttext=\"n=2t+1\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>=</mo><mrow><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>+</mo><mn>1</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">n=2t+1</annotation></semantics></math> nodes
        divided into subsets <math id=\"S6.6.p1.2.m2\" class=\"ltx_Math\" alttext=\"A,B,C,D,E\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>A</mi><mo>,</mo><mi>B</mi><mo>,</mo><mi>C</mi><mo>,</mo><mi>D</mi><mo>,</mo><mi>E</mi></mrow><annotation
        encoding=\"application/x-tex\">A,B,C,D,E</annotation></semantics></math> and
        <math id=\"S6.6.p1.3.m3\" class=\"ltx_Math\" alttext=\"F\" display=\"inline\"
        intent=\":literal\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>.
        Place subsets <math id=\"S6.6.p1.4.m4\" class=\"ltx_Math\" alttext=\"A\" display=\"inline\"
        intent=\":literal\"><semantics><mi>A</mi><annotation encoding=\"application/x-tex\">A</annotation></semantics></math>
        and <math id=\"S6.6.p1.5.m5\" class=\"ltx_Math\" alttext=\"D\" display=\"inline\"
        intent=\":literal\"><semantics><mi>D</mi><annotation encoding=\"application/x-tex\">D</annotation></semantics></math>
        of size <math id=\"S6.6.p1.6.m6\" class=\"ltx_Math\" alttext=\"\\frac{t}{2}-1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mi>t</mi><mn>2</mn></mfrac><mo>\u2212</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">\\frac{t}{2}-1</annotation></semantics></math>
        in <math id=\"S6.6.p1.7.m7\" class=\"ltx_Math\" alttext=\"(0,0)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0,0)</annotation></semantics></math>
        and <math id=\"S6.6.p1.8.m8\" class=\"ltx_Math\" alttext=\"(4,0)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mo>,</mo><mn>0</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(4,0)</annotation></semantics></math>,
        respectively. Then place subsets <math id=\"S6.6.p1.9.m9\" class=\"ltx_Math\"
        alttext=\"B\" display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation
        encoding=\"application/x-tex\">B</annotation></semantics></math> and <math
        id=\"S6.6.p1.10.m10\" class=\"ltx_Math\" alttext=\"C\" display=\"inline\"
        intent=\":literal\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math>
        of size <math id=\"S6.6.p1.11.m11\" class=\"ltx_Math\" alttext=\"\\frac{t}{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mfrac><mi>t</mi><mn>2</mn></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{t}{2}</annotation></semantics></math>
        in <math id=\"S6.6.p1.12.m12\" class=\"ltx_Math\" alttext=\"(1,1)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(1,1)</annotation></semantics></math>
        and <math id=\"S6.6.p1.13.m13\" class=\"ltx_Math\" alttext=\"(3,1)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>3</mn><mo>,</mo><mn>1</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(3,1)</annotation></semantics></math>.
        Finally, subset <math id=\"S6.6.p1.14.m14\" class=\"ltx_Math\" alttext=\"E\"
        display=\"inline\" intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>
        which consists of 2 nodes is found in <math id=\"S6.6.p1.15.m15\" class=\"ltx_Math\"
        alttext=\"(2,0)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mn>2</mn><mo>,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation
        encoding=\"application/x-tex\">(2,0)</annotation></semantics></math> and subset
        <math id=\"S6.6.p1.16.m16\" class=\"ltx_Math\" alttext=\"F\" display=\"inline\"
        intent=\":literal\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>
        with one node in <math id=\"S6.6.p1.17.m17\" class=\"ltx_Math\" alttext=\"(2,x)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo>,</mo><mi>x</mi><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2,x)</annotation></semantics></math>,
        where <math id=\"S6.6.p1.18.m18\" class=\"ltx_Math\" alttext=\"x\" display=\"inline\"
        intent=\":literal\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>
        is an arbitrary coordinate. The medoid of these input nodes is a node from
        subset <math id=\"S6.6.p1.19.m19\" class=\"ltx_Math\" alttext=\"B\" display=\"inline\"
        intent=\":literal\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>
        or <math id=\"S6.6.p1.20.m20\" class=\"ltx_Math\" alttext=\"C\" display=\"inline\"
        intent=\":literal\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math>,
        as both subsets consist of nodes which minimize the sum of distance to all
        other nodes and the construction is symmetric.\nNote that the minimum enclosing
        ball is defined with at least <math id=\"S6.6.p1.21.m21\" class=\"ltx_Math\"
        alttext=\"t+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">t+1</annotation></semantics></math> nodes.
        Without knowing where the Byzantine parties are at, we consider three extreme
        cases for minimum enclosing ball. The first possible <math id=\"S6.6.p1.22.m22\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        could contain all nodes in subsets <math id=\"S6.6.p1.23.m23\" class=\"ltx_Math\"
        alttext=\"A,B\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>A</mi><mo>,</mo><mi>B</mi></mrow><annotation
        encoding=\"application/x-tex\">A,B</annotation></semantics></math> and <math
        id=\"S6.6.p1.24.m24\" class=\"ltx_Math\" alttext=\"E\" display=\"inline\"
        intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>,
        with radius <math id=\"S6.6.p1.25.m25\" class=\"ltx_Math\" alttext=\"r=1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">r=1</annotation></semantics></math>. The second
        possible <math id=\"S6.6.p1.26.m26\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        could consist of subsets <math id=\"S6.6.p1.27.m27\" class=\"ltx_Math\" alttext=\"E,C\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>E</mi><mo>,</mo><mi>C</mi></mrow><annotation
        encoding=\"application/x-tex\">E,C</annotation></semantics></math> and <math
        id=\"S6.6.p1.28.m28\" class=\"ltx_Math\" alttext=\"D\" display=\"inline\"
        intent=\":literal\"><semantics><mi>D</mi><annotation encoding=\"application/x-tex\">D</annotation></semantics></math>,
        with radius <math id=\"S6.6.p1.29.m29\" class=\"ltx_Math\" alttext=\"r=1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">r=1</annotation></semantics></math>. Finally
        the third possible <math id=\"S6.6.p1.30.m30\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        can be computed on all nodes from subset <math id=\"S6.6.p1.31.m31\" class=\"ltx_Math\"
        alttext=\"B,C\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>B</mi><mo>,</mo><mi>C</mi></mrow><annotation
        encoding=\"application/x-tex\">B,C</annotation></semantics></math> and <math
        id=\"S6.6.p1.32.m32\" class=\"ltx_Math\" alttext=\"F\" display=\"inline\"
        intent=\":literal\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>,
        with radius <math id=\"S6.6.p1.33.m33\" class=\"ltx_Math\" alttext=\"r=\\frac{x}{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mfrac><mi>x</mi><mn>2</mn></mfrac></mrow><annotation
        encoding=\"application/x-tex\">r=\\frac{x}{2}</annotation></semantics></math>.
        Now, if the medoid is a node from subset <math id=\"S6.6.p1.34.m34\" class=\"ltx_Math\"
        alttext=\"B\" display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation
        encoding=\"application/x-tex\">B</annotation></semantics></math>, the true
        <math id=\"S6.6.p1.35.m35\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        could be the one consisting of nodes from subsets <math id=\"S6.6.p1.36.m36\"
        class=\"ltx_Math\" alttext=\"C,E\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>C</mi><mo>,</mo><mi>E</mi></mrow><annotation
        encoding=\"application/x-tex\">C,E</annotation></semantics></math> and <math
        id=\"S6.6.p1.37.m37\" class=\"ltx_Math\" alttext=\"D\" display=\"inline\"
        intent=\":literal\"><semantics><mi>D</mi><annotation encoding=\"application/x-tex\">D</annotation></semantics></math>
        and hence the medoid is outside the true <math id=\"S6.6.p1.38.m38\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.
        Similarly, if the medoid is a node from subset <math id=\"S6.6.p1.39.m39\"
        class=\"ltx_Math\" alttext=\"C\" display=\"inline\" intent=\":literal\"><semantics><mi>C</mi><annotation
        encoding=\"application/x-tex\">C</annotation></semantics></math>, then the
        true <math id=\"S6.6.p1.40.m40\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        could be around <math id=\"S6.6.p1.41.m41\" class=\"ltx_Math\" alttext=\"A,B\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>A</mi><mo>,</mo><mi>B</mi></mrow><annotation
        encoding=\"application/x-tex\">A,B</annotation></semantics></math> and <math
        id=\"S6.6.p1.42.m42\" class=\"ltx_Math\" alttext=\"E\" display=\"inline\"
        intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>.
        Hence, the medoid is outside the <math id=\"S6.6.p1.43.m43\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.
        In both cases, the distance from the medoid to the true <math id=\"S6.6.p1.44.m44\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is <math id=\"S6.6.p1.45.m45\" class=\"ltx_Math\" alttext=\"\\sqrt{5}\" display=\"inline\"
        intent=\":literal\"><semantics><msqrt><mn>5</mn></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{5}</annotation></semantics></math>,
        which implies <math id=\"S6.6.p1.46.m46\" class=\"ltx_Math\" alttext=\"\\sqrt{5}\\leq
        c\\cdot 1\" display=\"inline\" intent=\":literal\"><semantics><mrow><msqrt><mn>5</mn></msqrt><mo>\u2264</mo><mrow><mi>c</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mn>1</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\sqrt{5}\\leq c\\cdot 1</annotation></semantics></math>,
        for all <math id=\"S6.6.p1.47.m47\" class=\"ltx_Math\" alttext=\"c\\leq 2\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>\u2264</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">c\\leq 2</annotation></semantics></math>. Therefore,
        medoid cannot satisfy <math id=\"S6.6.p1.48.m48\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S6.6.p1.49.m49\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        for <math id=\"S6.6.p1.50.m50\" class=\"ltx_Math\" alttext=\"c\\leq 2\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>c</mi><mo>\u2264</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">c\\leq 2</annotation></semantics></math>.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S6.p5\" class=\"ltx_para\">\n<p id=\"S6.p5.1\" class=\"ltx_p\">The geometric
        median, unlike the medoid, is not restricted to outputting input points and
        instead minimizes the sum of total Euclidean distances to all nodes over <math
        id=\"S6.p5.1.m1\" class=\"ltx_Math\" alttext=\"\\mathbb{R}^{d}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>\u211D</mi><mi>d</mi></msup><annotation
        encoding=\"application/x-tex\">\\mathbb{R}^{d}</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S6.Thmtheorem7\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem7.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 6.7</span></span><span
        id=\"S6.Thmtheorem7.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem7.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem7.p1.2\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem7.p1.2.2\" class=\"ltx_text ltx_font_italic\">Geometric
        median satisfies <math id=\"S6.Thmtheorem7.p1.1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\frac{2(n-t)}{n-2t}\" display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{2(n-t)}{n-2t}</annotation></semantics></math>-<math
        id=\"S6.Thmtheorem7.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S6.9\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S6.7.p1\" class=\"ltx_para\">\n<p id=\"S6.7.p1.11\" class=\"ltx_p\">The
        proof is a modification of Lemma 24 <cite class=\"ltx_cite ltx_citemacro_cite\">Cohen<span
        class=\"ltx_text ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib50\" title=\"Geometric
        median in nearly linear time\" class=\"ltx_ref\">2016</a>)</cite> and Lemma
        C.6 <cite class=\"ltx_cite ltx_citemacro_cite\">Haghifam<span class=\"ltx_text
        ltx_bib_etal\"> et al.</span> (<a href=\"#bib.bib49\" title=\"Private geometric
        median\" class=\"ltx_ref\">2024</a>)</cite>.\nLet <math id=\"S6.7.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"P\" display=\"inline\" intent=\":literal\"><semantics><mi>P</mi><annotation
        encoding=\"application/x-tex\">P</annotation></semantics></math> be the set
        of points, consisting of honest nodes in subset <math id=\"S6.7.p1.2.m2\"
        class=\"ltx_Math\" alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math> and Byzantine
        nodes in subset <math id=\"S6.7.p1.3.m3\" class=\"ltx_Math\" alttext=\"B\"
        display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>.
        Let the true <math id=\"S6.7.p1.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        have the center <math id=\"S6.7.p1.5.m5\" class=\"ltx_Math\" alttext=\"C^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>C</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">C^{*}</annotation></semantics></math> with
        radius <math id=\"S6.7.p1.6.m6\" class=\"ltx_Math\" alttext=\"r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math>. Denote
        the geometric median by <math id=\"S6.7.p1.7.m7\" class=\"ltx_Math\" alttext=\"\\mu\"
        display=\"inline\" intent=\":literal\"><semantics><mi>\u03BC</mi><annotation
        encoding=\"application/x-tex\">\\mu</annotation></semantics></math> and the
        distance between the geometric median and the center of <math id=\"S6.7.p1.8.m8\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        by <math id=\"S6.7.p1.9.m9\" class=\"ltx_Math\" alttext=\"D=\\|\\mu-C^{*}\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>D</mi><mo>=</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">D=\\|\\mu-C^{*}\\|_{2}</annotation></semantics></math>.
        The following is true per definition of the geometric median: <math id=\"S6.7.p1.10.m10\"
        class=\"ltx_Math\" alttext=\"\\sum_{p\\in P}\\|\\mu-p\\|\\leq\\sum_{p\\in
        P}\\|C^{*}-p\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mo>\u2211</mo><mrow><mi>p</mi><mo>\u2208</mo><mi>P</mi></mrow></msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>p</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow></mrow><mo rspace=\"0.111em\">\u2264</mo><mrow><msub><mo
        rspace=\"0em\">\u2211</mo><mrow><mi>p</mi><mo>\u2208</mo><mi>P</mi></mrow></msub><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>p</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\sum_{p\\in P}\\|\\mu-p\\|\\leq\\sum_{p\\in
        P}\\|C^{*}-p\\|_{2}</annotation></semantics></math>. We can split the set
        <math id=\"S6.7.p1.11.m11\" class=\"ltx_Math\" alttext=\"P\" display=\"inline\"
        intent=\":literal\"><semantics><mi>P</mi><annotation encoding=\"application/x-tex\">P</annotation></semantics></math>
        into honest and Byzantine nodes:</p>\n<table id=\"S6.E4\" class=\"ltx_equation
        ltx_eqn_table\">\n\n<tbody><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_eqn_cell
        ltx_align_center\"><math id=\"S6.E4.m1\" class=\"ltx_Math\" alttext=\"\\sum_{h\\in
        H}\\|\\mu-h\\|_{2}+\\sum_{b\\in B}\\|\\mu-b\\|_{2}\\leq\\sum_{h\\in H}\\|C^{*}-h\\|_{2}+\\sum_{b\\in
        B}\\|C^{*}-b\\|_{2}.\" display=\"block\" intent=\":literal\"><semantics><mrow><mrow><mrow><mrow><munder><mo
        movablelimits=\"false\">\u2211</mo><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow></munder><msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>h</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo rspace=\"0.055em\">+</mo><mrow><munder><mo
        movablelimits=\"false\" rspace=\"0em\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><mo rspace=\"0.111em\">\u2264</mo><mrow><mrow><munder><mo
        movablelimits=\"false\" rspace=\"0em\">\u2211</mo><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow></munder><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>h</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo rspace=\"0.055em\">+</mo><mrow><munder><mo
        movablelimits=\"false\" rspace=\"0em\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\sum_{h\\in
        H}\\|\\mu-h\\|_{2}+\\sum_{b\\in B}\\|\\mu-b\\|_{2}\\leq\\sum_{h\\in H}\\|C^{*}-h\\|_{2}+\\sum_{b\\in
        B}\\|C^{*}-b\\|_{2}.</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n<td rowspan=\"1\" class=\"ltx_eqn_cell ltx_eqn_eqno
        ltx_align_middle ltx_align_right\"><span class=\"ltx_tag ltx_tag_equation
        ltx_align_right\">(4)</span></td>\n</tr></tbody>\n</table>\n<p id=\"S6.7.p1.13\"
        class=\"ltx_p\">For any honest <math id=\"S6.7.p1.12.m1\" class=\"ltx_Math\"
        alttext=\"h\\in H\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow><annotation
        encoding=\"application/x-tex\">h\\in H</annotation></semantics></math>: <math
        id=\"S6.7.p1.13.m2\" class=\"ltx_Math\" alttext=\"\\|\\mu-h\\|_{2}\\geq\\|\\mu-C^{*}\\|_{2}-\\|h-C^{*}\\|_{2}\\geq
        D-r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>h</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2265</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2212</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>\u2265</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\|\\mu-h\\|_{2}\\geq\\|\\mu-C^{*}\\|_{2}-\\|h-C^{*}\\|_{2}\\geq
        D-r^{*}</annotation></semantics></math>.</p>\n</div>\n<div id=\"S6.8.p2\"
        class=\"ltx_para ltx_noindent\">\n<p id=\"S6.8.p2.2\" class=\"ltx_p\">For
        all honest nodes <math id=\"S6.8.p2.1.m1\" class=\"ltx_Math\" alttext=\"h\\in
        H\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow><annotation
        encoding=\"application/x-tex\">h\\in H</annotation></semantics></math>: <math
        id=\"S6.8.p2.2.m2\" class=\"ltx_Math\" alttext=\"\\sum_{h\\in H}\\|\\mu-h\\|_{2}\\geq|H|\\cdot(D-r^{*})\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mo>\u2211</mo><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow></msub><msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>h</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>\u2265</mo><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow><annotation encoding=\"application/x-tex\">\\sum_{h\\in
        H}\\|\\mu-h\\|_{2}\\geq|H|\\cdot(D-r^{*})</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S6.9.p3\" class=\"ltx_para\">\n<p id=\"S6.9.p3.4\" class=\"ltx_p\">Now,
        for the right part of the Equation <a href=\"#S6.E4\" title=\"In Proof. \u2023
        6 Existing algorithms satisfying \U0001D450-MEB-validity \u2023 Practical
        Validity Conditions for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">4</span></a>, we bound <math id=\"S6.9.p3.1.m1\"
        class=\"ltx_Math\" alttext=\"\\sum_{h\\in H}\\|C^{*}-h\\|_{2}\\leq|H|\\cdot
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><msub><mo>\u2211</mo><mrow><mi>h</mi><mo>\u2208</mo><mi>H</mi></mrow></msub><msub><mrow><mo
        lspace=\"0em\" stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>h</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><mo>\u2264</mo><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\sum_{h\\in H}\\|C^{*}-h\\|_{2}\\leq|H|\\cdot
        r^{*}</annotation></semantics></math>, as any honest node is at most <math
        id=\"S6.9.p3.2.m2\" class=\"ltx_Math\" alttext=\"r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math> away
        from the center of the <math id=\"S6.9.p3.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.
        Then, for any <math id=\"S6.9.p3.4.m4\" class=\"ltx_Math\" alttext=\"b\\in
        B\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow><annotation
        encoding=\"application/x-tex\">b\\in B</annotation></semantics></math> the
        following triangle inequality applies:</p>\n<table id=\"A0.EGx9\" class=\"ltx_equationgroup
        ltx_eqn_align ltx_eqn_table\">\n\n<tbody id=\"S6.Ex16\"><tr class=\"ltx_equation
        ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td
        class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math id=\"S6.Ex16.m1\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\|C^{*}-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\displaystyle\\|C^{*}-b\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex16.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\|C^{*}-\\mu\\|_{2}+\\|\\mu-b\\|_{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>\u03BC</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq\\|C^{*}-\\mu\\|_{2}+\\|\\mu-b\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S6.Ex17\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex17.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\sum_{b\\in
        B}\\|C^{*}-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\sum_{b\\in
        B}\\|C^{*}-b\\|_{2}</annotation></semantics></math></td>\n<td class=\"ltx_td
        ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex17.m2\" class=\"ltx_Math\" alttext=\"\\displaystyle\\leq
        t\\cdot D+\\sum_{b\\in B}\\|\\mu-b\\|_{2}\\quad\\forall b\\in B.\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mi>t</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mi>D</mi></mrow><mo>+</mo><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><mspace
        style=\"width:1.167em;\" width=\"1.167em\"></mspace><mrow><mrow><mo rspace=\"0.167em\">\u2200</mo><mi>b</mi></mrow><mo>\u2208</mo><mi>B</mi></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\leq
        t\\cdot D+\\sum_{b\\in B}\\|\\mu-b\\|_{2}\\quad\\forall b\\in B.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S6.9.p3.9\" class=\"ltx_p\">Now, we plug this into Equation <a href=\"#S6.E4\"
        title=\"In Proof. \u2023 6 Existing algorithms satisfying \U0001D450-MEB-validity
        \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated Learning\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">4</span></a>:</p>\n<table
        id=\"A0.EGx10\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S6.Ex18\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex18.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle|H|\\cdot(D-r^{*})+\\sum_{b\\in
        B}\\|\\mu-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>D</mi><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mo>+</mo><mrow><mstyle displaystyle=\"true\"><munder><mo
        movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle|H|\\cdot(D-r^{*})+\\sum_{b\\in
        B}\\|\\mu-b\\|_{2}</annotation></semantics></math></td>\n<td class=\"ltx_td
        ltx_align_left ltx_eqn_cell\"><math id=\"S6.Ex18.m2\" class=\"ltx_Math\" alttext=\"\\displaystyle\\leq|H|\\cdot
        r^{*}+t\\cdot D+\\sum_{b\\in B}\\|\\mu-b\\|_{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo
        rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><mrow><mi>t</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mi>D</mi></mrow><mo>+</mo><mrow><mstyle
        displaystyle=\"true\"><munder><mo movablelimits=\"false\">\u2211</mo><mrow><mi>b</mi><mo>\u2208</mo><mi>B</mi></mrow></munder></mstyle><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>\u03BC</mi><mo>\u2212</mo><mi>b</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq|H|\\cdot r^{*}+t\\cdot
        D+\\sum_{b\\in B}\\|\\mu-b\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S6.Ex19\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S6.Ex19.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle
        D(|H|-t)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>D</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mo>\u2212</mo><mi>t</mi></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\displaystyle
        D(|H|-t)</annotation></semantics></math></td>\n<td class=\"ltx_td ltx_align_left
        ltx_eqn_cell\"><math id=\"S6.Ex19.m2\" class=\"ltx_Math\" alttext=\"\\displaystyle\\leq
        2\\cdot|H|\\cdot r^{*}.\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi></mi><mo>\u2264</mo><mrow><mn>2</mn><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><mrow><mo stretchy=\"false\">|</mo><mi>H</mi><mo
        rspace=\"0.055em\" stretchy=\"false\">|</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\leq
        2\\cdot|H|\\cdot r^{*}.</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p id=\"S6.9.p3.8\"
        class=\"ltx_p\">In the worst case if <math id=\"S6.9.p3.5.m1\" class=\"ltx_Math\"
        alttext=\"|H|=n-t\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mo>=</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">|H|=n-t</annotation></semantics></math>, then
        <math id=\"S6.9.p3.6.m2\" class=\"ltx_Math\" alttext=\"D\\leq\\frac{2(n-t)}{n-2t}r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>D</mi><mo>\u2264</mo><mrow><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">D\\leq\\frac{2(n-t)}{n-2t}r^{*}</annotation></semantics></math>.
        This implies that the distance between the geometric median and the center
        of the <math id=\"S6.9.p3.7.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is at most <math id=\"S6.9.p3.8.m4\" class=\"ltx_Math\" alttext=\"\\frac{2(n-t)}{n-2t}r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><mo
        stretchy=\"false\">)</mo></mrow></mrow><mrow><mi>n</mi><mo>\u2212</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow></mfrac><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\frac{2(n-t)}{n-2t}r^{*}</annotation></semantics></math>\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S6.Thmtheorem8\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem8.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 6.8</span></span><span
        id=\"S6.Thmtheorem8.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem8.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem8.p1.2\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem8.p1.2.2\" class=\"ltx_text ltx_font_italic\">Geometric
        median does not satisfy <math id=\"S6.Thmtheorem8.p1.1.1.m1\" class=\"ltx_Math\"
        alttext=\"1.08\" display=\"inline\" intent=\":literal\"><semantics><mn>1.08</mn><annotation
        encoding=\"application/x-tex\">1.08</annotation></semantics></math>-<math
        id=\"S6.Thmtheorem8.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S6.11\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S6.10.1\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S6.10.1.p1\" class=\"ltx_para\">\n<p
        id=\"S6.10.1.p1.42\" class=\"ltx_p\">Consider an example similar to the example
        from Lemma <a href=\"#S6.Thmtheorem6\" title=\"Theorem 6.6. \u2023 6 Existing
        algorithms satisfying \U0001D450-MEB-validity \u2023 Practical Validity Conditions
        for Byzantine-Tolerant Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">6.6</span></a> with <math id=\"S6.10.1.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"n=3t-3\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>=</mo><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mn>3</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">n=3t-3</annotation></semantics></math> nodes
        divided into subsets <math id=\"S6.10.1.p1.2.m2\" class=\"ltx_Math\" alttext=\"A,B,C,D,E\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>A</mi><mo>,</mo><mi>B</mi><mo>,</mo><mi>C</mi><mo>,</mo><mi>D</mi><mo>,</mo><mi>E</mi></mrow><annotation
        encoding=\"application/x-tex\">A,B,C,D,E</annotation></semantics></math> and
        <math id=\"S6.10.1.p1.3.m3\" class=\"ltx_Math\" alttext=\"F\" display=\"inline\"
        intent=\":literal\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>.
        Subsets <math id=\"S6.10.1.p1.4.m4\" class=\"ltx_Math\" alttext=\"A\" display=\"inline\"
        intent=\":literal\"><semantics><mi>A</mi><annotation encoding=\"application/x-tex\">A</annotation></semantics></math>
        and <math id=\"S6.10.1.p1.5.m5\" class=\"ltx_Math\" alttext=\"D\" display=\"inline\"
        intent=\":literal\"><semantics><mi>D</mi><annotation encoding=\"application/x-tex\">D</annotation></semantics></math>
        contain one node each and are placed in in <math id=\"S6.10.1.p1.6.m6\" class=\"ltx_Math\"
        alttext=\"(0,0)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation
        encoding=\"application/x-tex\">(0,0)</annotation></semantics></math> and <math
        id=\"S6.10.1.p1.7.m7\" class=\"ltx_Math\" alttext=\"(4,0)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mo>,</mo><mn>0</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(4,0)</annotation></semantics></math>,
        respectively. Then place subsets <math id=\"S6.10.1.p1.8.m8\" class=\"ltx_Math\"
        alttext=\"B\" display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation
        encoding=\"application/x-tex\">B</annotation></semantics></math> and <math
        id=\"S6.10.1.p1.9.m9\" class=\"ltx_Math\" alttext=\"C\" display=\"inline\"
        intent=\":literal\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math>
        of size <math id=\"S6.10.1.p1.10.m10\" class=\"ltx_Math\" alttext=\"t-2\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>\u2212</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">t-2</annotation></semantics></math> in <math
        id=\"S6.10.1.p1.11.m11\" class=\"ltx_Math\" alttext=\"(1,1)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(1,1)</annotation></semantics></math>
        and <math id=\"S6.10.1.p1.12.m12\" class=\"ltx_Math\" alttext=\"(3,1)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>3</mn><mo>,</mo><mn>1</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(3,1)</annotation></semantics></math>.
        Finally, subset <math id=\"S6.10.1.p1.13.m13\" class=\"ltx_Math\" alttext=\"E\"
        display=\"inline\" intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>
        which consists of <math id=\"S6.10.1.p1.14.m14\" class=\"ltx_Math\" alttext=\"t-2\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>\u2212</mo><mn>2</mn></mrow><annotation
        encoding=\"application/x-tex\">t-2</annotation></semantics></math> nodes is
        found in <math id=\"S6.10.1.p1.15.m15\" class=\"ltx_Math\" alttext=\"(2,0)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo>,</mo><mn>0</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2,0)</annotation></semantics></math>
        and subset <math id=\"S6.10.1.p1.16.m16\" class=\"ltx_Math\" alttext=\"F\"
        display=\"inline\" intent=\":literal\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>
        with one node in <math id=\"S6.10.1.p1.17.m17\" class=\"ltx_Math\" alttext=\"(2,x)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo>,</mo><mi>x</mi><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2,x)</annotation></semantics></math>,
        where <math id=\"S6.10.1.p1.18.m18\" class=\"ltx_Math\" alttext=\"x\" display=\"inline\"
        intent=\":literal\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>
        is an arbitrary coordinate.\nWe consider three extreme cases for the minimum
        enclosing ball defined on a subset of size <math id=\"S6.10.1.p1.19.m19\"
        class=\"ltx_Math\" alttext=\"2t-3\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>\u2212</mo><mn>3</mn></mrow><annotation
        encoding=\"application/x-tex\">2t-3</annotation></semantics></math>. One possible
        <math id=\"S6.10.1.p1.20.m20\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        contains all nodes in subsets <math id=\"S6.10.1.p1.21.m21\" class=\"ltx_Math\"
        alttext=\"A\" display=\"inline\" intent=\":literal\"><semantics><mi>A</mi><annotation
        encoding=\"application/x-tex\">A</annotation></semantics></math>, <math id=\"S6.10.1.p1.22.m22\"
        class=\"ltx_Math\" alttext=\"B\" display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation
        encoding=\"application/x-tex\">B</annotation></semantics></math>, and <math
        id=\"S6.10.1.p1.23.m23\" class=\"ltx_Math\" alttext=\"E\" display=\"inline\"
        intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>,
        with radius <math id=\"S6.10.1.p1.24.m24\" class=\"ltx_Math\" alttext=\"r=1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">r=1</annotation></semantics></math>. A second
        possible <math id=\"S6.10.1.p1.25.m25\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        contains the nodes in subsets <math id=\"S6.10.1.p1.26.m26\" class=\"ltx_Math\"
        alttext=\"E\" display=\"inline\" intent=\":literal\"><semantics><mi>E</mi><annotation
        encoding=\"application/x-tex\">E</annotation></semantics></math>, <math id=\"S6.10.1.p1.27.m27\"
        class=\"ltx_Math\" alttext=\"C\" display=\"inline\" intent=\":literal\"><semantics><mi>C</mi><annotation
        encoding=\"application/x-tex\">C</annotation></semantics></math>, and <math
        id=\"S6.10.1.p1.28.m28\" class=\"ltx_Math\" alttext=\"D\" display=\"inline\"
        intent=\":literal\"><semantics><mi>D</mi><annotation encoding=\"application/x-tex\">D</annotation></semantics></math>,
        also with radius <math id=\"S6.10.1.p1.29.m29\" class=\"ltx_Math\" alttext=\"r=1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">r=1</annotation></semantics></math>. A third
        possible MEB is formed from all nodes in subsets <math id=\"S6.10.1.p1.30.m30\"
        class=\"ltx_Math\" alttext=\"B\" display=\"inline\" intent=\":literal\"><semantics><mi>B</mi><annotation
        encoding=\"application/x-tex\">B</annotation></semantics></math>, <math id=\"S6.10.1.p1.31.m31\"
        class=\"ltx_Math\" alttext=\"C\" display=\"inline\" intent=\":literal\"><semantics><mi>C</mi><annotation
        encoding=\"application/x-tex\">C</annotation></semantics></math>, and <math
        id=\"S6.10.1.p1.32.m32\" class=\"ltx_Math\" alttext=\"F\" display=\"inline\"
        intent=\":literal\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>,
        with radius <math id=\"S6.10.1.p1.33.m33\" class=\"ltx_Math\" alttext=\"r=\\frac{x}{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mfrac><mi>x</mi><mn>2</mn></mfrac></mrow><annotation
        encoding=\"application/x-tex\">r=\\frac{x}{2}</annotation></semantics></math>.\nSince
        the construction is symmetric and points in subsets <math id=\"S6.10.1.p1.34.m34\"
        class=\"ltx_Math\" alttext=\"B,C\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>B</mi><mo>,</mo><mi>C</mi></mrow><annotation
        encoding=\"application/x-tex\">B,C</annotation></semantics></math> and <math
        id=\"S6.10.1.p1.35.m35\" class=\"ltx_Math\" alttext=\"E\" display=\"inline\"
        intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>
        dominate over the subsets containing one point, the geometric median is the
        Fermat\u2019s point of the triangle defined by the nodes in subsets <math
        id=\"S6.10.1.p1.36.m36\" class=\"ltx_Math\" alttext=\"B,C\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>B</mi><mo>,</mo><mi>C</mi></mrow><annotation
        encoding=\"application/x-tex\">B,C</annotation></semantics></math> and <math
        id=\"S6.10.1.p1.37.m37\" class=\"ltx_Math\" alttext=\"E\" display=\"inline\"
        intent=\":literal\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>,
        found in <math id=\"S6.10.1.p1.38.m38\" class=\"ltx_Math\" alttext=\"(2,1-\\frac{1}{\\sqrt{3}})\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo>,</mo><mrow><mn>1</mn><mo>\u2212</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2,1-\\frac{1}{\\sqrt{3}})</annotation></semantics></math>.
        Note that the geometric median is not contained in any of the three extreme
        <math id=\"S6.10.1.p1.39.m39\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.
        The distance between the center of the two <math id=\"S6.10.1.p1.40.m40\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        with <math id=\"S6.10.1.p1.41.m41\" class=\"ltx_Math\" alttext=\"r=1\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">r=1</annotation></semantics></math> and the
        geometric median is <math id=\"S6.10.1.p1.42.m42\" class=\"ltx_Math\" alttext=\"\\sqrt{\\frac{7}{3}-\\frac{2}{\\sqrt{3}}}\\approx
        1.0857\" display=\"inline\" intent=\":literal\"><semantics><mrow><msqrt><mrow><mfrac><mn>7</mn><mn>3</mn></mfrac><mo>\u2212</mo><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></msqrt><mo>\u2248</mo><mn>1.0857</mn></mrow><annotation
        encoding=\"application/x-tex\">\\sqrt{\\frac{7}{3}-\\frac{2}{\\sqrt{3}}}\\approx
        1.0857</annotation></semantics></math>.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S6.11.p1\" class=\"ltx_para\">\n<p id=\"S6.11.p1.1\" class=\"ltx_p\">\u220E</p>\n</div>\n</div>\n<div
        id=\"S6.Thmtheorem9\" class=\"ltx_theorem ltx_theorem_theorem\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S6.Thmtheorem9.1.1.1\" class=\"ltx_text ltx_font_bold\">Theorem 6.9</span></span><span
        id=\"S6.Thmtheorem9.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S6.Thmtheorem9.p1\" class=\"ltx_para\">\n<p id=\"S6.Thmtheorem9.p1.1\"
        class=\"ltx_p\"><span id=\"S6.Thmtheorem9.p1.1.1\" class=\"ltx_text ltx_font_italic\">Geometric
        median does not satisfy convex validity.</span></p>\n</div>\n</div>\n<div
        id=\"S6.13\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S6.12.1\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S6.12.1.p1\" class=\"ltx_para\">\n<p id=\"S6.12.1.p1.8\" class=\"ltx_p\">Consider
        the following example with <math id=\"S6.12.1.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"n=3t+1\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>=</mo><mrow><mrow><mn>3</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow><mo>+</mo><mn>1</mn></mrow></mrow><annotation
        encoding=\"application/x-tex\">n=3t+1</annotation></semantics></math> input
        points. Place <math id=\"S6.12.1.p1.2.m2\" class=\"ltx_Math\" alttext=\"t+1\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow><annotation
        encoding=\"application/x-tex\">t+1</annotation></semantics></math> points
        into the origin <math id=\"S6.12.1.p1.3.m3\" class=\"ltx_Math\" alttext=\"(0,0)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0,0)</annotation></semantics></math>,
        then place <math id=\"S6.12.1.p1.4.m4\" class=\"ltx_Math\" alttext=\"t\" display=\"inline\"
        intent=\":literal\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math>
        points in <math id=\"S6.12.1.p1.5.m5\" class=\"ltx_Math\" alttext=\"(1,0)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(1,0)</annotation></semantics></math>
        and the other <math id=\"S6.12.1.p1.6.m6\" class=\"ltx_Math\" alttext=\"t\"
        display=\"inline\" intent=\":literal\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math>
        points in <math id=\"S6.12.1.p1.7.m7\" class=\"ltx_Math\" alttext=\"(0,1)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0,1)</annotation></semantics></math>.
        The geometric median of these input points converges to the Fermat\u2019s
        point of the triangle, when <math id=\"S6.12.1.p1.8.m8\" class=\"ltx_Math\"
        alttext=\"t\" display=\"inline\" intent=\":literal\"><semantics><mi>t</mi><annotation
        encoding=\"application/x-tex\">t</annotation></semantics></math> is large.
        However, the convex hull containing honest nodes could be defined on the line
        between the origin and one of the sides. Hence, the geometric median is not
        contained in the convex hull of the honest nodes.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S6.13.p1\" class=\"ltx_para\">\n<p id=\"S6.13.p1.1\" class=\"ltx_p\">\u220E</p>\n</div>\n</div>\n</section>\n<section
        id=\"S7\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\">\n<span
        class=\"ltx_tag ltx_tag_section\">7 </span>Relations between validity conditions</h2>\n\n<div
        id=\"S7.p1\" class=\"ltx_para\">\n<p id=\"S7.p1.10\" class=\"ltx_p\">To put
        <math id=\"S7.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity into perspective with other validity conditions, we make comparisons
        between <math id=\"S7.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity and existing validity conditions in vector aggregation. We consider
        convex validity, <math id=\"S7.p1.3.m3\" class=\"ltx_Math\" alttext=\"(\\delta,p)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mi>p</mi><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\delta,p)</annotation></semantics></math>-relaxed
        convex validity and box validity. Since these conditions define different
        valid regions, it is natural to ask how they relate to one another. In particular,
        we focus on whether one validity condition implies another, and how they compare
        quantitatively. We first define considered validity conditions.\n\n<br class=\"ltx_break\"><span
        class=\"ltx_rule\" style=\"width:0.0pt;height:12.0pt;--ltx-bg-color:black;display:inline-block;\"></span><span
        id=\"S7.p1.10.1\" class=\"ltx_text ltx_font_bold\">Convex Validity:</span>
        The agreement vector has to be inside the convex hull of <math id=\"S7.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"C\" display=\"inline\" intent=\":literal\"><semantics><mi>C</mi><annotation
        encoding=\"application/x-tex\">C</annotation></semantics></math>, denoted
        by <math id=\"S7.p1.5.m5\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}(C)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>Conv</mi><mo lspace=\"0em\"
        rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>C</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathrm{Conv}(C)</annotation></semantics></math>.\n\n<br
        class=\"ltx_break\"><span class=\"ltx_rule\" style=\"width:0.0pt;height:12.0pt;--ltx-bg-color:black;display:inline-block;\"></span>It
        has been shown that, to agree on a vector inside the convex hull of <math
        id=\"S7.p1.6.m6\" class=\"ltx_Math\" alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math> under Byzantine
        failures, one has to agree inside a so-called <em id=\"S7.p1.10.2\" class=\"ltx_emph
        ltx_font_italic\">safe area</em>. This is the intersection of all convex hulls
        computed on subsets of <math id=\"S7.p1.7.m7\" class=\"ltx_Math\" alttext=\"n-t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math> vectors
        from all <math id=\"S7.p1.8.m8\" class=\"ltx_Math\" alttext=\"n\" display=\"inline\"
        intent=\":literal\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>
        received vectors. This condition is also the reason why convex validity has
        a poor resilience of <math id=\"S7.p1.9.m9\" class=\"ltx_Math\" alttext=\"n&gt;(d+1)t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;(d+1)t</annotation></semantics></math>.
        For <math id=\"S7.p1.10.m10\" class=\"ltx_Math\" alttext=\"n\\leq(d+1)t\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2264</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>d</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n\\leq(d+1)t</annotation></semantics></math>,
        there is no guarantee that the convex hulls have a common intersection.</p>\n</div>\n<div
        id=\"S7.p2\" class=\"ltx_para\">\n<p id=\"S7.p2.7\" class=\"ltx_p\">The second
        validity condition that we consider in this paper is the box validity:\n\n<br
        class=\"ltx_break\"><span class=\"ltx_rule\" style=\"width:0.0pt;height:12.0pt;--ltx-bg-color:black;display:inline-block;\"></span><span
        id=\"S7.p2.7.1\" class=\"ltx_text ltx_font_bold\">Box Validity:</span> The
        agreement vector has to be inside the smallest coordinate-parallel hyperrectangle
        containing <math id=\"S7.p2.1.m1\" class=\"ltx_Math\" alttext=\"H\" display=\"inline\"
        intent=\":literal\"><semantics><mi>H</mi><annotation encoding=\"application/x-tex\">H</annotation></semantics></math>,
        named trusted box <math id=\"S7.p2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{TB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>TB</mi><annotation encoding=\"application/x-tex\">\\mathrm{TB}</annotation></semantics></math>.\n\n<br
        class=\"ltx_break\"><span class=\"ltx_rule\" style=\"width:0.0pt;height:12.0pt;--ltx-bg-color:black;display:inline-block;\"></span>Box
        validity can be viewed as convex validity applied separately in each dimension.
        Observe that both the box and the convex validity conditions restrict the
        agreement vector to only take values in dimensions that are spanned by the
        convex hull or the hyperrectangle.\n\n<br class=\"ltx_break\"><span class=\"ltx_rule\"
        style=\"width:0.0pt;height:12.0pt;--ltx-bg-color:black;display:inline-block;\"></span><math
        id=\"S7.p2.3.m3\" class=\"ltx_Math\" alttext=\"\\bm{(\\delta,p)}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo class=\"ltx_mathvariant_bold\" mathvariant=\"bold\"
        stretchy=\"false\">(</mo><mi>\U0001D739</mi><mo class=\"ltx_mathvariant_bold\"
        mathvariant=\"bold\">,</mo><mi>\U0001D491</mi><mo class=\"ltx_mathvariant_bold\"
        mathvariant=\"bold\" stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\bm{(\\delta,p)}</annotation></semantics></math><span
        id=\"S7.p2.7.2\" class=\"ltx_text ltx_font_bold\">-relaxed convex validity:</span>
        The agreement vector has to be inside the set <math id=\"S7.p2.4.m4\" class=\"ltx_Math\"
        alttext=\"\\{u\\big|\\|u-v\\|_{p}\\leq\\delta\\ \\ \\forall\\ v\\in\\mathrm{Conv}(H)\\}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">{</mo><mi>u</mi><mo
        lspace=\"0em\" mathsize=\"1.200em\" rspace=\"0em\">|</mo><mrow><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>u</mi><mo>\u2212</mo><mi>v</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mi>p</mi></msub><mo>\u2264</mo><mi>\u03B4</mi></mrow><mspace
        style=\"width:1.167em;\" width=\"1.167em\"></mspace><mrow><mrow><mo rspace=\"0.667em\">\u2200</mo><mi>v</mi></mrow><mo>\u2208</mo><mrow><mi>Conv</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo stretchy=\"false\">(</mo><mi>H</mi><mo
        stretchy=\"false\">)</mo></mrow></mrow></mrow></mrow><mo stretchy=\"false\">}</mo></mrow><annotation
        encoding=\"application/x-tex\">\\{u\\big|\\|u-v\\|_{p}\\leq\\delta\\ \\ \\forall\\
        v\\in\\mathrm{Conv}(H)\\}</annotation></semantics></math>.\n\n<br class=\"ltx_break\"><span
        class=\"ltx_rule\" style=\"width:0.0pt;height:12.0pt;--ltx-bg-color:black;display:inline-block;\"></span>Where
        <math id=\"S7.p2.5.m5\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}(H)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>Conv</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>H</mi><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\mathrm{Conv}(H)</annotation></semantics></math>
        denotes the convex hull of the set <math id=\"S7.p2.6.m6\" class=\"ltx_Math\"
        alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math>, and <math
        id=\"S7.p2.7.m7\" class=\"ltx_Math\" alttext=\"0&lt;p\\leq\\infty\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>p</mi><mo>\u2264</mo><mi
        mathvariant=\"normal\">\u221E</mi></mrow><annotation encoding=\"application/x-tex\">0&lt;p\\leq\\infty</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S7.p3\" class=\"ltx_para\">\n<p id=\"S7.p3.1\" class=\"ltx_p\">We start
        with convex validity and show that convex validity implies <math id=\"S7.p3.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</p>\n</div>\n<div id=\"S7.Thmtheorem1\" class=\"ltx_theorem ltx_theorem_lemma\">\n<h6
        class=\"ltx_title ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S7.Thmtheorem1.1.1.1\" class=\"ltx_text ltx_font_bold\">Lemma 7.1</span></span><span
        id=\"S7.Thmtheorem1.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S7.Thmtheorem1.p1\" class=\"ltx_para\">\n<p id=\"S7.Thmtheorem1.p1.1\"
        class=\"ltx_p\"><span id=\"S7.Thmtheorem1.p1.1.1\" class=\"ltx_text ltx_font_italic\">Convex
        validity implies <math id=\"S7.Thmtheorem1.p1.1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S7.1\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S7.1.p1\" class=\"ltx_para\">\n<p id=\"S7.1.p1.4\" class=\"ltx_p\">The
        convex hull <math id=\"S7.1.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>Conv</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{Conv}</annotation></semantics></math>
        and minimum enclosing ball <math id=\"S7.1.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        are defined on the same set of honest nodes <math id=\"S7.1.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math>. Hence, <math
        id=\"S7.1.p1.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}\\subseteq\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>Conv</mi><mo>\u2286</mo><mi>MEB</mi></mrow><annotation
        encoding=\"application/x-tex\">\\mathrm{Conv}\\subseteq\\mathrm{MEB}</annotation></semantics></math>.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S7.p4\" class=\"ltx_para\">\n<p id=\"S7.p4.1\" class=\"ltx_p\">Next,
        we show that the reversed direction does not hold, i.e. <math id=\"S7.p4.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        does not necessarily satisfy convex validity.</p>\n</div>\n<div id=\"S7.Thmtheorem2\"
        class=\"ltx_theorem ltx_theorem_lemma\">\n<h6 class=\"ltx_title ltx_runin
        ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span id=\"S7.Thmtheorem2.1.1.1\"
        class=\"ltx_text ltx_font_bold\">Lemma 7.2</span></span><span id=\"S7.Thmtheorem2.2.2\"
        class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div id=\"S7.Thmtheorem2.p1\"
        class=\"ltx_para\">\n<p id=\"S7.Thmtheorem2.p1.1\" class=\"ltx_p\"><math id=\"S7.Thmtheorem2.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math><span
        id=\"S7.Thmtheorem2.p1.1.1\" class=\"ltx_text ltx_font_italic\"> validity
        does not imply convex validity.</span></p>\n</div>\n</div>\n<div id=\"S7.2\"
        class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S7.2.p1\" class=\"ltx_para\">\n<p id=\"S7.2.p1.9\" class=\"ltx_p\">Consider
        the following configuration: place <math id=\"S7.2.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\frac{|H|}{2}\" display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mn>2</mn></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{|H|}{2}</annotation></semantics></math>
        of the honest nodes in (0,0) and the remaining <math id=\"S7.2.p1.2.m2\" class=\"ltx_Math\"
        alttext=\"\\frac{|H|}{2}\" display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mn>2</mn></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{|H|}{2}</annotation></semantics></math>
        in (0,1). The convex hull <math id=\"S7.2.p1.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>Conv</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{Conv}</annotation></semantics></math>
        is the line segment connecting the two points. In contrast, <math id=\"S7.2.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is a <math id=\"S7.2.p1.5.m5\" class=\"ltx_Math\" alttext=\"2d\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mn>2</mn><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>d</mi></mrow><annotation
        encoding=\"application/x-tex\">2d</annotation></semantics></math> ball centered
        in the midpoint of the line segment, with radius <math id=\"S7.2.p1.6.m6\"
        class=\"ltx_Math\" alttext=\"r^{*}=\\frac{1}{2}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msup><mi>r</mi><mo>\u2217</mo></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow><annotation
        encoding=\"application/x-tex\">r^{*}=\\frac{1}{2}</annotation></semantics></math>.
        The <math id=\"S7.2.p1.7.m7\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>Conv</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{Conv}</annotation></semantics></math>
        is collapsed to the line segment in one dimension. Hence, <math id=\"S7.2.p1.8.m8\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\\nsubseteq\\mathrm{Conv}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>MEB</mi><mo>\u2288</mo><mi>Conv</mi></mrow><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}\\nsubseteq\\mathrm{Conv}</annotation></semantics></math>,
        and thus <math id=\"S7.2.p1.9.m9\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity does not imply convex validity.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S7.p5\" class=\"ltx_para\">\n<p id=\"S7.p5.2\" class=\"ltx_p\">We now
        turn our focus to the <math id=\"S7.p5.1.m1\" class=\"ltx_Math\" alttext=\"(\\delta,p)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mi>p</mi><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\delta,p)</annotation></semantics></math>-relaxed
        convex validity condition, since it requires that the output of the algorithm
        is at distance at most <math id=\"S7.p5.2.m2\" class=\"ltx_Math\" alttext=\"\\delta\"
        display=\"inline\" intent=\":literal\"><semantics><mi>\u03B4</mi><annotation
        encoding=\"application/x-tex\">\\delta</annotation></semantics></math> from
        the convex hull. This relaxation increases the valid output area in all dimensions,
        unlike the convex hull which might be only a line segment.</p>\n</div>\n<div
        id=\"S7.Thmtheorem3\" class=\"ltx_theorem ltx_theorem_lemma\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S7.Thmtheorem3.1.1.1\" class=\"ltx_text ltx_font_bold\">Lemma 7.3</span></span><span
        id=\"S7.Thmtheorem3.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S7.Thmtheorem3.p1\" class=\"ltx_para\">\n<p id=\"S7.Thmtheorem3.p1.5\"
        class=\"ltx_p\"><math id=\"S7.Thmtheorem3.p1.1.m1\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math><span
        id=\"S7.Thmtheorem3.p1.5.4\" class=\"ltx_text ltx_font_italic\">-relaxed <math
        id=\"S7.Thmtheorem3.p1.2.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity implies <math id=\"S7.Thmtheorem3.p1.3.2.m2\" class=\"ltx_Math\"
        alttext=\"((c+1)\\cdot r^{*},2)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo
        stretchy=\"false\">(</mo><mrow><mrow><mo stretchy=\"false\">(</mo><mrow><mi>c</mi><mo>+</mo><mn>1</mn></mrow><mo
        rspace=\"0.055em\" stretchy=\"false\">)</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>,</mo><mn>2</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">((c+1)\\cdot
        r^{*},2)</annotation></semantics></math>-relaxed convex validity , where <math
        id=\"S7.Thmtheorem3.p1.4.3.m3\" class=\"ltx_Math\" alttext=\"r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math> denotes
        the radius of the minimum enclosing ball <math id=\"S7.Thmtheorem3.p1.5.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S7.3\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S7.3.p1\" class=\"ltx_para\">\n<p
        id=\"S7.3.p1.9\" class=\"ltx_p\">Let <math id=\"S7.3.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"y\" display=\"inline\" intent=\":literal\"><semantics><mi>y</mi><annotation
        encoding=\"application/x-tex\">y</annotation></semantics></math> be an output
        point inside the <math id=\"S7.3.p1.2.m2\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>-<math
        id=\"S7.3.p1.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        which has center <math id=\"S7.3.p1.4.m4\" class=\"ltx_Math\" alttext=\"C^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><msup><mi>C</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">C^{*}</annotation></semantics></math> and radius
        <math id=\"S7.3.p1.5.m5\" class=\"ltx_Math\" alttext=\"r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><msup><mi>r</mi><mo>\u2217</mo></msup><annotation
        encoding=\"application/x-tex\">r^{*}</annotation></semantics></math>. The
        distance between <math id=\"S7.3.p1.6.m6\" class=\"ltx_Math\" alttext=\"y\"
        display=\"inline\" intent=\":literal\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math>
        and the convex hull of honest nodes <math id=\"S7.3.p1.7.m7\" class=\"ltx_Math\"
        alttext=\"\\mathrm{Conv}\" display=\"inline\" intent=\":literal\"><semantics><mi>Conv</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{Conv}</annotation></semantics></math>
        is bounded by <math id=\"S7.3.p1.8.m8\" class=\"ltx_Math\" alttext=\"dist(y,\\mathrm{Conv})\\leq\\|y-x\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>s</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>y</mi><mo>,</mo><mi>Conv</mi><mo stretchy=\"false\">)</mo></mrow></mrow><mo>\u2264</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><mi>x</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">dist(y,\\mathrm{Conv})\\leq\\|y-x\\|_{2}</annotation></semantics></math>
        for each <math id=\"S7.3.p1.9.m9\" class=\"ltx_Math\" alttext=\"x\\in\\mathrm{Conv}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>x</mi><mo>\u2208</mo><mi>Conv</mi></mrow><annotation
        encoding=\"application/x-tex\">x\\in\\mathrm{Conv}</annotation></semantics></math>.
        Using triangle inequality, we can derive the following:</p>\n<table id=\"A0.EGx11\"
        class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody id=\"S7.Ex20\"><tr
        class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right ltx_eqn_cell\"><math
        id=\"S7.Ex20.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\|y-x\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><mi>x</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\displaystyle\\|y-x\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S7.Ex20.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\|y-C^{*}\\|_{2}+\\|C^{*}-x\\|_{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>x</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq\\|y-C^{*}\\|_{2}+\\|C^{*}-x\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S7.Ex21\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_eqn_cell\"></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S7.Ex21.m1\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq c\\cdot r^{*}+r^{*}\\leq(c+1)r^{*}.\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mi></mi><mo>\u2264</mo><mrow><mrow><mi>c</mi><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>+</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>\u2264</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>c</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy=\"false\">)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\leq
        c\\cdot r^{*}+r^{*}\\leq(c+1)r^{*}.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S7.3.p1.12\" class=\"ltx_p\">Hence, <math id=\"S7.3.p1.10.m1\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S7.3.p1.11.m2\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        satisfies <math id=\"S7.3.p1.12.m3\" class=\"ltx_Math\" alttext=\"((c+1)\\cdot
        r^{*},2)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mrow><mrow><mo
        stretchy=\"false\">(</mo><mrow><mi>c</mi><mo>+</mo><mn>1</mn></mrow><mo rspace=\"0.055em\"
        stretchy=\"false\">)</mo></mrow><mo rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>,</mo><mn>2</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">((c+1)\\cdot
        r^{*},2)</annotation></semantics></math>-relaxed convex validity.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S7.Thmtheorem4\" class=\"ltx_theorem ltx_theorem_lemma\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S7.Thmtheorem4.1.1.1\" class=\"ltx_text ltx_font_bold\">Lemma 7.4</span></span><span
        id=\"S7.Thmtheorem4.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S7.Thmtheorem4.p1\" class=\"ltx_para\">\n<p id=\"S7.Thmtheorem4.p1.5\"
        class=\"ltx_p\"><math id=\"S7.Thmtheorem4.p1.1.m1\" class=\"ltx_Math\" alttext=\"(\\delta,2)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mn>2</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\delta,2)</annotation></semantics></math><span
        id=\"S7.Thmtheorem4.p1.5.4\" class=\"ltx_text ltx_font_italic\">-relaxed convex
        validity implies <math id=\"S7.Thmtheorem4.p1.2.1.m1\" class=\"ltx_Math\"
        alttext=\"\\left(1+\\frac{2\\delta}{diam(H)}\\right)\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>\u03B4</mi></mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>a</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>m</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>H</mi><mo stretchy=\"false\">)</mo></mrow></mrow></mfrac></mrow><mo>)</mo></mrow><annotation
        encoding=\"application/x-tex\">\\left(1+\\frac{2\\delta}{diam(H)}\\right)</annotation></semantics></math>-relaxed
        <math id=\"S7.Thmtheorem4.p1.3.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity in general, where <math id=\"S7.Thmtheorem4.p1.4.3.m3\" class=\"ltx_Math\"
        alttext=\"diam(H)\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>a</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>m</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>H</mi><mo stretchy=\"false\">)</mo></mrow></mrow><annotation
        encoding=\"application/x-tex\">diam(H)</annotation></semantics></math> denotes
        the largest smallest distance between any pair of points in <math id=\"S7.Thmtheorem4.p1.5.4.m4\"
        class=\"ltx_Math\" alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math>.</span></p>\n</div>\n</div>\n<div
        id=\"S7.4\" class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic
        ltx_title_proof\">Proof.</h6>\n<div id=\"S7.4.p1\" class=\"ltx_para\">\n<p
        id=\"S7.4.p1.8\" class=\"ltx_p\">Let <math id=\"S7.4.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"y\" display=\"inline\" intent=\":literal\"><semantics><mi>y</mi><annotation
        encoding=\"application/x-tex\">y</annotation></semantics></math> be a node
        inside the <math id=\"S7.4.p1.2.m2\" class=\"ltx_Math\" alttext=\"(\\delta,2)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mn>2</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\delta,2)</annotation></semantics></math>-relaxed
        convex hull of the honest nodes. Then, there exists a point <math id=\"S7.4.p1.3.m3\"
        class=\"ltx_Math\" alttext=\"x\\in\\mathrm{Conv}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>x</mi><mo>\u2208</mo><mi>Conv</mi></mrow><annotation
        encoding=\"application/x-tex\">x\\in\\mathrm{Conv}</annotation></semantics></math>
        such that <math id=\"S7.4.p1.4.m4\" class=\"ltx_Math\" alttext=\"\\|y-x\\|_{2}\\leq\\delta\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><mi>x</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><mi>\u03B4</mi></mrow><annotation
        encoding=\"application/x-tex\">\\|y-x\\|_{2}\\leq\\delta</annotation></semantics></math>.
        Further, <math id=\"S7.4.p1.5.m5\" class=\"ltx_Math\" alttext=\"\\|x-C^{*}\\|_{2}\\leq
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>x</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\|x-C^{*}\\|_{2}\\leq r^{*}</annotation></semantics></math>,
        as <math id=\"S7.4.p1.6.m6\" class=\"ltx_Math\" alttext=\"x\\in\\mathrm{Conv}\\subseteq\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>x</mi><mo>\u2208</mo><mi>Conv</mi><mo>\u2286</mo><mi>MEB</mi></mrow><annotation
        encoding=\"application/x-tex\">x\\in\\mathrm{Conv}\\subseteq\\mathrm{MEB}</annotation></semantics></math>.
        Now, we can bound the distance between <math id=\"S7.4.p1.7.m7\" class=\"ltx_Math\"
        alttext=\"y\" display=\"inline\" intent=\":literal\"><semantics><mi>y</mi><annotation
        encoding=\"application/x-tex\">y</annotation></semantics></math> and the center
        of the <math id=\"S7.4.p1.8.m8\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>:</p>\n<table
        id=\"A0.EGx12\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S7.Ex22\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S7.Ex22.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\|y-C^{*}\\|_{2}\"
        display=\"inline\" intent=\":literal\"><semantics><msub><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\displaystyle\\|y-C^{*}\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S7.Ex22.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\|C^{*}-x\\|_{2}+\\|y-x\\|_{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi></mi><mo>\u2264</mo><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><msup><mi>C</mi><mo>\u2217</mo></msup><mo>\u2212</mo><mi>x</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>+</mo><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><mi>x</mi></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle\\leq\\|C^{*}-x\\|_{2}+\\|y-x\\|_{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n<tbody
        id=\"S7.Ex23\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_eqn_cell\"></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S7.Ex23.m1\" class=\"ltx_Math\"
        alttext=\"\\displaystyle\\leq\\delta+r^{*}.\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi></mi><mo>\u2264</mo><mrow><mi>\u03B4</mi><mo>+</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><mo
        lspace=\"0em\">.</mo></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\leq\\delta+r^{*}.</annotation></semantics></math></td>\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p
        id=\"S7.4.p1.15\" class=\"ltx_p\">Now, <math id=\"S7.4.p1.9.m1\" class=\"ltx_Math\"
        alttext=\"\\delta+r^{*}=\\left(1+\\frac{\\delta}{r^{*}}\\right)r^{*}\\leq\\left(1+\\frac{\\delta}{\\frac{diam(H)}{2}}\\right)r^{*}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>\u03B4</mi><mo>+</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>=</mo><mrow><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mfrac><mi>\u03B4</mi><msup><mi>r</mi><mo>\u2217</mo></msup></mfrac></mrow><mo>)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>\u2264</mo><mrow><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mfrac><mi>\u03B4</mi><mfrac><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>a</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>m</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>H</mi><mo stretchy=\"false\">)</mo></mrow></mrow><mn>2</mn></mfrac></mfrac></mrow><mo>)</mo></mrow><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow></mrow><annotation
        encoding=\"application/x-tex\">\\delta+r^{*}=\\left(1+\\frac{\\delta}{r^{*}}\\right)r^{*}\\leq\\left(1+\\frac{\\delta}{\\frac{diam(H)}{2}}\\right)r^{*}</annotation></semantics></math>.
        Hence, <math id=\"S7.4.p1.10.m2\" class=\"ltx_Math\" alttext=\"(\\delta,2)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>\u03B4</mi><mo>,</mo><mn>2</mn><mo
        stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\delta,2)</annotation></semantics></math>-relaxed
        convex validity satisfies <math id=\"S7.4.p1.11.m3\" class=\"ltx_Math\" alttext=\"\\left(1+\\frac{2\\delta}{diam(H)}\\right)\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo>(</mo><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>\u03B4</mi></mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>a</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>m</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>H</mi><mo stretchy=\"false\">)</mo></mrow></mrow></mfrac></mrow><mo>)</mo></mrow><annotation
        encoding=\"application/x-tex\">\\left(1+\\frac{2\\delta}{diam(H)}\\right)</annotation></semantics></math>-relaxed
        <math id=\"S7.4.p1.12.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.\nNote that if all honest nodes are in one point, then <math id=\"S7.4.p1.13.m5\"
        class=\"ltx_Math\" alttext=\"diam(H)=0\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>i</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>a</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>m</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mrow><mo
        stretchy=\"false\">(</mo><mi>H</mi><mo stretchy=\"false\">)</mo></mrow></mrow><mo>=</mo><mn>0</mn></mrow><annotation
        encoding=\"application/x-tex\">diam(H)=0</annotation></semantics></math> and
        <math id=\"S7.4.p1.14.m6\" class=\"ltx_Math\" alttext=\"\\mathrm{Conv}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>Conv</mi><annotation encoding=\"application/x-tex\">\\mathrm{Conv}</annotation></semantics></math>
        and the <math id=\"S7.4.p1.15.m7\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        lie in the same point.\n\u220E</p>\n</div>\n</div>\n<div id=\"S7.p6\" class=\"ltx_para\">\n<p
        id=\"S7.p6.4\" class=\"ltx_p\">Finally, we examine box validity and its relation
        to the <math id=\"S7.p6.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. We show that the output of the algorithm satisfying box validity
        can be at most <math id=\"S7.p6.2.m2\" class=\"ltx_Math\" alttext=\"\\sqrt{d}\\cdot
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msqrt><mi>d</mi></msqrt><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\sqrt{d}\\cdot r^{*}</annotation></semantics></math>
        distance from the <math id=\"S7.p6.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.
        We also show that satisfying <math id=\"S7.p6.4.m4\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        does not provide any guarantees on box validity.</p>\n</div>\n<div id=\"S7.Thmtheorem5\"
        class=\"ltx_theorem ltx_theorem_lemma\">\n<h6 class=\"ltx_title ltx_runin
        ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span id=\"S7.Thmtheorem5.1.1.1\"
        class=\"ltx_text ltx_font_bold\">Lemma 7.5</span></span><span id=\"S7.Thmtheorem5.2.2\"
        class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div id=\"S7.Thmtheorem5.p1\"
        class=\"ltx_para\">\n<p id=\"S7.Thmtheorem5.p1.2\" class=\"ltx_p\"><span id=\"S7.Thmtheorem5.p1.2.2\"
        class=\"ltx_text ltx_font_italic\">Box validity implies <math id=\"S7.Thmtheorem5.p1.1.1.m1\"
        class=\"ltx_Math\" alttext=\"\\sqrt{d}\" display=\"inline\" intent=\":literal\"><semantics><msqrt><mi>d</mi></msqrt><annotation
        encoding=\"application/x-tex\">\\sqrt{d}</annotation></semantics></math>-<math
        id=\"S7.Thmtheorem5.p1.2.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity.</span></p>\n</div>\n</div>\n<div id=\"S7.5\" class=\"ltx_proof\">\n<h6
        class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S7.5.p1\" class=\"ltx_para\">\n<p id=\"S7.5.p1.12\" class=\"ltx_p\">The
        <math id=\"S7.5.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{TB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>TB</mi><annotation encoding=\"application/x-tex\">\\mathrm{TB}</annotation></semantics></math>
        and <math id=\"S7.5.p1.2.m2\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        are defined on the same set of honest nodes <math id=\"S7.5.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"H\" display=\"inline\" intent=\":literal\"><semantics><mi>H</mi><annotation
        encoding=\"application/x-tex\">H</annotation></semantics></math>. This implies
        that for each honest node <math id=\"S7.5.p1.4.m4\" class=\"ltx_Math\" alttext=\"h\"
        display=\"inline\" intent=\":literal\"><semantics><mi>h</mi><annotation encoding=\"application/x-tex\">h</annotation></semantics></math>:
        <math id=\"S7.5.p1.5.m5\" class=\"ltx_Math\" alttext=\"\\|h-C^{*}\\|_{2}\\leq
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mrow><mo
        stretchy=\"false\">\u2016</mo><mrow><mi>h</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn></msub><mo>\u2264</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\|h-C^{*}\\|_{2}\\leq r^{*}</annotation></semantics></math>.
        For each coordinate <math id=\"S7.5.p1.6.m6\" class=\"ltx_Math\" alttext=\"i\"
        display=\"inline\" intent=\":literal\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>:
        <math id=\"S7.5.p1.7.m7\" class=\"ltx_Math\" alttext=\"|h_{i}-C_{i}^{*}|\\leq
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mo
        stretchy=\"false\">|</mo><mrow><msub><mi>h</mi><mi>i</mi></msub><mo>\u2212</mo><msubsup><mi>C</mi><mi>i</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">|</mo></mrow><mo>\u2264</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">|h_{i}-C_{i}^{*}|\\leq r^{*}</annotation></semantics></math>.
        Since the <math id=\"S7.5.p1.8.m8\" class=\"ltx_Math\" alttext=\"\\mathrm{TB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>TB</mi><annotation encoding=\"application/x-tex\">\\mathrm{TB}</annotation></semantics></math>
        is defined with the smallest and largest value in each dimension, its interval
        is <math id=\"S7.5.p1.9.m9\" class=\"ltx_Math\" alttext=\"[C^{*}_{i}-r^{*},C^{*}_{i}+r^{*}]\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mo stretchy=\"false\">[</mo><mrow><msubsup><mi>C</mi><mi>i</mi><mo>\u2217</mo></msubsup><mo>\u2212</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo>,</mo><mrow><msubsup><mi>C</mi><mi>i</mi><mo>\u2217</mo></msubsup><mo>+</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">[C^{*}_{i}-r^{*},C^{*}_{i}+r^{*}]</annotation></semantics></math>.
        Now, for each point <math id=\"S7.5.p1.10.m10\" class=\"ltx_Math\" alttext=\"y\\in
        TB\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>y</mi><mo>\u2208</mo><mrow><mi>T</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>B</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">y\\in TB</annotation></semantics></math> the
        distance to the center of the ball is bounded by <math id=\"S7.5.p1.11.m11\"
        class=\"ltx_Math\" alttext=\"|y_{i}-C^{*}_{i}|\\leq r^{*}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mrow><mo stretchy=\"false\">|</mo><mrow><msub><mi>y</mi><mi>i</mi></msub><mo>\u2212</mo><msubsup><mi>C</mi><mi>i</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">|</mo></mrow><mo>\u2264</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">|y_{i}-C^{*}_{i}|\\leq r^{*}</annotation></semantics></math>
        for each coordinate <math id=\"S7.5.p1.12.m12\" class=\"ltx_Math\" alttext=\"i\"
        display=\"inline\" intent=\":literal\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>.
        Finally, using the Euclidean distance, we can derive the following:</p>\n<table
        id=\"A0.EGx13\" class=\"ltx_equationgroup ltx_eqn_align ltx_eqn_table\">\n\n<tbody
        id=\"S7.Ex24\"><tr class=\"ltx_equation ltx_eqn_row ltx_align_baseline\">\n<td
        class=\"ltx_eqn_cell ltx_eqn_center_padleft\"></td>\n<td class=\"ltx_td ltx_align_right
        ltx_eqn_cell\"><math id=\"S7.Ex24.m1\" class=\"ltx_Math\" alttext=\"\\displaystyle\\|y-C^{*}\\|_{2}^{2}\"
        display=\"inline\" intent=\":literal\"><semantics><msubsup><mrow><mo stretchy=\"false\">\u2016</mo><mrow><mi>y</mi><mo>\u2212</mo><msup><mi>C</mi><mo>\u2217</mo></msup></mrow><mo
        stretchy=\"false\">\u2016</mo></mrow><mn>2</mn><mn>2</mn></msubsup><annotation
        encoding=\"application/x-tex\">\\displaystyle\\|y-C^{*}\\|_{2}^{2}</annotation></semantics></math></td>\n<td
        class=\"ltx_td ltx_align_left ltx_eqn_cell\"><math id=\"S7.Ex24.m2\" class=\"ltx_Math\"
        alttext=\"\\displaystyle=\\sum_{i=1}^{d}(y_{i}-C^{*}_{i})^{2}\\leq\\sum_{i=1}^{d}(r^{*})^{2}\\leq
        d(r^{*})^{2}.\" display=\"inline\" intent=\":literal\"><semantics><mrow><mrow><mi></mi><mo>=</mo><mrow><mstyle
        displaystyle=\"true\"><munderover><mo movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>d</mi></munderover></mstyle><msup><mrow><mo
        stretchy=\"false\">(</mo><mrow><msub><mi>y</mi><mi>i</mi></msub><mo>\u2212</mo><msubsup><mi>C</mi><mi>i</mi><mo>\u2217</mo></msubsup></mrow><mo
        stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow><mo>\u2264</mo><mrow><mstyle
        displaystyle=\"true\"><munderover><mo movablelimits=\"false\">\u2211</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>d</mi></munderover></mstyle><msup><mrow><mo
        stretchy=\"false\">(</mo><msup><mi>r</mi><mo>\u2217</mo></msup><mo stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow><mo>\u2264</mo><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><msup><mrow><mo stretchy=\"false\">(</mo><msup><mi>r</mi><mo>\u2217</mo></msup><mo
        stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow></mrow><mo lspace=\"0em\">.</mo></mrow><annotation
        encoding=\"application/x-tex\">\\displaystyle=\\sum_{i=1}^{d}(y_{i}-C^{*}_{i})^{2}\\leq\\sum_{i=1}^{d}(r^{*})^{2}\\leq
        d(r^{*})^{2}.</annotation></semantics></math></td>\n<td class=\"ltx_eqn_cell
        ltx_eqn_center_padright\"></td>\n</tr></tbody>\n</table>\n<p id=\"S7.5.p1.15\"
        class=\"ltx_p\">Hence, each point <math id=\"S7.5.p1.13.m1\" class=\"ltx_Math\"
        alttext=\"y\\in TB\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>y</mi><mo>\u2208</mo><mrow><mi>T</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>B</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">y\\in TB</annotation></semantics></math> is
        at most <math id=\"S7.5.p1.14.m2\" class=\"ltx_Math\" alttext=\"\\sqrt{d}\\cdot
        r^{*}\" display=\"inline\" intent=\":literal\"><semantics><mrow><msqrt><mi>d</mi></msqrt><mo
        lspace=\"0.222em\" rspace=\"0.222em\">\u22C5</mo><msup><mi>r</mi><mo>\u2217</mo></msup></mrow><annotation
        encoding=\"application/x-tex\">\\sqrt{d}\\cdot r^{*}</annotation></semantics></math>
        distance away from the <math id=\"S7.5.p1.15.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>.\n\u220E</p>\n</div>\n</div>\n<div
        id=\"S7.Thmtheorem6\" class=\"ltx_theorem ltx_theorem_lemma\">\n<h6 class=\"ltx_title
        ltx_runin ltx_title_theorem\">\n<span class=\"ltx_tag ltx_tag_theorem\"><span
        id=\"S7.Thmtheorem6.1.1.1\" class=\"ltx_text ltx_font_bold\">Lemma 7.6</span></span><span
        id=\"S7.Thmtheorem6.2.2\" class=\"ltx_text ltx_font_bold\">.</span>\n</h6>\n<div
        id=\"S7.Thmtheorem6.p1\" class=\"ltx_para\">\n<p id=\"S7.Thmtheorem6.p1.1\"
        class=\"ltx_p\"><math id=\"S7.Thmtheorem6.p1.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math><span
        id=\"S7.Thmtheorem6.p1.1.1\" class=\"ltx_text ltx_font_italic\"> validity
        does not imply box validity in general.</span></p>\n</div>\n</div>\n<div id=\"S7.7\"
        class=\"ltx_proof\">\n<h6 class=\"ltx_title ltx_runin ltx_font_italic ltx_title_proof\">Proof.</h6>\n<div
        id=\"S7.6.p1\" class=\"ltx_para\">\n<p id=\"S7.6.p1.8\" class=\"ltx_p\">Consider
        the following scenario: place <math id=\"S7.6.p1.1.m1\" class=\"ltx_Math\"
        alttext=\"\\frac{|H|}{2}\" display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mn>2</mn></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{|H|}{2}</annotation></semantics></math>
        of the honest nodes in (0,0) and the other <math id=\"S7.6.p1.2.m2\" class=\"ltx_Math\"
        alttext=\"\\frac{|H|}{2}\" display=\"inline\" intent=\":literal\"><semantics><mfrac><mrow><mo
        stretchy=\"false\">|</mo><mi>H</mi><mo stretchy=\"false\">|</mo></mrow><mn>2</mn></mfrac><annotation
        encoding=\"application/x-tex\">\\frac{|H|}{2}</annotation></semantics></math>
        in (0,1). The trusted box <math id=\"S7.6.p1.3.m3\" class=\"ltx_Math\" alttext=\"\\mathrm{TB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>TB</mi><annotation encoding=\"application/x-tex\">\\mathrm{TB}</annotation></semantics></math>
        is found on the line segment between the two points. However, <math id=\"S7.6.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is the unit disc centered in the midpoint of the line segment. <math id=\"S7.6.p1.5.m5\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        is fully dimensional, whereas the <math id=\"S7.6.p1.6.m6\" class=\"ltx_Math\"
        alttext=\"\\mathrm{TB}\" display=\"inline\" intent=\":literal\"><semantics><mi>TB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{TB}</annotation></semantics></math>
        is collapsed to the line segment. Hence, <math id=\"S7.6.p1.7.m7\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\\nsubseteq\\mathrm{TB}\" display=\"inline\" intent=\":literal\"><semantics><mrow><mi>MEB</mi><mo>\u2288</mo><mi>TB</mi></mrow><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}\\nsubseteq\\mathrm{TB}</annotation></semantics></math>,
        and thus <math id=\"S7.6.p1.8.m8\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\"
        display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity does not imply box validity.</p>\n</div>\n<div id=\"S7.7.p2\" class=\"ltx_para\">\n<p
        id=\"S7.7.p2.1\" class=\"ltx_p\">\u220E</p>\n</div>\n</div>\n<div id=\"S7.p7\"
        class=\"ltx_para\">\n<p id=\"S7.p7.1\" class=\"ltx_p\">Note that this result
        holds for any relaxation of the box validity if we define it analogously to
        the box validity.</p>\n</div>\n</section>\n<section id=\"S8\" class=\"ltx_section\">\n<h2
        class=\"ltx_title ltx_title_section\">\n<span class=\"ltx_tag ltx_tag_section\">8
        </span>Conclusion</h2>\n\n<div id=\"S8.p1\" class=\"ltx_para ltx_noindent\">\n<p
        id=\"S8.p1.11\" class=\"ltx_p\"><span id=\"S8.p1.11.1\" class=\"ltx_text ltx_font_bold\">Summary.</span>
        We introduced a new practical validity condition based on minimum enclosing
        ball of all non-faulty nodes. Our results show that exact <math id=\"S8.p1.1.m1\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity still suffers from resilience limitations that depend on the geometry
        of the input.\nWe therefore provided a natural relaxation of the validity
        condition, where the radius of the minimum enclosing ball is increased by
        a constant factor <math id=\"S8.p1.2.m2\" class=\"ltx_Math\" alttext=\"c\"
        display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>.
        Further, we presented an optimal algorithm for <math id=\"S8.p1.3.m3\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S8.p1.4.m4\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity and proved that its relaxation ratio can be upper bounded by <math
        id=\"S8.p1.5.m5\" class=\"ltx_Math\" alttext=\"c&lt;\\sqrt{2}\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>c</mi><mo>&lt;</mo><msqrt><mn>2</mn></msqrt></mrow><annotation
        encoding=\"application/x-tex\">c&lt;\\sqrt{2}</annotation></semantics></math>,
        if <math id=\"S8.p1.6.m6\" class=\"ltx_Math\" alttext=\"n&gt;2t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mrow><mn>2</mn><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>t</mi></mrow></mrow><annotation
        encoding=\"application/x-tex\">n&gt;2t</annotation></semantics></math>. Beside
        the optimal algorithm, we analyzed existing algorithms such as MDA, geometric
        median and medoid, and showed that they satisfy <math id=\"S8.p1.7.m7\" class=\"ltx_Math\"
        alttext=\"c\" display=\"inline\" intent=\":literal\"><semantics><mi>c</mi><annotation
        encoding=\"application/x-tex\">c</annotation></semantics></math>-<math id=\"S8.p1.8.m8\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity, where <math id=\"S8.p1.9.m9\" class=\"ltx_Math\" alttext=\"c\" display=\"inline\"
        intent=\":literal\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math>
        is at most constant, supporting the fact that these aggregation methods perform
        well in practice. Finally, we provide a systematic comparison between <math
        id=\"S8.p1.10.m10\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        and existing validity conditions. We believe that <math id=\"S8.p1.11.m11\"
        class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity provides a useful foundation for designing and analyzing robust aggregation
        methods that are both theoretically sound and practically effective in FL.</p>\n</div>\n<div
        id=\"S8.p2\" class=\"ltx_para ltx_noindent\">\n<p id=\"S8.p2.5\" class=\"ltx_p\"><span
        id=\"S8.p2.5.1\" class=\"ltx_text ltx_font_bold\">Limitations.</span> There
        are many interesting avenues for future research.\nOne question concerns computational
        efficiency. The optimal MinMax-<math id=\"S8.p2.1.m1\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        rule requires computing candidate minimum enclosing balls for all subsets
        of size <math id=\"S8.p2.2.m2\" class=\"ltx_Math\" alttext=\"n-t\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>n</mi><mo>\u2212</mo><mi>t</mi></mrow><annotation
        encoding=\"application/x-tex\">n-t</annotation></semantics></math>, so the
        exact implementation becomes expensive when <math id=\"S8.p2.3.m3\" class=\"ltx_Math\"
        alttext=\"t\" display=\"inline\" intent=\":literal\"><semantics><mi>t</mi><annotation
        encoding=\"application/x-tex\">t</annotation></semantics></math> is large.\nPractical
        rules such as medoid, geometric median or MDA are more efficient, but achieve
        weaker relaxation factors.\nMoreover, our model assumes a trusted server,
        reliable communication, Euclidean geometry and a known upper bound <math id=\"S8.p2.4.m4\"
        class=\"ltx_Math\" alttext=\"t\" display=\"inline\" intent=\":literal\"><semantics><mi>t</mi><annotation
        encoding=\"application/x-tex\">t</annotation></semantics></math> on the number
        of Byzantine clients. We view extending <math id=\"S8.p2.5.m5\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity to fully decentralized FL as an important direction for future work.</p>\n</div>\n<div
        id=\"S8.p3\" class=\"ltx_para\">\n<p id=\"S8.p3.4\" class=\"ltx_p\">Another
        limitation is that several of our relaxation bounds are not tight. For MinMax-<math
        id=\"S8.p3.1.m1\" class=\"ltx_Math\" alttext=\"\\mathrm{MEB}\" display=\"inline\"
        intent=\":literal\"><semantics><mi>MEB</mi><annotation encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>,
        the bound <math id=\"S8.p3.2.m2\" class=\"ltx_Math\" alttext=\"c&lt;\\sqrt{2}\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>c</mi><mo>&lt;</mo><msqrt><mn>2</mn></msqrt></mrow><annotation
        encoding=\"application/x-tex\">c&lt;\\sqrt{2}</annotation></semantics></math>
        is tight in the two-dimensional case, but the optimal factor may be even better
        in higher dimensions. Similarly, for MDA, medoid and geometric median, it
        is not clear whether our bounds are tight. Closing these gaps is an interesting
        geometric question.\nAdditionally, one may ask how the relation is between
        multiplicative and additive relaxation of <math id=\"S8.p3.3.m3\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity. One can define additive relaxation for <math id=\"S8.p3.4.m4\" class=\"ltx_Math\"
        alttext=\"\\mathrm{MEB}\" display=\"inline\" intent=\":literal\"><semantics><mi>MEB</mi><annotation
        encoding=\"application/x-tex\">\\mathrm{MEB}</annotation></semantics></math>
        validity similarly to\_<cite class=\"ltx_cite ltx_citemacro_cite\">Xiang and
        Vaidya (<a href=\"#bib.bib1\" title=\"Relaxed Byzantine Vector Consensus\"
        class=\"ltx_ref\">2017</a>)</cite>. Observe that the upper bound from Theorem\_<a
        href=\"#S5.Thmtheorem4\" title=\"Theorem 5.4. \u2023 5 Optimal algorithm for
        MEB validity \u2023 Practical Validity Conditions for Byzantine-Tolerant Federated
        Learning\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">5.4</span></a>
        would also hold for the additive definition. The upper-bound construction
        from Theorem\_<a href=\"#S5.Thmtheorem4\" title=\"Theorem 5.4. \u2023 5 Optimal
        algorithm for MEB validity \u2023 Practical Validity Conditions for Byzantine-Tolerant
        Federated Learning\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">5.4</span></a>
        also gives an additive guarantee, but the two relaxations may behave differently
        when the candidate minimum enclosing balls have very different radii. Understanding
        when multiplicative or additive relaxation is more appropriate for practical
        aggregation remains an interesting\ndirection for future work.</p>\n</div>\n</section>\n<section
        id=\"bib\" class=\"ltx_bibliography\">\n<h2 class=\"ltx_title ltx_title_bibliography\">References</h2>\n\n<ul
        id=\"bib.L1\" class=\"ltx_biblist\">\n<li id=\"bib.bib8\" class=\"ltx_bibitem
