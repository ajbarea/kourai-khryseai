      string: "<!DOCTYPE html><html lang=\"en\"><head><title>A Little Is Enough:
        Circumventing Defenses For Distributed Learning</title></head><body><article>
        <h1>A Little Is Enough: Circumventing Defenses For Distributed Learning</h1>
        <p>We propose a novel attack: A Little Is Enough. It perturbs honest updates
        within statistical bounds. Byzantine participants can circumvent existing
        defenses by keeping perturbations within the statistical envelope of honest
        gradient updates.</p></article></body></html>"
