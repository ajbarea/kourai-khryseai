[project]
name = "kourai-common"
version = "0.1.0"
description = "Shared utilities for Kourai Khryseai agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=0.3.25,<1.0",
    "litellm>=1.80.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.26.0,<2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "huggingface-hub>=1.5.0",
]

[project.scripts]
kourai-dev = "kourai_common.dev_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kourai_common"]
