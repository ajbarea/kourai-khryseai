[project]
name = "kourai-common"
version = "0.1.0"
description = "Shared utilities for Kourai Khryseai agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    # a2a-sdk 1.0 landed via M7 Phase 3 — Part construction centralized in
    # kourai_common.messaging, server build centralized in kourai_common.server,
    # AgentCard uses supported_interfaces with v0.3 fallback for transitional
    # client compatibility. See ROADMAP M7.
    "a2a-sdk[http-server]>=1.0,<2.0",
    "litellm>=1.83.7",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "mcp>=1.26.0,<2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "huggingface-hub>=1.5.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
kourai-dev = "kourai_common.dev_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kourai_common"]
