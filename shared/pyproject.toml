[project]
name = "kourai-common"
version = "0.1.0"
description = "Shared utilities for Kourai Khryseai agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    # a2a-sdk 1.0 landed via M7 (six phases, all six shipped 2026-04-30):
    # Part construction in kourai_common.messaging, server build in
    # kourai_common.server, AgentCard.supported_interfaces ships the v1.0
    # JSON-RPC binding only (Phase 6 retired the transitional v0.3
    # fallback). See ROADMAP M7.
    "a2a-sdk[http-server]>=1.0,<2.0",
    "litellm>=1.83.7",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "mcp>=1.26.0,<2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "huggingface-hub>=1.5.0",
    "pydantic>=2.0,<3.0",
    # M18 Phase 2: SSML strip layer (`kourai_common.ssml`) parses LLM-
    # generated SSML before feeding Kokoro. Stdlib `xml.etree` is
    # vulnerable to billion-laughs / XXE on untrusted input; defusedxml
    # is the canonical hardening drop-in (Python docs still recommend
    # it as of 2026-05 — module-level patch is deprecated but the
    # safe parser classes stay).
    "defusedxml>=0.7.1",
    # Pulled in by the cross-host DRY sweep (May 2026):
    # kourai_common.audio_dsp uses numpy for normalization / fades / waveform
    # extraction (was GUI-only at hosts/gui/audio_utils.py).
    # kourai_common.message_classifier strips emoji before regex-classifying
    # status text (was GUI-only).
    "numpy>=1.26",
    "emoji>=2.15.0",
]

[project.scripts]
kourai-dev = "kourai_common.dev_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kourai_common"]
