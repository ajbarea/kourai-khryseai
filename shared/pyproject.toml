[project]
name = "kourai-common"
version = "0.1.0"
description = "Shared utilities for Kourai Khryseai agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    # M7 (a2a-sdk 1.0.x migration) is bigger than the dual-shape firewall in
    # a2a_utils.py covers — 1.0 went protobuf-based, so Part/TextPart/FilePart
    # no longer import as separate Pydantic types and every Part construction
    # site needs rewriting. Keeping the pin at <1.0 until M7 lands with proper
    # live-A2A smoke testing. See ROADMAP M7.
    "a2a-sdk[http-server]>=0.3.25,<1.0",
    "litellm>=1.83.7",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "mcp>=1.26.0,<2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "huggingface-hub>=1.5.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
kourai-dev = "kourai_common.dev_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kourai_common"]
