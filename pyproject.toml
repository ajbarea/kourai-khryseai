[project]
name = "kourai-khryseai"
version = "0.1.0"
description = "Multi-agent A2A development system — Golden Maidens of Hephaestus"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# Includes kourai-common (where academic_search lives) so the nightly contract
# job can `uv sync --extra aletheia-v2` for just this slice — skipping the
# realtimetts -> pyaudio audio stack that `--all-packages` otherwise builds.
aletheia-v2 = [
    "kourai-common",
    "httpx>=0.28",
    "tenacity>=9.0",
    "rapidfuzz>=3.10",
    "docling>=2.10",
    "pyyaml>=6.0",
    "pydantic>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "pytest-recording>=0.13",
    "ruff>=0.15.15",
    "ty>=0.0.42,<0.1",
    "zensical>=0.0.24",
    "hypothesis>=6.152.9",
    "httpx>=0.27.0",
    "mcp>=1.26.0,<2",
    "testcontainers>=4.9.1",
]

[tool.uv]
package = false
# override-dependencies: transitives in the litellm chain occasionally
# pin older versions of packages with known advisories; we force the
# patched versions globally and accept overriding upstream pins.
# Revisit periodically — when litellm pins a version we're already
# happy with, the matching override line stops doing useful work and
# can be dropped. Verification recipe: remove a line, run `uv lock`,
# check the resolved version + `uv audit` for CVE status.
#
# - aiohttp: litellm 1.83.14 pins ==3.13.4; the override allows the
#   3.13.5 patch (currently the latest) to resolve. Drop this override
#   when litellm's pin catches up to whatever 3.13.x line we want to
#   ride.
override-dependencies = [
    "aiohttp>=3.13.4",
]

[tool.uv.workspace]
members = [
    "shared",
    "agents/*",
    "hosts/cli",
    "hosts/gui",
    "mcp_servers/*",
]
# services/* are deliberately NOT workspace members: services/chatterbox ships
# torch==2.6.0 (chatterbox-tts pin), which would downgrade the main torch-2.11
# stack if it shared this resolution. It's an independent uv project reached
# over HTTP. research(2026-05): uv docs — workspaces are "not suited for cases
# in which members have conflicting requirements"; use a separate project.
exclude = ["**/__pycache__", "services/*"]

[tool.uv.sources]
kourai-common = { workspace = true }
kourai-aidos = { workspace = true }
kourai-aletheia = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv*",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "W", "C4", "S", "ASYNC", "T20",
    "PERF",  # Performance anti-patterns
    "RUF",   # Ruff-specific rules
    "PTH",   # pathlib over os.path
    "N",     # PEP 8 naming conventions
    "PIE",   # Misc lints (flake8-pie)
    "FURB",  # Modernization (refurb)
    "LOG",   # Logging conventions (flake8-logging)
    "TCH",   # TYPE_CHECKING imports (runtime perf)
    "FLY",   # f-string conversion (flynt)
]
fixable = ["ALL"]
unfixable = ["T20"]  # Don't auto-remove print statements
ignore = [
    "E501",    # Handled by formatter
    "B008",    # Function calls in defaults (FastAPI/Click patterns)
    "SIM102",  # Nested if statements
    "SIM108",  # Use ternary operator
    "N806",    # Uppercase variables in functions — our convention for constants-in-scope
    "N818",    # Exception name suffix — too noisy for existing code
    "RUF001",  # Ambiguous unicode in strings (em-dashes, arrows)
    "RUF002",  # Ambiguous unicode in docstrings
    "RUF003",  # Ambiguous unicode in comments
    "RUF012",  # Mutable class variables — conflicts with dataclass patterns
    "RUF059",  # Unused unpacked variables — 3-tuple destructuring pattern
    "PERF203", # try-except in loop — sometimes unavoidable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402", "S603", "S607", "ASYNC221", "S108"]  # Assert + importorskip + subprocess in test helpers; S108 for intentional /tmp paths mirroring script state file
"shared/src/kourai_common/dev_cli.py" = ["T201", "S603"]  # CLI tool: intentional print output and safe subprocess calls
"shared/src/kourai_common/dev_log.py" = ["T201"]  # Dev runner: intentional console echo alongside the log file
"shared/src/kourai_common/projects.py" = ["S603", "S607"]  # Invokes git on player-owned project paths
"shared/src/kourai_common/forge_session.py" = ["S603", "S607"]  # Invokes git for worktree management
"shared/src/kourai_common/sandbox.py" = ["S603", "S607"]  # Invokes docker / agent-allowlisted commands
"scripts/*.py" = ["T201", "S607"]  # CLI scripts: intentional terminal output + uv/commands in PATH

[tool.ruff.lint.isort]
known-first-party = ["kourai_common", "agents", "hosts"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def main\\(\\):",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--record-mode=none --dist loadgroup"
log_level = "INFO"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "integration: mark test as requiring real external boundaries (containers/network/protocols)",
    "slow: mark test as slow / heavyweight (Kokoro inference, etc.) — skipped on the push/PR fast lane and run only by the nightly workflow",
    "nightly: real-API or heavy-cassette tests skipped on the push/PR fast lane; nightly workflow runs them",
    "xdist_group: pin a module's tests to one xdist worker when they share a machine-global resource (tmux session, /tmp state file)",
]
filterwarnings = [
    "ignore::UserWarning:torch.nn.modules.rnn",
    "ignore::FutureWarning:torch.nn.utils.weight_norm",
    "ignore::DeprecationWarning:torch.jit._script",
    "ignore::DeprecationWarning:misaki.en",
    "ignore:.*open_text is deprecated.*:DeprecationWarning",
    "ignore:.*unclosed event loop.*:ResourceWarning",
    # pydub 0.25.1 (transitive via realtimetts → hosts/gui + agents/vn_bridge)
    # is unmaintained (last release 2021); regex strings in pydub.utils have
    # unescaped backslashes that emit SyntaxWarning under Python 3.12+, and
    # pydub.utils:170 emits a one-time RuntimeWarning when ffmpeg is absent
    # from the runner PATH. Neither is actionable upstream.
    "ignore::SyntaxWarning:pydub",
    "ignore::RuntimeWarning:pydub",
]

[tool.ty.environment]
python-version = "3.12"
root = ["./"]

[tool.ty.src]
include = ["agents", "hosts/cli", "hosts/gui", "mcp_servers", "shared/src", "tests"]
exclude = [
    "__pycache__",
    ".venv*",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ty.rules]
all = "warn"
unresolved-import = "error"

[tool.ty.analysis]
# Replace untyped third-party libraries with Any to suppress import errors
replace-imports-with-any = [
    "pygame.**",
    "hypothesis.**",
    "pytest.**",
    "_pytest.**",
    "a2a.**",
    "litellm.**",
    "uvicorn.**",
    "kokoro",
    "kokoro.**",
]
# Allow unresolved imports in test files (Ren'Py bridge and other test-only imports)
# Aletheia v2 optional deps: not installed under default `uv sync --all-packages --dev`
# (they live in the `aletheia-v2` extra). Production code that imports them is
# tested in CI jobs that install the extra; ty sees the imports as unresolved
# in the default lint job and would error without this allowlist.
allowed-unresolved-imports = [
    "bridge",
    "test.**",
    "rapidfuzz",
    "rapidfuzz.**",
    "httpx",
    "httpx.**",
    "tenacity",
    "tenacity.**",
    "docling",
    "docling.**",
    "vcr",
    "vcr.**",
]
