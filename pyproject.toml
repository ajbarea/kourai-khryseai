[project]
name = "kourai-khryseai"
version = "0.1.0"
description = "Multi-agent A2A development system — Golden Maidens of Hephaestus"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9",
    "ty>=0.0.25",
    "zensical>=0.0.24",
    "hypothesis>=6.151.9",
    "httpx>=0.27.0",
    "mcp>=1.26.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "agents/*",
    "hosts/cli",
    "hosts/gui",
    "mcp_servers/*",
]
exclude = ["**/__pycache__"]

[tool.uv.sources]
kourai-common = { workspace = true }
kourai-aidos = { workspace = true }
kourai-aletheia = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv*",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "W", "C4", "S", "ASYNC", "T20",
    "PERF",  # Performance anti-patterns
    "RUF",   # Ruff-specific rules
    "PTH",   # pathlib over os.path
    "N",     # PEP 8 naming conventions
    "PIE",   # Misc lints (flake8-pie)
    "FURB",  # Modernization (refurb)
    "LOG",   # Logging best practices
    "TCH",   # TYPE_CHECKING imports (runtime perf)
    "FLY",   # f-string conversion (flynt)
]
fixable = ["ALL"]
unfixable = ["T20"]  # Don't auto-remove print statements
ignore = [
    "E501",    # Handled by formatter
    "B008",    # Function calls in defaults (FastAPI/Click patterns)
    "SIM102",  # Nested if statements
    "SIM108",  # Use ternary operator
    "N806",    # Uppercase variables in functions — our convention for constants-in-scope
    "N818",    # Exception name suffix — too noisy for existing code
    "RUF001",  # Ambiguous unicode in strings (em-dashes, arrows)
    "RUF002",  # Ambiguous unicode in docstrings
    "RUF003",  # Ambiguous unicode in comments
    "RUF012",  # Mutable class variables — conflicts with dataclass patterns
    "RUF059",  # Unused unpacked variables — 3-tuple destructuring pattern
    "PERF203", # try-except in loop — sometimes unavoidable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402"]  # Assert + importorskip-before-import pattern

[tool.ruff.lint.isort]
known-first-party = ["kourai_common", "agents", "hosts"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.12"
root = ["./"]

[tool.ty.src]
include = ["agents", "hosts/cli", "hosts/gui", "mcp_servers", "shared/src", "tests"]
exclude = [
    "__pycache__",
    ".venv*",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ty.rules]
all = "warn"
unresolved-import = "error"

[tool.ty.analysis]
# Replace untyped third-party libraries with Any to suppress import errors
replace-imports-with-any = [
    "pygame.**",
    "hypothesis.**",
    "pytest.**",
    "_pytest.**",
    "a2a.**",
    "litellm.**",
    "uvicorn.**",
    "github.**",
]
# Allow unresolved imports in test files (Ren'Py bridge and other test-only imports)
allowed-unresolved-imports = ["bridge", "test.**"]
