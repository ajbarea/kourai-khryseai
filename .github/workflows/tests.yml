name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them.
        # research(2026-05): replaced awalsh128/cache-apt-pkgs-action with a
        # direct apt-get install — the action's transitive SHA pin to
        # actions/cache/restore@v4.3.0 runs on Node 20 (deprecated; default
        # flips to Node 24 on 2026-06-16, removed entirely 2026-09-16). For a
        # single 200KB package, install (~5s) is faster than the cache action's
        # restore overhead anyway. Upstream fix sits in awalsh128/cache-apt-
        # pkgs-action#193 + #198, unmerged for 5+ weeks.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        # research(2026-05): --output-format=github emits ::error:: annotations
        # so violations appear inline on the PR diff. Replaces #187's
        # JSON-to-file + `|| true` which silently swallowed failures.
        run: uv run ruff check --output-format=github .

      - name: Run ty type check
        run: uv run ty check agents hosts/cli hosts/gui mcp_servers shared/src tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them.
        # See the first usage of this step (line ~37) for the research(2026-05)
        # note on why we don't use awalsh128/cache-apt-pkgs-action.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run unit tests
        # -m "not slow" guards the fast lane against heavyweight Kokoro
        # inference tests, which flake on shared runners with SystemExit:1
        # (model-load timeout / OOM). No test currently carries the marker,
        # and no workflow inverts it — add a runner before marking one.
        run: uv run pytest -n auto tests/unit/ -m "not slow" -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: logs/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/junit.xml
          flags: unit
          report_type: test_results
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DOCKER_HUB_USERNAME: ajb6289
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them.
        # See the first usage of this step (line ~37) for the research(2026-05)
        # note on why we don't use awalsh128/cache-apt-pkgs-action.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          DOCKER_HUB_USERNAME=ajb6289
          KOURAI_PROVIDER=local
          KOURAI_MODEL_TIER=cheap
          KOURAI_LOG_LEVEL=INFO
          ENVIRONMENT=ci
          SERVICE_VERSION=0.1.0
          EOF

      - name: Set up Docker Buildx
        # Required for GHA layer caching (cache-from/cache-to type=gha).
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build context7-mcp sidecar image
        # mode=max caches intermediate layers — matters here because the
        # npm install is its own layer and we want it back across runs.
        # load=true makes the image visible to the integration tests below.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/context7-mcp.Dockerfile
          tags: ${{ env.DOCKER_HUB_USERNAME }}/kourai-khryseai:context7-mcp
          cache-from: type=gha,scope=context7-mcp
          cache-to: type=gha,mode=max,scope=context7-mcp
          load: true

      - name: Build memory-mcp sidecar image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/memory-mcp.Dockerfile
          tags: ${{ env.DOCKER_HUB_USERNAME }}/kourai-khryseai:memory-mcp
          cache-from: type=gha,scope=memory-mcp
          cache-to: type=gha,mode=max,scope=memory-mcp
          load: true

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run integration tests
        run: uv run pytest tests/integration/ -m integration -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: logs/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/coverage.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/junit.xml
          flags: integration
          report_type: test_results
          fail_ci_if_error: false

  aletheia-v2-tests:
    name: Aletheia v2 Tests
    runs-on: ubuntu-latest
    needs: lint
    # The default unit-tests / integration-tests jobs use
    # `uv sync --all-packages --dev --frozen` (no `--extra aletheia-v2`),
    # so tests guarded by `pytest.importorskip("rapidfuzz" / "httpx" /
    # "tenacity" / "docling")` silently skip. This job installs the extra
    # and runs the same tests for real, so regressions in the aletheia-v2
    # citation-verification stack actually gate the build.
    # research(2026-05): keeping this as a separate job (not matrix) — only
    # one optional extra to exercise, no Python-version sweep, fail-fast
    # default is fine. Revisit if a second extra appears.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # Same PortAudio constraint as the other jobs; see the lint job for
        # the research(2026-05) note on why we shell out to apt-get
        # directly instead of using cache-apt-pkgs-action.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies (with aletheia-v2 extra)
        run: uv sync --all-packages --extra aletheia-v2 --group dev --frozen

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run aletheia-v2 unit tests
        # tests/unit/test_triangulate.py + tests/unit/test_citation_artifacts.py
        # are the unit-tier aletheia-v2 surface. test_triangulate gates on
        # rapidfuzz via importorskip; test_citation_artifacts has no extras.
        run: uv run pytest -n auto tests/unit/test_triangulate.py tests/unit/test_citation_artifacts.py -v --tb=short --cov=shared/src/kourai_common --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Run aletheia-v2 integration tests
        # Cassette-replay tests for academic search (S2 / arXiv / OpenAlex)
        # and agent verify_and_cite / audit_existing_citations end-to-end tests.
        # The docling-via-PDF test is `-m nightly` so it's excluded here.
        run: uv run pytest tests/integration/test_academic_search.py tests/integration/test_aletheia_verify_cite.py -v --tb=short -m "not nightly" --cov=shared/src/kourai_common --cov=agents/aletheia --cov-append --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit-integration.xml

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aletheia-v2-test-results
          path: logs/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/coverage.xml
          flags: aletheia-v2
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/junit.xml,logs/junit-integration.xml
          flags: aletheia-v2
          report_type: test_results
          fail_ci_if_error: false
