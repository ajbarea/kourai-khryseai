name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ty type check
        run: uv run ty check agents hosts/cli hosts/gui mcp_servers shared/src tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run unit tests
        # -m "not slow" skips the heavyweight Kokoro inference tests on the
        # push/PR fast lane. They flake intermittently on shared CI runners
        # with SystemExit:1 (model-load timeout / OOM). The nightly workflow
        # runs them by inverting the marker.
        run: uv run pytest -n auto tests/unit/ -m "not slow" -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai_khryseai
          files: logs/coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai_khryseai
          files: logs/junit.xml
          flags: unit
          report_type: test_results
          fail_ci_if_error: false

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run performance tests
        run: uv run pytest tests/performance/ -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai_khryseai
          files: logs/coverage.xml
          flags: performance
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai_khryseai
          files: logs/junit.xml
          flags: performance
          report_type: test_results
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DOCKER_HUB_USERNAME: ajb6289
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          DOCKER_HUB_USERNAME=ajb6289
          KOURAI_PROVIDER=local
          KOURAI_MODEL_TIER=cheap
          KOURAI_LOG_LEVEL=INFO
          ENVIRONMENT=ci
          SERVICE_VERSION=0.1.0
          EOF

      - name: Build MCP sidecar images for integration tests
        run: |
          docker build -f docker/context7-mcp.Dockerfile -t ${DOCKER_HUB_USERNAME}/kourai-khryseai:context7-mcp .
          docker build -f docker/memory-mcp.Dockerfile -t ${DOCKER_HUB_USERNAME}/kourai-khryseai:memory-mcp .

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run integration tests
        run: uv run pytest tests/integration/ -m integration -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai_khryseai
          files: logs/coverage.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai_khryseai
          files: logs/junit.xml
          flags: integration
          report_type: test_results
          fail_ci_if_error: false
