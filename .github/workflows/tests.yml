name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: portaudio19-dev
          version: 1.0

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check . --output-format json > /tmp/ruff-output.json || true

      - name: Upload lint results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-py${{ matrix.python-version }}
          path: /tmp/ruff-output.json
          retention-days: 30

      - name: Run ty type check
        run: uv run ty check agents hosts/cli hosts/gui mcp_servers shared/src tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: portaudio19-dev
          version: 1.0

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run unit tests
        # -m "not slow" skips the heavyweight Kokoro inference tests on the
        # push/PR fast lane. They flake intermittently on shared CI runners
        # with SystemExit:1 (model-load timeout / OOM). The nightly workflow
        # runs them by inverting the marker.
        run: uv run pytest -n auto tests/unit/ -m "not slow" -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: logs/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/junit.xml
          flags: unit
          report_type: test_results
          fail_ci_if_error: false

