name: Nightly

# Slow integration tests run nightly + on manual dispatch — the Docker
# MCP sidecar build + real integration path doesn't fit the push/PR fast
# lane (`tests.yml`).

on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC daily (one hour after vFL nightly to avoid runner contention)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance-tests:
    name: Performance Tests (Nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PortAudio headers for PyAudio (pulled in by RealtimeTTS via hosts/gui).
        # See tests.yml for the research(2026-05) note on why this is a bare
        # apt-get instead of awalsh128/cache-apt-pkgs-action.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run performance tests
        run: uv run pytest tests/performance/ -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-test-results
          path: logs/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/coverage.xml
          flags: performance
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/junit.xml
          flags: performance
          report_type: test_results
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests (Nightly)
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ajb6289
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install system audio dependencies
        # PyAudio (pulled in by RealtimeTTS via hosts/gui) builds against
        # PortAudio headers; ubuntu-latest doesn't ship them.
        # See tests.yml for the research(2026-05) note on why this is a bare
        # apt-get instead of awalsh128/cache-apt-pkgs-action.
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          DOCKER_HUB_USERNAME=ajb6289
          KOURAI_PROVIDER=local
          KOURAI_MODEL_TIER=cheap
          KOURAI_LOG_LEVEL=INFO
          ENVIRONMENT=ci
          SERVICE_VERSION=0.1.0
          EOF

      - name: Set up Docker Buildx
        # Required for GHA layer caching (cache-from/cache-to type=gha).
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build context7-mcp sidecar image with GHA caching
        # mode=max caches intermediate layers — matters here because the
        # npm install is its own layer and we want it back across runs.
        # load=true makes the image visible to the integration tests below.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/context7-mcp.Dockerfile
          tags: ${{ env.DOCKER_HUB_USERNAME }}/kourai-khryseai:context7-mcp
          cache-from: type=gha,scope=context7-mcp
          cache-to: type=gha,mode=max,scope=context7-mcp
          load: true

      - name: Build memory-mcp sidecar image with GHA caching
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/memory-mcp.Dockerfile
          tags: ${{ env.DOCKER_HUB_USERNAME }}/kourai-khryseai:memory-mcp
          cache-from: type=gha,scope=memory-mcp
          cache-to: type=gha,mode=max,scope=memory-mcp
          load: true

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run integration tests
        run: uv run pytest tests/integration/ -m integration -v --tb=short --cov=. --cov-report=xml:logs/coverage.xml --cov-report=term-missing --junitxml=logs/junit.xml

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-integration-test-results
          path: logs/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/coverage.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ajbarea/kourai-khryseai
          files: logs/junit.xml
          flags: integration
          report_type: test_results
          fail_ci_if_error: false

  aletheia-v2-contracts:
    name: Aletheia v2 API Contracts (Nightly)
    # Three real-API calls per source (Semantic Scholar / OpenAlex / arXiv) —
    # surfaces upstream schema drift hours before it breaks the cassette-replay
    # path. Independent of integration-tests; runs even if Docker setup fails.
    runs-on: ubuntu-latest
    env:
      # S2 unauthenticated rate-limits aggressively; the test skips cleanly
      # when this is unset. Setting the secret turns the S2 contract check on.
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      # OpenAlex requires a key as of 2026 (keyless pool retired); without it
      # the OpenAlex contract call 4xxes instead of skipping.
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies with aletheia-v2 extra
        # Scoped to the aletheia-v2 slice (kourai-common + academic-search deps),
        # NOT --all-packages: the latter builds the VN/GUI realtimetts -> pyaudio
        # stack, which needs portaudio headers this job doesn't install.
        run: uv sync --extra aletheia-v2 --dev --frozen

      - name: Run nightly API-contract tests
        run: uv run pytest tests/nightly/test_api_contracts.py -v --tb=short -m nightly
