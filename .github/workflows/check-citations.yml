name: check-citations

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.md"
      - "docs/citations/**"
      - "scripts/check_citations.py"
      - ".github/workflows/check-citations.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-citations:
    name: Citation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install minimal deps (pyyaml)
        run: uv sync --no-install-project

      - name: Run check_citations.py
        # research(2026-05): no-LLM walker; exits 0 when every docs/citations/<slug>.md
        # reference in production source resolves to a well-formed artifact.
        run: uv run python scripts/check_citations.py .
