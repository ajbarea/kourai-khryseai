name: check-citations

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.md"
      - "docs/citations/**"
      - "scripts/check_citations.py"
      - ".github/workflows/check-citations.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-citations:
    name: Citation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install minimal deps (pyyaml)
        run: uv sync --no-install-project

      - name: Run check_citations.py
        # research(2026-05): no-LLM walker; exits 0 when every docs/citations/<slug>.md
        # reference in production source resolves to a well-formed artifact.
        run: uv run python scripts/check_citations.py .
