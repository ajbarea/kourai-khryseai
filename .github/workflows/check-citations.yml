name: check-citations

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.md"
      - "docs/citations/**"
      - "scripts/check_citations.py"
      - ".github/workflows/check-citations.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-citations:
    name: Citation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install minimal deps (pyyaml)
        run: uv sync --no-install-project

      - name: Run check_citations.py
        # research(2026-05): no-LLM walker; exits 0 when every docs/citations/<slug>.md
        # reference in production source resolves to a well-formed artifact.
        run: uv run python scripts/check_citations.py .
