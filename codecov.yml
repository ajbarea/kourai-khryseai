codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

ignore:
  - "tests/**"
  - "docs/**"
  - "scripts/**"
  - "tools/**"
  - "assets/**"
  - "templates/**"
  - "hosts/**"
  - "docker/**"
  - "*.md"
