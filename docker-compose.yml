    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10006/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: ["agents", "full"]

  cupid:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
