    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10003
      PLAYWRIGHT_BROWSERS_PATH: /home/kourai/.cache/ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10003/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"

  # Metis
  metis:
    <<: *agent-common
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:metis
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: metis
        PORT: 10001
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:metis
      cache_to:
        - type=inline
    ports:
      - "10001:10001"
    volumes:
      - ./agents/metis:/app/agents/metis
      - ./shared:/app/shared
      - ./tests:/app/tests
      - kourai-artifacts-metis:/agent-artifacts
    develop:
