    depends_on:
      jaeger:
        condition: service_started
      mneme:
        condition: service_healthy
      kallos:
        condition: service_healthy
      techne:
        condition: service_healthy
      dokimasia:
        condition: service_healthy
      metis:
        condition: service_healthy
      puck:
        condition: service_healthy
      cupid:
        condition: service_healthy
      aidos:
        condition: service_healthy
      aletheia:
        condition: service_healthy

volumes:
  memory-graph-storage:
    driver: local

networks:
  kourai:
    driver: bridge

