    volumes:
      - ./agents/metis:/app/agents/metis      # hot reload metis code
      - ./shared:/app/shared                  # hot reload shared code
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/metis
          target: /app/agents/metis
        - action: sync
          path: ./shared
