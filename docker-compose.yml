  # ──────────────── Companion Spirits ────────────────
  puck:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: puck
        PORT: 10006
    ports:
      - "10006:10006"
    volumes:
      - ./agents/puck:/app/agents/puck
      - ./shared:/app/shared
    develop:
      watch:
        - action: sync
          path: ./agents/puck
          target: /app/agents/puck
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
