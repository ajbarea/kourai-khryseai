      KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    networks:
      - kourai
    restart: no
    depends_on:
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["gui"]

networks:
  kourai:
    driver: bridge

