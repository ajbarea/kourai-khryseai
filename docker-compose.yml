  # ──────────────── VN Bridge ────────────────
  # VN Bridge: Connects the multi-agent system to the visual novel frontend.
  vn-bridge:
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:vn-bridge
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: vn_bridge
        PACKAGE_NAME: hephaestus
        PORT: 10010
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:vn-bridge
      cache_to:
        - type=inline
    env_file: .env
    environment:
      HOST_TYPE: vn_bridge
      PORT: "10010"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
    ports:
      - "10010:10010"
    volumes:
      - ./agents/vn_bridge.py:/app/agents/vn_bridge.py
      - ./shared:/app/shared
      - ~/.kourai_khryseai:/home/kourai/.kourai_khryseai
    networks:
      - kourai
    restart: unless-stopped
    depends_on:
      hephaestus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:10010/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    logging: *default-logging

  # ──────────────── Orchestrator ────────────────
  # Hephaestus: The central orchestration agent that manages sub-agents.
  hephaestus:
    <<: *agent-common
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:hephaestus
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: hephaestus
        PORT: 10000
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:hephaestus
      cache_to:
        - type=inline
    ports:
      - "10000:10000"
    volumes:
      - ./agents/hephaestus:/app/agents/hephaestus
      - ./shared:/app/shared
    develop:
      watch:
        - action: sync
          path: ./agents/hephaestus
          target: /app/agents/hephaestus
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
    depends_on:
      jaeger:
        condition: service_started
      mneme:
        condition: service_healthy
      kallos:
        condition: service_healthy
      techne:
        condition: service_healthy
      dokimasia:
        condition: service_healthy
      metis:
        condition: service_healthy
      puck:
        condition: service_healthy
      cupid:
        condition: service_healthy
      aidos:
        condition: service_healthy
      aletheia:
        condition: service_healthy

# ----------------------------------------------------------------------
# PERSISTENT VOLUMES
# ----------------------------------------------------------------------
# Define named volumes for persistent data storage across restarts.
volumes:
  memory-graph-storage:
    driver: local
  kourai-artifacts-kallos:
    driver: local
  kourai-artifacts-techne:
    driver: local
  kourai-artifacts-dokimasia:
    driver: local
  kourai-artifacts-metis:
    driver: local

# ----------------------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------------------
# Custom bridge network for isolated inter-container communication.
networks:
  kourai:
    driver: bridge
