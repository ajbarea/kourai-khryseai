    deploy:
      resources:
        limits:
          memory: 512M

  cupid:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: cupid
        PORT: 10007
    ports:
      - "10007:10007"
    volumes:
