      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    profiles: ["agents", "full"]

  dokimasia:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
