# Defines the multi-agent application infrastructure and components.
# Adheres to best practices: common anchors, explicit dependency management, and healthchecks.

# ----------------------------------------------------------------------
# EXTENSION FIELDS (Anchors)
# ----------------------------------------------------------------------
# Common configuration block for agent services to adhere to DRY principles.
# Configures shared build contexts, telemetry (OTEL), and healthcheck endpoints.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: docker/host.Dockerfile
    args:
      HOST_TYPE: agent
  env_file: .env
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
    KOURAI_STREAM_ENABLED: ${KOURAI_STREAM_ENABLED:-true}
    MEMORY_MCP_URL: http://memory-mcp:5001/mcp
    CONTEXT7_MCP_URL: http://context7-mcp:3001/mcp
    HF_TOKEN: ${HF_TOKEN:-}
    KOURAI_BUCKET_ID: ${KOURAI_BUCKET_ID:-}
    AGENT_ARTIFACTS_DIR: /agent-artifacts
  volumes:
    - ./shared:/app/shared
  networks:
    - kourai
  restart: unless-stopped
  depends_on:
    jaeger:
      condition: service_started
  logging: *default-logging
  labels:
    dev.dozzle.group: agents

# ----------------------------------------------------------------------
# SERVICES OVERVIEW
# ----------------------------------------------------------------------
services:

  # ──────────────── Infrastructure ────────────────
  # Jaeger v2 (OTel-Collector-based). Configuration lives in
  # docker/jaeger-config.yaml; the v1 env-var surface
  # (COLLECTOR_OTLP_ENABLED, SPAN_STORAGE_TYPE, METRICS_STORAGE_TYPE,
  # PROMETHEUS_SERVER_URL, PROMETHEUS_QUERY_SUPPORT_SPAN_UNIT) collapses
  # into that file. Internal metrics moved from v1's :14269 to :8888;
  # Prometheus reaches it over the kourai bridge so no host mapping
  # is needed for it.
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    labels:
      dev.dozzle.group: observability
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./docker/jaeger-config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # Prometheus v3 (distroless variant: minimal base image, nonroot
  # UID 65532). Time-series database for metrics aggregation —
  # scrapes Jaeger's own telemetry on :8888 and the spanmetrics
  # connector's RED output on :8889 (both reached over the kourai
  # bridge; no host mapping needed for either Jaeger port).
  #
  # Distroless is a free win here because we run with no persistent
  # volume — the named-volume chown migration that the regular
  # busybox→distroless swap requires doesn't apply to us.
  prometheus:
    image: prom/prometheus:v3.10.0-distroless
    labels:
      dev.dozzle.group: observability
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # Dozzle: Real-time per-container log dashboard. Browser-based,
  # zero-config, no database. Tails every container in this compose
  # project (filtered by COMPOSE_PROJECT_NAME via the docker socket).
  # Use case: live triage when a pipeline goes wrong without juggling
  # `docker logs -f` across 14 terminals; click on `metis-1` and
  # follow it in real time. Pairs with Jaeger (per-trace flow) and
  # Prometheus (rates/durations) — Dozzle is the third pane that
  # answers "what is *this* agent saying right now."
  #
  # Researched 2026-04-27: dozzle is the right choice over Loki+Grafana
  # (heavier, production-grade) and Logdy (general-purpose pipe viewer)
  # for our shape — single dev machine, ~14 containers, want a
  # single browser tab. Docker socket bind is read-only; UI binds
  # localhost-only so nothing leaks beyond the dev box.
  dozzle:
    image: amir20/dozzle:v10.5.0
    labels:
      dev.dozzle.group: observability
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      DOZZLE_FILTER: "label=com.docker.compose.project=kourai-khryseai"
      DOZZLE_NO_ANALYTICS: "true"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  # ──────────────── MCP Sidecars ────────────────
  # Memory MCP: Shared knowledge graph sidecar.
  memory-mcp:
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:memory-mcp
    labels:
      dev.dozzle.group: mcp
    build:
      context: .
      dockerfile: docker/memory-mcp.Dockerfile
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:memory-mcp
      cache_to:
        - type=inline
    volumes:
      - ./docker/memory-mcp-server.js:/app/memory-mcp-server.js
      - memory-graph-storage:/data
    environment:
      PORT: "5000"
      MCP_PORT: "5001"
      MEMORY_FILE_PATH: /data/memory_graph.json
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Context7 MCP: Live documentation context provider.
  context7-mcp:
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:context7-mcp
    labels:
      dev.dozzle.group: mcp
    build:
      context: .
      dockerfile: docker/context7-mcp.Dockerfile
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:context7-mcp
      cache_to:
        - type=inline
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ──────────────── Specialist Agents ────────────────
  # Mneme
  mneme:
    <<: *agent-common
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:mneme
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: mneme
        PORT: 10005
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:mneme
      cache_to:
        - type=inline
    ports:
      - "127.0.0.1:10005:10005"
    volumes:
      - ./agents/mneme:/app/agents/mneme
      - ./shared:/app/shared
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/mneme
          target: /app/agents/mneme
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10005/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  # Kallos
  kallos:
    <<: *agent-common
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:kallos
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: kallos
        PORT: 10004
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:kallos
      cache_to:
        - type=inline
    ports:
      - "127.0.0.1:10004:10004"
    volumes:
      - ./agents/kallos:/app/agents/kallos
      - ./shared:/app/shared
      - ./tests:/app/tests
      - kourai-artifacts-kallos:/agent-artifacts
      # Forge worktrees live under ~/.kourai_khryseai/projects on the host;
      # specialists need RW access so they can lint/fix files in a session.
      - ~/.kourai_khryseai:/home/kourai/.kourai_khryseai
      # Mount the same dir AGAIN at the host-absolute path so git worktree
      # pointers resolve. `git worktree add` writes a `.git` pointer file
      # containing `gitdir: $HOST_HOME/.kourai_khryseai/.git/worktrees/...`
      # — that's a host-side absolute path the container can't follow via
      # the /home/kourai/ mount alone. Compose expands ${HOME} host-side at
      # up-time, so this mount lands at the same physical files under both
      # paths inside the container, and git's pointer-file resolution
      # works without a relative-path rewrite (the Claude-Code git-wtadd
      # pattern researched 2026-04-27 — same idea, less moving parts).
      - ~/.kourai_khryseai:${HOME:-/root}/.kourai_khryseai
    develop:
      watch:
        - action: sync
          path: ./agents/kallos
          target: /app/agents/kallos
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  # Techne
  techne:
    <<: *agent-common
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:techne
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: techne
        PORT: 10002
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:techne
      cache_to:
