      - ~/.kourai_khryseai:/home/kourai/.kourai_khryseai
      # See Kallos's mount block above for the rationale on the second
      # host-absolute-path mount that lets git worktree pointers resolve.
      - ~/.kourai_khryseai:${HOME:-/root}/.kourai_khryseai
    develop:
      watch:
        - action: sync
          path: ./agents/dokimasia
          target: /app/agents/dokimasia
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10003
      PLAYWRIGHT_BROWSERS_PATH: /home/kourai/.cache/ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10003/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
