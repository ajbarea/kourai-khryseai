# Defines the multi-agent application infrastructure and components.
# Adheres to best practices: common anchors, explicit dependency management, and healthchecks.

# ----------------------------------------------------------------------
# EXTENSION FIELDS (Anchors)
# ----------------------------------------------------------------------
# Common configuration block for agent services to adhere to DRY principles.
# Configures shared build contexts, telemetry (OTEL), and healthcheck endpoints.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: docker/host.Dockerfile
    args:
      HOST_TYPE: agent
  env_file: .env
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
    KOURAI_STREAM_ENABLED: ${KOURAI_STREAM_ENABLED:-true}
    MEMORY_MCP_URL: http://memory-mcp:5000
    MEMORY_MCP_SSE_URL: http://memory-mcp:5001/sse
    CONTEXT7_MCP_URL: http://context7-mcp:3001/sse
    HF_TOKEN: ${HF_TOKEN:-}
    KOURAI_BUCKET_ID: ${KOURAI_BUCKET_ID:-}
    AGENT_ARTIFACTS_DIR: /agent-artifacts
  volumes:
    - ./shared:/app/shared
  networks:
    - kourai
  restart: unless-stopped
  depends_on:
    jaeger:
      condition: service_started
  logging: *default-logging

# ----------------------------------------------------------------------
# SERVICES OVERVIEW
# ----------------------------------------------------------------------
services:

  # ──────────────── Infrastructure ────────────────
  # Jaeger: Distributed tracing backend for telemetry data.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14269:14269"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: "prometheus"
      PROMETHEUS_SERVER_URL: "http://prometheus:9090"
      PROMETHEUS_QUERY_SUPPORT_SPAN_UNIT: "true"
      SPAN_STORAGE_TYPE: "memory"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # Prometheus: Time-series database for metrics aggregation.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # ──────────────── MCP Sidecars ────────────────
  # Memory MCP: Shared knowledge graph sidecar.
  memory-mcp:
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:memory-mcp
    build:
      context: .
      dockerfile: docker/memory-mcp.Dockerfile
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:memory-mcp
      cache_to:
        - type=inline
    volumes:
      - ./docker/memory-mcp-server.js:/app/memory-mcp-server.js
      - memory-graph-storage:/data
    environment:
      PORT: "5000"
      MCP_PORT: "5001"
      MEMORY_FILE_PATH: /data/memory_graph.json
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Context7 MCP: Live documentation context provider.
  context7-mcp:
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:context7-mcp
    build:
      context: .
      dockerfile: docker/context7-mcp.Dockerfile
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:context7-mcp
      cache_to:
        - type=inline
    ports:
      - "3001:3001"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ──────────────── Specialist Agents ────────────────
  # Mneme
  mneme:
    <<: *agent-common
    image: ${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:mneme
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: mneme
        PORT: 10005
      cache_from:
        - type=registry,ref=${DOCKER_HUB_USERNAME:-local}/kourai-khryseai:mneme
      cache_to:
        - type=inline
    ports:
      - "10005:10005"
    volumes:
      - ./agents/mneme:/app/agents/mneme
      - ./shared:/app/shared
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/mneme
          target: /app/agents/mneme
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10005/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  # Kallos
