  # ──────────────── Orchestrator ────────────────
  hephaestus:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: hephaestus
        PORT: 10000
    ports:
      - "10000:10000"
    volumes:
      - ./agents/hephaestus:/app/agents/hephaestus  # hot reload hephaestus code
      - ./shared:/app/shared                        # hot reload shared code
    develop:
      watch:
        - action: sync
          path: ./agents/hephaestus
          target: /app/agents/hephaestus
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10000
      # In Docker, agents talk via service names not localhost
      KOURAI_AGENT_HOST: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      jaeger:
        condition: service_started
      mneme:
        condition: service_healthy
      kallos:
        condition: service_healthy
      techne:
        condition: service_healthy
      dokimasia:
        condition: service_healthy
      metis:
        condition: service_healthy
      puck:
        condition: service_healthy
      cupid:
        condition: service_healthy
      aidos:
        condition: service_healthy
      aletheia:
        condition: service_healthy
    profiles: ["full"]

  # ──────────────── Client Interfaces ────────────────
  cli:
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: cli
        PACKAGE_NAME: cli
        PORT: 10100
    env_file: .env
    healthcheck:
      disable: true
    volumes:
      - ./hosts/cli:/app/hosts/cli            # hot reload CLI code
      - ./shared:/app/shared                  # hot reload shared code
    develop:
      watch:
        - action: sync
          path: ./hosts/cli
          target: /app/hosts/cli
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      KOURAI_AGENT_HOST: "true"
      KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10100
    networks:
      - kourai
    restart: no
    depends_on:
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["cli"]

  gui:
    build:
      context: .
