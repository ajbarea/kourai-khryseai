      PORT: 10000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
    depends_on:
      jaeger:
        condition: service_started
      mneme:
        condition: service_healthy
      kallos:
        condition: service_healthy
      techne:
        condition: service_healthy
      dokimasia:
        condition: service_healthy
      metis:
        condition: service_healthy
      puck:
        condition: service_healthy
      cupid:
        condition: service_healthy
      aidos:
        condition: service_healthy
      aletheia:
        condition: service_healthy

# ----------------------------------------------------------------------
# PERSISTENT VOLUMES
# ----------------------------------------------------------------------
# Define named volumes for persistent data storage across restarts.
volumes:
  memory-graph-storage:
    driver: local
  kourai-artifacts-kallos:
    driver: local
  kourai-artifacts-techne:
    driver: local
  kourai-artifacts-dokimasia:
    driver: local
  kourai-artifacts-metis:
    driver: local

# ----------------------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------------------
# Custom bridge network for isolated inter-container communication.
networks:
  kourai:
    driver: bridge
