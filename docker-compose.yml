    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ──────────────── Companion Spirits ────────────────
  puck:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: puck
        PORT: 10006
    ports:
      - "10006:10006"
    volumes:
      - ./agents/puck:/app/agents/puck
      - ./shared:/app/shared
    develop:
      watch:
        - action: sync
          path: ./agents/puck
          target: /app/agents/puck
