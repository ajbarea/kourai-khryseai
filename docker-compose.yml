# Kourai Khryseai — Multi-Agent A2A System
# Usage:
#   docker compose up                    # all services
#   docker compose up jaeger             # observability only
#   docker compose --profile agents up   # agents + infra
#   docker compose up mneme              # single agent + deps
#   docker compose --profile gui up      # GUI + agents + infra

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: docker/host.Dockerfile
    args:
      HOST_TYPE: agent
  env_file: .env
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
    KOURAI_STREAM_ENABLED: ${KOURAI_STREAM_ENABLED:-true}
  volumes:
    - ./shared:/app/shared                    # hot reload shared code
  networks:
    - kourai
  restart: unless-stopped
  depends_on:
    jaeger:
      condition: service_started
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ──────────────── Infrastructure ────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14269:14269"   # Metrics port for Prometheus
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # --- SPM Configuration (v1.x) ---
      METRICS_STORAGE_TYPE: "prometheus"
      PROMETHEUS_SERVER_URL: "http://prometheus:9090"
      PROMETHEUS_QUERY_SUPPORT_SPAN_UNIT: "true"
      # Enable span metrics generation
      SPAN_STORAGE_TYPE: "memory"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"     # Prometheus UI (optional to visit)
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────── Specialist Agents ────────────────
  mneme:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: mneme
        PORT: 10005
    ports:
      - "10005:10005"
    volumes:
      - ./agents/mneme:/app/agents/mneme      # hot reload mneme code
      - ./shared:/app/shared                  # hot reload shared code
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/mneme
          target: /app/agents/mneme
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10005/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    profiles: ["agents", "full"]

  kallos:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: kallos
        PORT: 10004
    ports:
