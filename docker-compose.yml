      PORT: "10010"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:10010:10010"
    volumes:
      - ./agents/vn_bridge.py:/app/agents/vn_bridge.py
      - ./shared:/app/shared
      - ~/.kourai_khryseai:/home/kourai/.kourai_khryseai
      # See Kallos's mount block above for the rationale on the second
      # host-absolute-path mount that lets git worktree pointers resolve.
      - ~/.kourai_khryseai:${HOME:-/root}/.kourai_khryseai
    networks:
      - kourai
    restart: unless-stopped
    depends_on:
      hephaestus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:10010/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    logging: *default-logging

  # ──────────────── Orchestrator ────────────────
  # Hephaestus: The central orchestration agent that manages sub-agents.
  hephaestus:
