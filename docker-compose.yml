    volumes:
      - ./agents/techne:/app/agents/techne
      - ./shared:/app/shared
      - ./tests:/app/tests
      - kourai-artifacts-techne:/agent-artifacts
      # Forge worktrees live under ~/.kourai_khryseai/projects on the host;
      # Techne writes generated code into the active session.
      - ~/.kourai_khryseai:/home/kourai/.kourai_khryseai
      # See Kallos's mount block above for the rationale on the second
      # host-absolute-path mount that lets git worktree pointers resolve.
      - ~/.kourai_khryseai:${HOME:-/root}/.kourai_khryseai
    develop:
