# Kourai Khryseai — Multi-Agent A2A System
# Usage:
#   docker compose up                      # everything (agents + infra)
#   docker compose up mneme                # single agent + deps
#
# Phase E3-E4: Infrastructure
#   - memory-mcp: Shared Knowledge Graph sidecar for player facts (E3)
#   - dokimasia: Includes Chromium + Playwright for frontend E2E testing (E4)
#   All agents can access Memory MCP via MEMORY_MCP_URL environment variable

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: docker/host.Dockerfile
    args:
      HOST_TYPE: agent
  env_file: .env
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    KOURAI_LOG_LEVEL: ${KOURAI_LOG_LEVEL:-INFO}
    KOURAI_STREAM_ENABLED: ${KOURAI_STREAM_ENABLED:-true}
    MEMORY_MCP_URL: http://memory-mcp:5000
  volumes:
    - ./shared:/app/shared                    # hot reload shared code
  networks:
    - kourai
  restart: unless-stopped
  depends_on:
    jaeger:
      condition: service_started
    # memory-mcp removed from deps until Phase 3 wires it in
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ──────────────── Infrastructure ────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14269:14269"   # Metrics port for Prometheus
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # --- SPM Configuration (v1.x) ---
      METRICS_STORAGE_TYPE: "prometheus"
      PROMETHEUS_SERVER_URL: "http://prometheus:9090"
      PROMETHEUS_QUERY_SUPPORT_SPAN_UNIT: "true"
      # Enable span metrics generation
      SPAN_STORAGE_TYPE: "memory"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"     # Prometheus UI (optional to visit)
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────── MCP Servers (Phase E3-E4) ────────────────
  memory-mcp:
    # Phase 3: Shared memory knowledge graph for Puck/Cupid/Mneme
    # Uses @modelcontextprotocol/server-memory with HTTP health check wrapper
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./docker/memory-mcp-server.js:/app/memory-mcp-server.js
      - memory-graph-storage:/data
    command: node /app/memory-mcp-server.js
    environment:
      PORT: "5000"
      MEMORY_FILE_PATH: /data/memory_graph.json
    ports:
      - "5000:5000"
    networks:
      - kourai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ──────────────── Specialist Agents ────────────────
  mneme:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: mneme
        PORT: 10005
    ports:
      - "10005:10005"
    volumes:
      - ./agents/mneme:/app/agents/mneme      # hot reload mneme code
      - ./shared:/app/shared                  # hot reload shared code
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/mneme
          target: /app/agents/mneme
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10005/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  kallos:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: kallos
        PORT: 10004
    ports:
      - "10004:10004"
    volumes:
      - ./agents/kallos:/app/agents/kallos    # hot reload kallos code
      - ./shared:/app/shared                  # hot reload shared code
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/kallos
          target: /app/agents/kallos
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  techne:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: techne
        PORT: 10002
    ports:
      - "10002:10002"
    volumes:
      - ./agents/techne:/app/agents/techne    # hot reload techne code
      - ./shared:/app/shared                  # hot reload shared code
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/techne
          target: /app/agents/techne
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10002/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  dokimasia:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: dokimasia
        PORT: 10003
    ports:
      - "10003:10003"
    volumes:
      - ./agents/dokimasia:/app/agents/dokimasia  # hot reload dokimasia code
      - ./shared:/app/shared                      # hot reload shared code
      - ./tests:/app/tests
    develop:
      watch:
        - action: sync
          path: ./agents/dokimasia
          target: /app/agents/dokimasia
        - action: sync
          path: ./shared
          target: /app/shared
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: 10003
      # Phase E4: Playwright configuration for headless browser testing
      PLAYWRIGHT_BROWSERS_PATH: /home/kourai/.cache/ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10003/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  metis:
    <<: *agent-common
    build:
      context: .
      dockerfile: docker/host.Dockerfile
      args:
        HOST_TYPE: agent
        PACKAGE_NAME: metis
        PORT: 10001
    ports:
      - "10001:10001"
    volumes:
      - ./agents/metis:/app/agents/metis      # hot reload metis code
      - ./shared:/app/shared                  # hot reload shared code
      - ./tests:/app/tests
    develop:
