[project]
name = "kourai-gui"
version = "0.1.0"
description = "Pygame GUI client for Kourai Khryseai — visual novel style agent conversations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kourai-common",
    "a2a-sdk>=0.3.0,<1.0",  # see shared/pyproject.toml — M7 (1.0.x) deferred
    "pygame-ce>=2.5.0",  # Community edition with enhanced audio support
    "pillow>=10.0",
    "httpx>=0.27",
    # M19 — RealtimeTTS bundles synthesis + playback as one streaming
    # pipeline; supersedes our hand-rolled kokoro/edge-tts backends + pygame
    # playback path. Native KokoroEngine with all six agent voices supported,
    # set_voice/set_speed for per-agent dispatch, word-level timings (free
    # win for #19 captions), and ElevenLabs migration becomes a one-line
    # engine swap. Linux system dep: apt install portaudio19-dev (PyAudio).
    "RealtimeTTS[kokoro]>=0.4.0",
    "kokoro>=0.4.0",       # M19 transitional: kept until tts_kokoro.py retires
    "soundfile>=0.13.0",   # M19 transitional: kept until tts_kokoro.py retires
    "edge-tts>=0.30.0",    # M19 transitional: RealtimeTTS includes EdgeEngine
    "emoji>=2.15.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
