[project]
name = "kourai-gui"
version = "0.1.0"
description = "Pygame GUI client for Kourai Khryseai — visual novel style agent conversations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kourai-common",
    "a2a-sdk>=0.3.0,<1.0",  # see shared/pyproject.toml — M7 (1.0.x) deferred
    "pygame-ce>=2.5.0",  # Community edition with enhanced audio support
    "pillow>=10.0",
    "httpx>=0.27",
    "kokoro>=0.4.0",       # Local neural TTS (Apache 2.0, 82M params)
    "soundfile>=0.13.0",   # WAV I/O for Kokoro audio output
    "edge-tts>=0.30.0",   # Fallback cloud TTS (remove once Kokoro is stable)
    "emoji>=2.15.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
