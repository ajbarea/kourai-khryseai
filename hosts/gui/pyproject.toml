[project]
name = "kourai-gui"
version = "0.1.0"
description = "Pygame GUI client for Kourai Khryseai — visual novel style agent conversations"
requires-python = ">=3.12"
dependencies = [
    "kourai-common",
    "a2a-sdk>=0.3.0,<1.0",
    "pygame-ce>=2.5.0",  # Community edition with enhanced audio support
    "pillow>=10.0",
    "httpx>=0.27",
    "edge-tts>=0.30.0",  # Neural TTS with real-time prosody control
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
