[project]
name = "kourai-gui"
version = "0.1.0"
description = "Pygame GUI client for Kourai Khryseai — visual novel style agent conversations"
requires-python = ">=3.12,<3.15"
dependencies = [
    "kourai-common",
    "a2a-sdk>=1.0,<2.0",  # M7 Phase 3 landed; see shared/pyproject.toml.
    "pygame-ce>=2.5.0",  # Community edition with enhanced audio support
    "pillow>=10.0",
    "httpx>=0.27",
    # M19 — RealtimeTTS bundles synthesis + playback as one streaming
    # pipeline; supersedes the hand-rolled kokoro/edge-tts backends + pygame
    # playback path. Native KokoroEngine with all six agent voices supported,
    # set_voice/set_speed for per-agent dispatch, word-level timings (free
    # win for #19 captions), and ElevenLabs migration becomes a one-line
    # engine swap. Linux system dep: apt install portaudio19-dev (PyAudio).
    "RealtimeTTS[kokoro]>=0.4.0",
    # pydub (transitively via RealtimeTTS) imports audioop, removed from
    # the stdlib in Python 3.13. audioop-lts is the community-maintained
    # backport; pydub PR #816 will add this transitively in a future
    # release, until then we declare it ourselves.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "emoji>=2.15.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
