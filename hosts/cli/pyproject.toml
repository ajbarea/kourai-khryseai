[project]
name = "kourai-cli"
version = "0.1.0"
description = "CLI client for Kourai Khryseai"
requires-python = ">=3.12"
dependencies = [
    "kourai-common",
    "a2a-sdk>=0.3.0,<1.0",
    "asyncclick>=8.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
