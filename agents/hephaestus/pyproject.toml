[project]
name = "kourai-hephaestus"
version = "0.1.0"
description = "Orchestrator agent — routes requests and manages pipelines"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kourai-common",
    "edge-tts>=0.30.0",  # VN TTS: vn-bridge uses hephaestus deps (PACKAGE_NAME=hephaestus)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
