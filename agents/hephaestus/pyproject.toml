[project]
name = "kourai-hephaestus"
version = "0.1.0"
description = "Orchestrator agent — routes requests and manages pipelines"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kourai-common",
    # VN TTS path: vn_bridge container builds with PACKAGE_NAME=hephaestus,
    # so hephaestus's deps are what reach it. Synthesis is via
    # RealtimeTTSEngine.synthesize_to_wav (M19 Phase 3) — the same engine
    # the CLI/GUI hosts use, just driven with muted=True + on_audio_chunk
    # to return WAV bytes for Ren'Py's audio system.
    "RealtimeTTS[kokoro]>=0.4.0",
    # pydub (transitive via RealtimeTTS) needs audioop, removed from
    # stdlib in 3.13; audioop-lts is the maintained backport.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
