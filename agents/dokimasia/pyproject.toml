[project]
name = "kourai-dokimasia"
version = "0.1.0"
description = "Testing agent — writes and runs pytest suites"
requires-python = ">=3.12"
dependencies = [
    "kourai-common",
    "pytest>=8.0",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
