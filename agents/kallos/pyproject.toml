[project]
name = "kourai-kallos"
version = "0.1.0"
description = "Style agent — linting, formatting, comment cleanup"
requires-python = ">=3.12,<3.15"
dependencies = [
    "kourai-common",
    "kourai-aidos",
    "ruff>=0.9",
    "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
