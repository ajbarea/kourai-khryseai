[project]
site_name = "Kourai Khryseai"
site_description = "A multi-agent system framework for AI-accelerated development"
site_author = "AJ Barea"
copyright = "AJ Barea &middot; 2026"

nav = [
  { "Home" = "index.md" },
  { "A2A Protocol" = "a2a.md" },
  { "Implementation Plan" = "implementation-plan.md" },
  { "Style Guides" = [
      { "Python" = "python-style-guide.md" },
      { "Shell" = "shell-style-guide.md" },
      { "Frontend" = "frontend-style-guide.md" },
  ]},
]

extra_css = ["stylesheets/extra.css"]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
language = "en"

features = [
    # Announcement bar
    "announce.dismiss",

    # Code blocks
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    # Content features
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Navigation
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",

    # Search
    "search.highlight",
]

# ---------------------------------------------------------------------------
# Color palette — light/dark toggle
# ---------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "amber"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "amber"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# ---------------------------------------------------------------------------
# Icon
# ---------------------------------------------------------------------------
[project.theme.icon]
logo = "material/robot"

# ---------------------------------------------------------------------------
# Social links (footer)
# ---------------------------------------------------------------------------
[project.extra]
generator = false
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/ajbarea/Kourai_Khryseai", name = "Kourai Khryseai on GitHub" },
]
