[project]
site_name = "Kourai Khryseai"
site_description = "Interactive multi-agent development. Collaborate with six specialized AI agents in real-time—you guide each step, they show their work, iterate on feedback."
site_author = "AJ Barea"
copyright = "AJ Barea &middot; 2026"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/particles.js"]

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav = [
  { "Home" = "index.md" },
  { "Overview" = "overview.md" },
  { "Getting Started" = "getting-started.md" },
  { "Agents" = [
      { "Overview" = "agents/index.md" },
      { "Specialists" = "agents/specialists.md" },
  ]},
  { "Architecture" = [
      { "Overview" = "architecture/index.md" },
      { "Internals" = "architecture/internals.md" },
      { "Infrastructure" = "architecture/infrastructure.md" },
      { "TTS System" = "architecture/tts.md" },
  ]},
  { "CLI Reference" = "cli.md" },
  { "GUI Reference" = "gui.md" },
  { "Configuration" = "configuration.md" },
  { "Pricing" = "pricing.md" },
  { "Style Guides" = [
      { "Python" = "python-style-guide.md" },
      { "Shell" = "shell-style-guide.md" },
      { "Frontend" = "frontend-style-guide.md" },
  ]},
]

# ---------------------------------------------------------------------------
# Theme & Visuals
# ---------------------------------------------------------------------------
[project.theme]
name = "material" # Zensical uses 'material' as the foundation
language = "en"
icon.logo = "material/robot"
font.text = "Inter"
font.code = "JetBrains Mono"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "search.share",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

# ---------------------------------------------------------------------------
# Plugins & Extensions
# ---------------------------------------------------------------------------
[project.plugins]
search = { engine = "disco" } # Enable the 2026 'Disco' search engine
social = {}



# ---------------------------------------------------------------------------
# Social & Metadata
# ---------------------------------------------------------------------------
[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/kourai-khryseai"
name = "Kourai Khryseai on GitHub"
