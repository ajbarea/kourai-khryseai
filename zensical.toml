[project]
site_name = "Kourai Khryseai"
site_description = "A multi-agent system framework for AI-accelerated development"
site_author = "AJ Barea"
copyright = "AJ Barea &middot; 2026"

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Style Guides" = [
      { "Python" = "python-style-guide.md" },
      { "Shell" = "shell-style-guide.md" },
      { "Frontend" = "frontend-style-guide.md" },
  ]},
]

# ---------------------------------------------------------------------------
# Theme & Visuals
# ---------------------------------------------------------------------------
[project.theme]
name = "material" # Zensical uses 'material' as the foundation
language = "en"
icon.logo = "material/robot"
font.text = "Inter"
font.code = "JetBrains Mono"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "search.share",
]

[[project.theme.palette]]
scheme = "default"
primary = "amber"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "amber"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Plugins & Extensions
# ---------------------------------------------------------------------------
[project.plugins]
search = { engine = "disco" } # Enable the 2026 'Disco' search engine
social = {}

# ---------------------------------------------------------------------------
# Extra Assets
# ---------------------------------------------------------------------------
extra_css = ["stylesheets/extra.css"]

# ---------------------------------------------------------------------------
# Social & Metadata
# ---------------------------------------------------------------------------
[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/Kourai_Khryseai"
name = "Kourai Khryseai on GitHub"
